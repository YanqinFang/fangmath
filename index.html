<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prof. Fang Math — Experience first. Symbols second. Understanding always.</title>
<meta name="description" content="Free K–12 math lessons, notes, worksheets, videos, games, flash cards and a weekly challenge from Prof. Fang Math.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjs@14.9.1/lib/browser/math.js"></script>
<script src="content.js"></script>
<script src="testprep.js"></script>
<style>
  :root{
    --bg:#FBF8F3; --surface:#FFFFFF; --ink:#16233B; --muted:#5B6474; --faint:#8C93A0; --line:#E8E2D8;
    --navy:#1F3A68; --teal:#0F7C7C; --teal-soft:#DDF0EE; --gold:#C9962B; --gold-soft:#FBF1DC; --red:#B3261E; --green:#1E7A45; --green-soft:#DDF4E6;
    --radius:18px; --shadow:0 8px 26px rgba(22,35,59,.07);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--teal)}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
  button,input,select{font:inherit;color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  .hidden{display:none!important}

  /* header */
  header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
  header.top .in{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:24px}
  .brand{font-family:Inter,sans-serif;font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
  .brand span{color:var(--teal)}
  nav.main{display:flex;gap:4px;margin-left:auto}
  nav.main a{padding:8px 11px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px;white-space:nowrap}
  nav.main a:hover{background:var(--bg)}
  nav.main a.active{color:var(--teal);font-weight:600}
  .menu-btn{display:none;margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:18px;cursor:pointer}
  @media (max-width:1340px){
    .menu-btn{display:block}
    nav.main{display:none;position:absolute;top:64px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);flex-direction:column;padding:8px 12px 14px;gap:2px}
    nav.main.open{display:flex}
    nav.main a{padding:12px 14px;border-radius:12px}
  }

  /* hero */
  .hero{text-align:center;padding:56px 0 34px}
  .wordmark{font-family:Inter,sans-serif;font-weight:800;font-size:clamp(46px,9vw,112px);line-height:1;letter-spacing:-.045em;margin:0}
  .wordmark .m{color:var(--teal);position:relative;display:inline-block}
  .wordmark .m::after{content:"";position:absolute;left:4%;right:4%;bottom:-.06em;height:.1em;border-radius:99px;background:var(--gold)}
  .tagline{font-size:clamp(17px,2.2vw,22px);color:var(--muted);margin:22px 0 0}
  .tagline b{color:var(--ink);font-weight:600}
  .hero-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;font-size:15px;background:var(--navy);color:#fff}
  .btn:hover{filter:brightness(1.1)}
  .btn.teal{background:var(--teal)}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{background:var(--bg);filter:none}
  .btn.sm{padding:7px 14px;font-size:14px}
  .btn:disabled{opacity:.5;cursor:default}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;min-width:0}
  .problem{max-width:860px;margin:10px auto 0;text-align:left}
  .problem .lbl{display:inline-block;background:var(--gold-soft);color:#8A6415;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 11px}
  .problem .q{font-family:Fraunces,Georgia,serif;font-size:clamp(19px,2.3vw,24px);line-height:1.45;margin:12px 0 16px}

  section.block{padding:44px 0}
  .sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .sec-head h2{font-size:clamp(26px,3.4vw,36px)}
  .sec-head p{margin:6px 0 0;color:var(--muted)}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .course{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;border-top:5px solid var(--c);transition:transform .15s}
  .course:hover{transform:translateY(-2px)}
  .course h3{font-size:22px}
  .course p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
  .course .meta{font-size:13px;color:var(--faint);font-weight:500}
  .course .go{color:var(--c);font-weight:600;font-size:14.5px}

  .moves{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:m}
  @media (max-width:820px){.moves{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .move{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;position:relative}
  .move::before{counter-increment:m;content:counter(m);position:absolute;top:12px;right:14px;font-family:Fraunces,serif;font-size:26px;color:var(--line)}
  .move b{display:block;font-family:Fraunces,serif;font-size:18px;font-weight:600}
  .move span{font-size:14px;color:var(--muted)}

  .promo{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .promo .card{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit}
  .promo .ic{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--teal-soft)}
  .promo h3{font-size:20px}
  .promo p{margin:2px 0 0;color:var(--muted);font-size:14.5px}

  /* page */
  .page-head{padding:34px 0 18px}
  .crumbs{font-size:14px;color:var(--faint);margin-bottom:8px}
  .crumbs a{color:var(--muted);text-decoration:none}
  .page-head h1{font-size:clamp(30px,4.5vw,46px)}
  .page-head p{color:var(--muted);margin:8px 0 0;max-width:720px}
  .unit{margin-bottom:12px;padding:0;overflow:hidden}
  .unit summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;font-weight:600;font-size:17px}
  .unit summary::-webkit-details-marker{display:none}
  .unit summary .n{font-size:13px;font-weight:600;color:var(--faint);white-space:nowrap}
  .unit summary .chev{transition:transform .2s;color:var(--faint)}
  .unit[open] summary .chev{transform:rotate(90deg)}
  .unit .lessons{border-top:1px solid var(--line);padding:6px 10px 10px}
  .lesson-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;text-decoration:none;color:inherit}
  .lesson-row:hover{background:var(--bg)}
  .lesson-row .tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--muted);white-space:nowrap}
  .tag.v{background:#FDE7E3;color:#B3261E}
  .soon{padding:14px 12px;color:var(--faint);font-size:14.5px}

  .lesson-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
  @media (max-width:860px){.lesson-grid{grid-template-columns:minmax(0,1fr)}}
  .video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#101a2d;display:grid;place-items:center;color:#c9d2e3;text-align:center}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .res-list{display:flex;flex-direction:column;gap:10px}
  .res{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;background:#fff}
  .res:hover{border-color:var(--teal)}
  .res .ic{font-size:22px}
  .res b{display:block;font-size:15px}
  .res span{font-size:13px;color:var(--faint)}
  .steps{list-style:none;padding:0;margin:14px 0 0;counter-reset:s}
  .steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
  .steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:2px}

  /* challenge */
  .move-btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  .mv{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
  .mv.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .hint{background:var(--bg);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .hint b{color:var(--navy)}
  .answer{background:var(--green-soft);border-radius:14px;padding:14px 16px}
  .arch{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 4px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  .arch:hover{color:var(--teal)}

  /* games */
  .game{max-width:560px;margin:0 auto;text-align:center}
  .opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
  .opt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;min-width:52px}
  .opt.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .bigq{font-family:Fraunces,Georgia,serif;font-size:clamp(38px,8vw,60px);margin:14px 0}
  .ans-in{font-size:28px;text-align:center;width:180px;border:2px solid var(--line);border-radius:14px;padding:8px}
  .ans-in:focus{outline:none;border-color:var(--teal)}
  .scorebar{display:flex;justify-content:center;gap:22px;font-weight:600;color:var(--muted);margin-top:4px}
  .scorebar b{color:var(--ink);font-size:22px;display:block}
  .flash{animation:none}
  .ok{color:var(--green)} .bad{color:var(--red)}

  /* flash cards */
  .deck-wrap{max-width:620px;margin:0 auto}
  .fc{perspective:1200px;cursor:pointer;margin:10px 0 14px}
  .fc .inner{position:relative;height:300px;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .inner{transform:rotateY(180deg)}
  .fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:var(--shadow)}
  .fc .front{background:var(--navy);color:#fff;font-family:Fraunces,Georgia,serif;font-size:clamp(26px,5vw,36px)}
  .fc .back{background:#fff;border:2px solid var(--teal);transform:rotateY(180deg);font-size:19px;line-height:1.55}
  @media (prefers-reduced-motion:reduce){.fc .inner{transition:none}}
  .fc-ctrl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
  .progress span{display:block;height:100%;background:var(--teal)}

  nav.main a.acct{background:var(--navy);color:#fff;font-weight:600;margin-left:6px}
  nav.main a.acct:hover{background:var(--navy);filter:brightness(1.12)}
  @media (max-width:1340px){nav.main a.acct{margin:6px 0 0;text-align:center}}
  .login-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:820px){.login-grid{grid-template-columns:minmax(0,1fr)}}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:12px}
  .fin{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px;width:100%}
  .fin:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
  .code-in{font-size:26px;letter-spacing:.25em;text-transform:uppercase;text-align:center;font-weight:700}
  .err{color:var(--red);font-size:14px;min-height:20px;margin:4px 0}
  .okmsg{color:var(--green);font-size:14px;font-weight:600}
  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px}
  .kidbtn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 8px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
  .kidbtn:hover{border-color:var(--teal)}
  .kidbtn .av{font-size:34px;line-height:1}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin:14px 0}
  .pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy)}
  .pin-dots i.on{background:var(--navy)}
  .pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
  .pinpad button{height:60px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:600;cursor:pointer}
  .pinpad button:active{background:var(--bg)}
  .tabs2{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px}
  .tabs2 button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:600;cursor:pointer;color:var(--muted)}
  .tabs2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin:4px 0 12px}
  .check input{margin-top:3px;width:18px;height:18px;flex:none}
  .kids{display:flex;flex-direction:column;gap:10px}
  .kid{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;flex-wrap:wrap}
  .kid .av{font-size:30px}
  .kid .nm{font-weight:700}
  .kid .meta{font-size:13px;color:var(--faint)}
  .kid .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .codebox{display:inline-block;font-size:28px;font-weight:800;letter-spacing:.2em;background:var(--gold-soft);color:#8A6415;border-radius:14px;padding:6px 16px;margin:4px 0}
  .avs{display:flex;gap:6px;flex-wrap:wrap}
  .avs button{font-size:24px;width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer}
  .avs button.on{border-color:var(--teal);background:var(--teal-soft)}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .stat{background:var(--bg);border-radius:14px;padding:12px 14px}
  .stat .k{font-size:13px;color:var(--muted)}
  .stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  table.rec{width:100%;border-collapse:collapse;font-size:14.5px}
  table.rec th{text-align:left;color:var(--muted);font-size:12.5px;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
  table.rec td{padding:9px 6px;border-bottom:1px solid var(--line)}
  .scroll{overflow-x:auto}
  .pct{font-weight:700;font-variant-numeric:tabular-nums}
  .saved{font-size:14px;margin-top:10px;min-height:20px}
  .quiz-q{padding:14px 0;border-top:1px dashed var(--line)}
  .quiz-q:first-of-type{border-top:0}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .choice{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}
  .choice.right{border-color:var(--green);background:var(--green-soft)}
  .choice.wrong{border-color:var(--red);background:#FDE7E3}
  .modal{position:fixed;inset:0;background:rgba(22,35,59,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
  .modal .card{width:100%;max-width:560px;max-height:90vh;overflow:auto}
  @media print{header.top,footer,.noprint{display:none!important}.modal{position:static;background:none;padding:0}.modal .card{box-shadow:none;border:0;max-height:none}}
  .logincards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .logincard{border:1.5px dashed var(--faint);border-radius:12px;padding:12px;font-size:14px}
  .logincard b{font-size:17px}
  .tp-doms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
  .tp-dom{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;background:#fff}
  .tp-dom:hover{border-color:var(--teal)}
  .tp-dom span{font-size:13px;color:var(--faint)}
  .tp-dom.all{background:var(--teal-soft);border-color:var(--teal-soft)}
  .tp-split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:860px){.tp-split{grid-template-columns:minmax(0,1fr)}}
  .tp-passage{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
  @media (max-width:860px){.tp-passage{position:static;max-height:46vh}}
  .tp-ptitle{font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:600;margin-bottom:8px}
  .tp-ptext{font-size:16px;line-height:1.75}
  .tp-ptext .ul sup,.tp-ptext .qn{font-weight:700;color:var(--navy);margin-right:2px;font-size:11px}
  .tp-ptext .ul.on u,.tp-ptext .qn.on{background:var(--gold-soft);text-decoration-color:var(--gold)}
  .tp-ptext .ul.on sup{color:#8A6415}
  .tp-meta{font-size:13px;font-weight:600;color:var(--faint);margin-bottom:8px}
  .tp-short{background:var(--bg);border-radius:12px;padding:14px 16px;font-size:16.5px;line-height:1.65;margin-bottom:12px}
  .tp-stem{font-size:17.5px;font-weight:500;line-height:1.55;margin-bottom:12px}
  .tp-choices{display:flex;flex-direction:column;gap:8px}
  .tp-choice{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;cursor:pointer;font-size:16px;line-height:1.45}
  .tp-choice:hover:not(:disabled){border-color:var(--teal)}
  .tp-choice .L{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-weight:700;font-size:13px}
  .tp-choice.sel{border-color:var(--navy);background:#EEF2FA}
  .tp-choice.sel .L{background:var(--navy);border-color:var(--navy);color:#fff}
  .tp-choice.right{border-color:var(--green);background:var(--green-soft)}
  .tp-choice.right .L{background:var(--green);border-color:var(--green);color:#fff}
  .tp-choice.wrong{border-color:var(--red);background:#FDE7E3}
  .tp-choice:disabled{cursor:default;color:inherit}
  .tp-grid{display:flex;flex-direction:column;gap:6px}
  .tp-fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.55}
  .tp-fb.good{background:var(--green-soft)} .tp-fb.bad{background:#FDE7E3}
  .tp-btns{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
  .tp-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .tp-timer{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
  .tp-timer.low{color:var(--red);border-color:var(--red)}
  .tp-nav{display:flex;gap:6px;flex-wrap:wrap}
  .tp-chip{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;font-size:13px}
  .tp-chip.ans{background:var(--teal-soft);border-color:var(--teal)}
  .tp-chip.cur{outline:2px solid var(--navy)}
  .tp-review{border-top:1px solid var(--line);padding:10px 0}

      h("div", { class:"sv-work" }, h("label", { class:"f", style:"margin-top:10px" }, "Write your next step", inp), prev, keypad(inp, upd),
        h("div", { style:"display:flex;gap:8px;flex-wrap:wrap;margin-top:12px" }, checkBtn, hintBtn, finalBtn)));
    drawList(); say("hint", solveMode === "eq" ? `Write one step at a time until you reach $${vr} = $ a number.` : "Write one step at a time. I'll check that each step is still equal to the original.");
    setTimeout(() => inp.focus(), 50);
  }
}
function keypad(inp, upd){
  const keys = [["x", "x"], ["x²", "^2"], ["(", "("], [")", ")"], ["/", "/"], ["=", " = "], ["±", "±"], ["or", " or "]];
  return h("div", { class:"sv-keys" }, keys.map(([label, ins]) => h("button", { type:"button", onclick:() => {
    const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, a) + ins + inp.value.slice(b); const pos = a + ins.length; inp.focus(); inp.setSelectionRange(pos, pos); upd(); } }, label)));
}

/* ---------- a practice app (e.g. practice/algebra2.html), shown inside the site ---------- */
// Apps in this site's own folder talk to the page through postMessage: answers, quiz scores and page height.
function pageApp(v, cid, ui, mode){
  const c = courseById(cid); if (!c) return notFound(v);
  const u = ui != null && ui !== "" && ui !== "all" ? c.units[+ui] : null;
  const url = (u && u.app) || c.app;
  const local = url && /^[\w\-\/]+\.html(\?[\w=&\-]*)?$/.test(url), external = url && /^https:\/\//.test(url);
  if (!local && !external) return notFound(v);
  mode = mode === "practice" ? "practice" : "learn";
  const src = local ? url + (url.includes("?") ? "&" : "?") + "embed=1&mode=" + mode : url;
  const title = u ? u.title.replace(/^\d+\.\s*/, "") : c.title + " — all chapters";
  const frame = h("iframe", { src, title: title + " practice", style:"width:100%;height:" + (local ? "900px" : "calc(100vh - 210px)") + ";min-height:560px;border:1px solid var(--line);border-radius:16px;background:#fff;display:block" });
  const live = h("div", { class:"muted", style:"font-weight:600;font-size:14px" }), note = h("div", { class:"saved", style:"margin:0" });
  v.append(h("div", { class:"wrap" },
    h("div", { class:"page-head", style:"padding-bottom:10px" }, h("div", { class:"crumbs" }, h("a", { href:"#/course/" + c.id }, c.title), u ? " / " + u.title : ""),
      h("div", { style:"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end" },
        h("h1", { style:"font-size:clamp(26px,3.6vw,36px)" }, "🧩 " + title),
        external ? h("a", { class:"btn sm ghost", href:url, target:"_blank", rel:"noopener" }, "Open in a new tab ↗") : null)),
    local ? modeTabs(mode, m => `#/app/${c.id}/${ui == null || ui === "" ? "all" : ui}/${m}`) : null,
    local ? h("p", { class:"mode-note" }, mode === "learn"
      ? "Learn: concept box, hints and two tries per problem. Pick a topic and difficulty, then keep going — your session is saved when you switch topics or leave."
      : "Practice: choose a topic and difficulty, then start a quiz. No hints. Your quiz score is saved.") : null,
    local ? h("div", { style:"display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:-4px 0 10px" }, live, note) : null,
    frame,
    external ? h("p", { class:"muted", style:"font-size:13px;margin-top:8px" }, "This app is on another website, so its scores are not added to the student's Prof. Fang Math record.") : null));
  if (!local) return;
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : "";
  let ses = null;   // current Learn session: one topic + difficulty
  const showLive = () => { live.textContent = ses && ses.n ? `This session: ${ses.right} / ${ses.n} correct · ${ses.label} (${cap(ses.diff)})` : ""; };
  const flush = () => { if (ses && ses.n) record("practice", `${c.id}:app:${ses.topic}:${ses.diff}`, `Learn: ${c.title} · ${ses.label} (${cap(ses.diff)})`, ses.right, ses.n, {}, Math.round((Date.now() - ses.t0) / 1000), note); ses = null; showLive(); };
  const onMsg = e => {
    if (e.origin !== location.origin || e.source !== frame.contentWindow || !e.data || e.data.source !== "fm-alg2") return;
    const d = e.data;
    if (d.type === "height") frame.style.height = Math.max(560, Math.min(d.h + 24, 6000)) + "px";
    else if (d.type === "answer" && !d.quiz) {
      if (ses && (ses.topic !== d.topic || ses.diff !== d.difficulty)) flush();
      if (!ses) ses = { topic: d.topic, diff: d.difficulty, label: String(d.label).slice(0, 80), n: 0, right: 0, t0: Date.now() };
      ses.n++; if (d.ok) ses.right++; showLive();
    } else if (d.type === "quiz") {
      record("quiz", `${c.id}:app:${d.topic}:${d.difficulty}`, `${c.title} · ${String(d.label).slice(0, 80)} quiz (${cap(d.difficulty)})`, +d.right, +d.total, {}, null, note);
    }
  };
  window.addEventListener("message", onMsg);
  const onHide = () => flush();
  window.addEventListener("pagehide", onHide);
  window.appCleanup = () => { flush(); window.removeEventListener("message", onMsg); window.removeEventListener("pagehide", onHide); };
}

function notFound(v){ v.append(h("div", { class:"wrap" }, h("div", { class:"page-head" }, h("h1", {}, "Page not found"), h("p", {}, h("a", { href:"#/" }, "← Back home"))))); }

$("yr").textContent = new Date().getFullYear();
$("footLinks").append(h("span", {}, h("a", { href:"mailto:" + SITE.email }, SITE.email), SITE.youtube ? [" · ", h("a", { href:SITE.youtube, target:"_blank", rel:"noopener" }, "YouTube")] : null, " · ", h("a", { href:SITE.pma, target:"_blank", rel:"noopener" }, "Parents Meet AI")));
(async () => { updateAcct(); if (accountsOn) { try { await loadAdult(); } catch (e) {} } route(); })();
</script>
