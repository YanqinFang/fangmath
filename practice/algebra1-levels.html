<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --ink:#16233B; --muted:#5B6474; --faint:#8C93A0; --line:#E8E2D8;
  --navy:#1F3A68; --teal:#0F7C7C; --teal-soft:#DDF0EE; --gold:#C9962B; --gold-soft:#FBF1DC; --red:#B3261E; --red-soft:#FBE7E5; --green:#1E7A45; --green-soft:#DDF4E6;
  --l1:#2E8B57; --l2:#0F7C7C; --l3:#1F3A68; --l4:#B7472A; --l5:#6A4BD8;
  --radius:18px; --shadow:0 8px 26px rgba(22,35,59,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
header.top .in{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:24px}
.brand{font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--teal)}
.back{margin-left:auto;font-size:15px;text-decoration:none;color:var(--muted);font-weight:500}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 48px;display:flex;flex-direction:column;gap:20px}
.intro h1{font-size:clamp(28px,4vw,40px)}
.intro p{color:var(--muted);margin:6px 0 0;max-width:680px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;font-weight:600;border:1px solid transparent;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
.btn.teal{background:var(--teal)} .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus{outline:2px solid var(--teal);outline-offset:1px}
/* level legend */
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lg{border-radius:12px;padding:10px 12px;background:var(--bg);border-left:4px solid var(--c)}
.lg b{display:block;font-size:14px;color:var(--c)} .lg span{font-size:13px;color:var(--muted)}
/* placement */
.place{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--teal-soft),#fff 70%);border:1.5px solid var(--teal)}
.place .t b{font-family:Fraunces,Georgia,serif;font-size:20px;display:block}
.place .t span{color:var(--muted);font-size:15px}
.rec{font-weight:600;color:var(--teal)}
/* topics */
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.topics{grid-template-columns:minmax(0,1fr)}}
.topic{display:flex;flex-direction:column;gap:12px}
.topic h2{font-size:22px}
.idea{color:var(--muted);font-size:15px;margin:0}
.example{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;overflow-x:auto}
.example .q{font-size:17px;margin-bottom:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--c)}
.pill.on{background:var(--c);border-color:var(--c);color:#fff}
.pill .n{font-weight:500;opacity:.75;margin-left:4px}
.pill.star::after{content:"★";position:absolute;top:-8px;right:-4px;font-size:12px;color:var(--gold)}
/* practice */
.practice{display:flex;flex-direction:column;gap:14px;scroll-margin-top:80px}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.phead h2{font-size:24px}
.problem{font-size:clamp(19px,2.6vw,24px);padding:16px 18px;border-radius:14px;background:var(--bg);overflow-x:auto;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 240px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--bg)}
.preview{font-size:18px;min-height:1.4em}
.preview .pl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin-right:8px}
.howto{font-size:13px;color:var(--faint)}
.fb{border-radius:12px;padding:10px 14px;font-size:15px;overflow-x:auto}
.fb.good{background:var(--green-soft)} .fb.bad{background:var(--red-soft)} .fb.hint{background:var(--gold-soft)}
.fb .tag{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.fb.good .tag{color:var(--green)} .fb.bad .tag{color:var(--red)} .fb.hint .tag{color:var(--gold)}
.sol{margin:6px 0 0;padding-left:20px} .sol li{margin:2px 0}
.suggest{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1.5px dashed var(--c);border-radius:12px;padding:10px 14px}
.streak{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--faint)}
.streak i{width:10px;height:10px;border-radius:50%;background:var(--line)} .streak i.ok{background:var(--green)} .streak i.no{background:var(--red)}
/* modal quiz */
.modal{position:fixed;inset:0;background:rgba(22,35,59,.45);display:grid;place-items:center;padding:16px;z-index:60}
.modal .card{width:min(620px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.qprog{display:flex;gap:6px} .qprog i{flex:1;height:6px;border-radius:3px;background:var(--line)} .qprog i.ok{background:var(--green)} .qprog i.no{background:var(--red)} .qprog i.now{background:var(--teal)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:none;background:none;padding:10px 16px;font-weight:600;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.learn,.pview{display:flex;flex-direction:column;gap:20px}
.road{display:flex;gap:8px;flex-wrap:wrap}
.stop{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.stop i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px;border:1.5px solid var(--line)}
.stop.done i{background:var(--green);border-color:var(--green);color:#fff}
.stop.on{border-color:var(--teal);background:var(--teal-soft)}
.lesson{display:flex;flex-direction:column;gap:16px;scroll-margin-top:80px}
.lesson h2{font-size:clamp(24px,3vw,30px)}
.big{font-size:18px;background:var(--teal-soft);border-radius:14px;padding:14px 16px;overflow-x:auto}
.big b{color:var(--teal)}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;counter-reset:k}
.steps li{counter-increment:k;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;background:var(--bg);border-radius:12px;padding:10px 12px;animation:pop .25s ease}
.steps li::before{content:counter(k);width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps .m{font-size:19px;overflow-x:auto} .steps .w{font-size:14px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.steps li{animation:none}}
.warn{background:var(--red-soft);border-radius:14px;padding:12px 16px;font-size:15px;overflow-x:auto}
.warn b{color:var(--red)}
.turn{border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.turn .q{font-size:19px;overflow-x:auto}
.lnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
footer{text-align:center;color:var(--faint);font-size:13px;padding:24px}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chap{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chap i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px}
.chap.on{background:var(--navy);border-color:var(--navy);color:#fff} .chap.on i{background:rgba(255,255,255,.2)}
.chap.soon{opacity:.45;cursor:default}
</style>

<script>
"use strict";
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let x;do{x=rnd(a,b)}while(x===0);return x};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const sg=k=>k>=0?"+ "+k:"- "+(-k);            // "+ 3" / "- 3"
const P=n=>n<0?"("+n+")":String(n);            // wrap negatives
function co(a,v){ return (a===1?"":a===-1?"-":String(a))+v; }   // coefficient with variable
function lin(a,b,v="x"){ if(a===0) return String(b); let s=co(a,v); if(b) s+=" "+sg(b); return s; }
function cterm(a,v){ return (a<0?"- ":"+ ")+(Math.abs(a)===1?"":Math.abs(a))+v; } // signed term for middle
function frac(n,d){ if(d<0){n=-n;d=-d} const g=gcd(n,d)||1; n/=g; d/=g; return d===1?String(n):(n<0?"-":"")+"\\frac{"+Math.abs(n)+"}{"+d+"}"; }
const OPT={"<":"<","<=":"\\le",">":">",">=":"\\ge"}; const FLIP={"<":">","<=":">=",">":"<",">=":"<="};
const pt=(x,y)=>`(${x}, ${y})`;
const sq2=h=>`(x ${sg(-h)})^2`;
const divisors=n=>{n=Math.abs(n);const d=[];for(let i=1;i<=n;i++) if(n%i===0) d.push(i);return d;};
const LEVELS=[
 {n:1,name:"Foundation",zh:"起步",desc:"Review the basics first",c:"var(--l1)"},
 {n:2,name:"Basic",zh:"基础",desc:"Textbook examples",c:"var(--l2)"},
 {n:3,name:"Standard",zh:"标准",desc:"School test level",c:"var(--l3)"},
 {n:4,name:"Challenge",zh:"挑战",desc:"Honors / hard SAT",c:"var(--l4)"},
 {n:5,name:"Competition",zh:"竞赛",desc:"MATHCOUNTS / AMC 8–10 style",c:"var(--l5)"}];
const HOW={point:"Type a point like (2, -5).",yn:"Type yes or no.",list:"List the values separated by commas, like -2, 0, 5.",line:"Type an equation like y = 2x + 3 (any correct form works).",number:"Type a number. Fractions like 9/4 are fine.",set:"Type the value, like 4 or x = 4.",expr:"Type an expression like 7x - 1 or (c - b)/a.",
  ineq:"Type like x > 3 or x <= -2 (≤ and ≥ work too).",between:"Type like -2 < x <= 4.",or:"Type like x < -5 or x > 3."};
const ineqTex=(op,v)=>`x ${OPT[op]} ${v}`;

/* ================= chapters =================
   generators return {q, type, ans, ansTex, hint, sol[]} */
const CHAPTERS=[
{id:"ch1",title:"Foundations of Algebraic Thinking",topics:[
 {id:"ops",title:"Order of Operations",idea:"<b>P</b>arentheses → <b>E</b>xponents → <b>M</b>ultiply/<b>D</b>ivide (left to right) → <b>A</b>dd/<b>S</b>ubtract (left to right).",
  lesson:{steps:[["3 + 4 \\times 2","Multiplication comes before addition."],["= 3 + 8","Multiply first: $4 \\times 2 = 8$."],["= 11","Then add."]],warn:"Don't just go left to right: $3 + 4 \\times 2$ is $11$, not $14$."},
  gen:[
  ()=>{const a=rnd(2,9),b=rnd(2,9),c=rnd(2,9);return{q:`Evaluate $${a} + ${b} \\times ${c}$.`,type:"number",ans:a+b*c,ansTex:`${a+b*c}`,hint:"Multiplication comes before addition.",sol:[`Multiply first: $${b} \\times ${c} = ${b*c}$.`,`Add: $${a} + ${b*c} = ${a+b*c}$.`]}},
  ()=>{const a=rnd(1,9),b=rnd(1,9),c=rnd(2,6),d=rnd(1,20),v=(a+b)*c-d;return{q:`Evaluate $(${a} + ${b}) \\times ${c} - ${d}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Parentheses first.",sol:[`Parentheses: $${a} + ${b} = ${a+b}$.`,`Multiply: $${a+b} \\times ${c} = ${(a+b)*c}$.`,`Subtract: $${(a+b)*c} - ${d} = ${v}$.`]}},
  ()=>{const b=rnd(2,6),c=pick(divisors(b*b).filter(x=>x>1)),a=rnd(1,20),d=nz(-9,9),v=a-b*b/c+d;return{q:`Evaluate $${a} - ${b}^2 \\div ${c} ${sg(d)}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Exponent first, then divide, then add and subtract from left to right.",sol:[`Exponent: $${b}^2 = ${b*b}$.`,`Divide: $${b*b} \\div ${c} = ${b*b/c}$.`,`Left to right: $${a} - ${b*b/c} ${sg(d)} = ${v}$.`]}},
  ()=>{let m,b,c,a,d;do{m=nz(-6,6);b=rnd(1,9);c=rnd(1,9);a=m-2*(b-c);d=pick(divisors(m*m))}while(a===0);const v=m*m/d;return{q:`Evaluate $\\left[${a} + 2(${b} - ${c})\\right]^2 \\div ${d}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Work from the innermost parentheses outward.",sol:[`Inner: $${b} - ${c} = ${b-c}$, so $2(${b-c}) = ${2*(b-c)}$.`,`Bracket: $${a} + ${P(2*(b-c))} = ${m}$.`,`Square and divide: $${P(m)}^2 \\div ${d} = ${m*m} \\div ${d} = ${v}$.`]}},
  ()=>{const p=rnd(2,4),x=rnd(1,6),y=rnd(1,9),z=rnd(1,9),f=p*x-y,v=p*f-z;return{q:`Define $a \\star b = ${p}a - b$. Find $(${x} \\star ${y}) \\star ${z}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Work out the parentheses first: replace $a$ with the first number and $b$ with the second.",sol:[`$${x} \\star ${y} = ${p}(${x}) - ${y} = ${f}$.`,`$${P(f)} \\star ${z} = ${p}(${f}) - ${z} = ${v}$.`]}}
 ]},
 {id:"eval",title:"Evaluating Expressions",idea:"Replace each variable with its value <b>in parentheses</b>, then follow the order of operations.",
  lesson:{steps:[["3x + 2 \\text{ when } x = 4","Put $4$ in place of $x$."],["3(4) + 2","Use parentheses when you substitute."],["= 12 + 2 = 14","Multiply, then add."]],warn:"With negatives, always use parentheses: if $x = -3$, then $x^2 = (-3)^2 = 9$, not $-9$."},
  gen:[
  ()=>{const a=rnd(2,9),b=rnd(1,9),v=rnd(1,9);return{q:`Evaluate $${a}x + ${b}$ when $x = ${v}$.`,type:"number",ans:a*v+b,ansTex:`${a*v+b}`,hint:`Replace $x$ with $${v}$: $${a}(${v}) + ${b}$.`,sol:[`$${a}(${v}) + ${b} = ${a*v} + ${b} = ${a*v+b}$.`]}},
  ()=>{const a=rnd(2,5),b=nz(-9,9),v=-rnd(1,6);return{q:`Evaluate $${a}x^2 ${sg(b)}$ when $x = ${v}$.`,type:"number",ans:a*v*v+b,ansTex:`${a*v*v+b}`,hint:`Square first: $(${v})^2 = ${v*v}$ — positive!`,sol:[`$(${v})^2 = ${v*v}$.`,`$${a}(${v*v}) ${sg(b)} = ${a*v*v+b}$.`]}},
  ()=>{const k=rnd(2,4),x=nz(-4,5),y=nz(-5,5),v=x*x-k*x*y+y;return{q:`Evaluate $x^2 - ${k}xy + y$ when $x = ${x}$ and $y = ${y}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Substitute both values in parentheses, then do exponents, multiplication, and finally addition/subtraction.",sol:[`$(${x})^2 - ${k}(${x})(${y}) + (${y})$.`,`$= ${x*x} ${sg(-k*x*y)} ${sg(y)} = ${v}$.`]}},
  ()=>{let x,y;do{x=nz(-6,6);y=nz(-9,9)}while(x+y===0||(x*x-y)%(x+y)!==0||(x*x-y)===0);const v=(x*x-y)/(x+y);return{q:`Evaluate $\\dfrac{x^2 - y}{x + y}$ when $x = ${x}$ and $y = ${y}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Work out the top and the bottom separately, then divide.",sol:[`Top: $(${x})^2 - (${y}) = ${x*x-y}$.`,`Bottom: $${x} + (${y}) = ${x+y}$.`,`$${x*x-y} \\div ${P(x+y)} = ${v}$.`]}},
  ()=>{const p=rnd(2,5),q=rnd(1,4),s=rnd(5,20),k=rnd(2,4),c=nz(-9,9),v=k*s+c;return{q:`If $${p}x + ${q===1?"":q}y = ${s}$, what is the value of $${k*p}x + ${k*q}y ${sg(c)}$?`,type:"number",ans:v,ansTex:`${v}`,hint:`Look for a multiple: $${k*p}x + ${k*q}y$ is ${k} times $${p}x + ${q===1?"":q}y$.`,sol:[`$${k*p}x + ${k*q}y = ${k}(${p}x + ${q===1?"":q}y) = ${k}(${s}) = ${k*s}$.`,`$${k*s} ${sg(c)} = ${v}$.`]}}
 ]},
 {id:"simp",title:"Distribute & Combine Like Terms",idea:"<b>Distribute</b>: multiply the outside number by every term inside. <b>Combine</b>: add the numbers in front of the same variable.",
  lesson:{steps:[["2(x + 3) + 4x","Start with the parentheses."],["= 2x + 6 + 4x","Distribute: $2 \\cdot x$ and $2 \\cdot 3$."],["= 6x + 6","Combine like terms: $2x + 4x = 6x$."]],warn:"A minus in front of parentheses changes <b>every</b> sign inside: $-(x + 4) = -x - 4$."},
  gen:[

 {id:"dom",title:"Functions, Domain & Range",idea:"A <b>function</b> gives each input exactly <b>one</b> output. The <b>domain</b> is all inputs; the <b>range</b> is all outputs.",
  lesson:{steps:[["\\{(1, 4), (2, 5), (3, 4)\\}","A relation as ordered pairs."],["\\text{inputs } 1, 2, 3 \\text{ never repeat}","Each input has one output — it's a function."],["\\text{Domain } \\{1, 2, 3\\},\\ \\text{Range } \\{4, 5\\}","Outputs may repeat; that's fine."]],warn:"Repeated <b>outputs</b> are okay. A repeated <b>input</b> with different outputs means it is <b>not</b> a function."},
  gen:[
  ()=>{const xs=[...new Set(Array.from({length:4},()=>rnd(-5,6)))];while(xs.length<4)xs.push(xs.length+7);const isF=Math.random()<.5;const pts=xs.map(x=>[x,rnd(-6,9)]);if(!isF){pts[3]=[pts[0][0],pts[0][1]+rnd(1,4)];}pts.sort(()=>Math.random()-.5);return{q:`Is this relation a function? $\\{${pts.map(p=>pt(p[0],p[1])).join(", ")}\\}$ (Type yes or no.)`,type:"yn",ans:isF?"YES":"NO",ansTex:`\\text{${isF?"Yes":"No"}}`,hint:"Look at the inputs (first numbers). Does any input appear twice with different outputs?",sol:[isF?"No input repeats, so each input has exactly one output: it is a function.":`The input $${pts.find(p=>pts.filter(q=>q[0]===p[0]).length>1)[0]}$ has two different outputs, so it is not a function.`]}},
  ()=>{const xs=[...new Set(Array.from({length:5},()=>rnd(-6,8)))];const pts=xs.map(x=>[x,rnd(-5,9)]);const d=Math.random()<.5;const vals=[...new Set(pts.map(p=>d?p[0]:p[1]))].sort((a,b)=>a-b);return{q:`List the ${d?"domain":"range"} of $\\{${pts.map(p=>pt(p[0],p[1])).join(", ")}\\}$.`,type:"list",ans:vals,ansTex:`\\{${vals.join(", ")}\\}`,hint:d?"The domain is the set of first coordinates (inputs).":"The range is the set of second coordinates (outputs). List each value once.",sol:[`${d?"Inputs":"Outputs"}: $\\{${vals.join(", ")}\\}$.`]}},
  ()=>{const a=nz(-8,8);return{q:`Find the domain of $f(x) = \\sqrt{x ${sg(-a)}}$. Write it as an inequality.`,type:"ineq",ans:{op:">=",v:a},ansTex:`x \\ge ${a}`,hint:"You can't take the square root of a negative number: the inside must be $\\ge 0$.",sol:[`$x ${sg(-a)} \\ge 0$.`,`$x \\ge ${a}$.`]}},
  ()=>{const a=rnd(1,4),b=nz(-9,9);return{q:`Which value of $x$ is <b>not</b> in the domain of $f(x) = \\dfrac{5}{${lin(a,b)}}$?`,type:"number",ans:-b/a,ansTex:`x = ${frac(-b,a)}`,hint:"You can't divide by zero. When is the denominator $0$?",sol:[`$${lin(a,b)} = 0$ when $x = ${frac(-b,a)}$.`]}},
  ()=>{const h=nz(-6,6),k=nz(-9,9),up=Math.random()<.6;return{q:`Find the range of $f(x) = ${up?"":"-"}${sq2(h)} ${sg(k)}$. Write it as an inequality in $y$.`,type:"ineq",ans:{op:up?">=":"<=",v:k},ansTex:`y ${up?"\\ge":"\\le"} ${k}`,hint:`A square is never negative, so $${up?"":"-"}${sq2(h)}$ is always ${up?"$\\ge 0$":"$\\le 0$"}.`,sol:[`$${up?"":"-"}${sq2(h)} ${up?"\\ge":"\\le"} 0$, so $f(x) ${up?"\\ge":"\\le"} ${k}$.`,`Range: $y ${up?"\\ge":"\\le"} ${k}$.`]}}
 ]},

  lesson:{steps:[["(1, 2) \\text{ and } (3, 8)","Two points on a line."],["\\text{rise} = 8 - 2 = 6,\\ \\text{run} = 3 - 1 = 2","Change in $y$, change in $x$."],["m = \\dfrac{6}{2} = 3","Rise over run."]],warn:"Keep the same order on top and bottom: $\\dfrac{y_2 - y_1}{x_2 - x_1}$, never $\\dfrac{y_2 - y_1}{x_1 - x_2}$."},
  gen:[

  ()=>{const x1=rnd(-5,5),y1=rnd(-5,5),m=nz(-4,4),dx=nz(-5,5);return{q:`A line with slope $${m}$ passes through $${pt(x1,y1)}$ and $(${x1+dx}, k)$. Find $k$.`,type:"number",ans:y1+m*dx,ansTex:`k = ${y1+m*dx}`,hint:`$\\dfrac{k - ${P(y1)}}{${x1+dx} - ${P(x1)}} = ${m}$.`,sol:[`$\\dfrac{k - ${P(y1)}}{${dx}} = ${m}$.`,`$k - ${P(y1)} = ${m*dx}$, so $k = ${y1+m*dx}$.`]}},

function clean(s){ return String(s).replace(/[−–]/g,"-").replace(/×|·/g,"*").replace(/÷/g,"/").replace(/π/g,"pi").replace(/≤|=</g,"<=").replace(/≥|=>/g,">=").replace(/√\s*(\d+(?:\.\d+)?|\([^)]*\)|[a-z])/g,"sqrt($1)").trim(); }

  let S,E; try{ S=math.parse(s); E=math.parse(expected); }catch(e){ return null; }

  for(let k=0;k<12&&t<6;k++){ const sc={}; vars.forEach(v=>sc[v]=Math.round((Math.random()*6-3)*1000)/1000+0.137+(k%2)); const a=evalAt(S,sc),b=evalAt(E,sc); if(isNaN(a)||isNaN(b)) continue; t++; if(!close(a,b)) return false; }

function lineEq(student,expected,form){

  for(let k=0;k<14&&t<6;k++){ const sc={x:Math.round((Math.random()*8-4)*1000)/1000+0.31,y:Math.round((Math.random()*8-4)*1000)/1000+0.17}; const a=evalAt(S,sc),b=evalAt(E,sc); if(isNaN(a)||isNaN(b)) continue; t++;

function ray(op,v){ return op===">"?{lo:v,li:false,hi:Infinity,hiI:false}:op===">="?{lo:v,li:true,hi:Infinity,hiI:false}:op==="<"?{lo:-Infinity,li:false,hi:v,hiI:false}:{lo:-Infinity,li:false,hi:v,hiI:true}; }

  const t=str.replace(/\s+/g,"").split(/(<=|>=|<|>)/); const isV=x=>/^[a-z]$/i.test(x);
  if(t.length===3){ if(isV(t[0])){ const v=val(t[2]); return isNaN(v)?null:ray(t[1],v); } if(isV(t[2])){ const v=val(t[0]); return isNaN(v)?null:ray(FLIP[t[1]],v); } return null; }

function parseIneq(s){ s=clean(s).toLowerCase(); const out=[];

    const ands=part.split(/\band\b|,|&&/).filter(x=>x.trim()); let iv={lo:-Infinity,li:false,hi:Infinity,hiI:false};
    for(const a of ands){ const r=parseIneqPart(a); if(!r) return null; if(r.lo>iv.lo||(r.lo===iv.lo&&!r.li)){ iv.lo=r.lo; iv.li=r.li; } if(r.hi<iv.hi||(r.hi===iv.hi&&!r.hiI)){ iv.hi=r.hi; iv.hiI=r.hiI; } }

  const ask=()=>{ const [t,lv]=PL[i]; pr=t.gen[lv-1](); q("qq").innerHTML=`<span class="label">Question ${i+1} of 5 · Level ${lv}</span><div>${pr.q}</div>`; render(q("qq")); q("qa").value=""; q("qh").textContent=HOW[pr.type]; q("qf").innerHTML=""; prog(); q("qa").focus(); };
  const end=()=>{ const lvl=res.indexOf(false)===-1?5:res.indexOf(false)+1; st.rec=lvl; save(); recText(); topics(); prog();
    q("qq").innerHTML=`<span class="label">Result</span><div>Start at <b style="color:${LEVELS[lvl-1].c}">Level ${lvl} · ${LEVELS[lvl-1].name}</b>.</div><div style="font-size:15px;color:var(--muted)">${lvl===5?"You answered every question correctly — go for Competition!":lvl===1?"Foundation builds the base everything else needs. Move up whenever you get 3 in a row.":"You got the first "+(lvl-1)+" level"+(lvl===2?"":"s")+" right. Level "+lvl+" is the right challenge for you."}</div>`;
    q("qr").hidden=true; q("qh").textContent=""; q("qf").innerHTML=""; const b=document.createElement("button"); b.className="btn teal"; b.textContent="See the topics"; b.onclick=()=>m.remove(); q("qf").appendChild(b); };
  const answer=r=>{ res.push(r); if(!r){ end(); return; } i++; i>=PL.length?end():ask(); };
  q("qc").onclick=()=>{ const v=q("qa").value.trim(); if(!v) return; const r=check(pr,v); if(r===null){ q("qf").innerHTML=`<div class="fb hint">I couldn't read that. ${HOW[pr.type]}</div>`; return; } answer(r); };
  q("qa").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); q("qc").click(); } });
  q("qs").onclick=()=>answer(false); q("qx").onclick=()=>m.remove(); m.addEventListener("click",e=>{ if(e.target===m) m.remove(); });
  ask(); };

/* ---- learn ---- */
let LI=0, shown=1, TP=null, tDone=false, tTries=0;
function road(){ const r=$("road"); r.innerHTML=""; CH.topics.forEach((t,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="stop"+(st.learned[t.id]?" done":"")+(i===LI?" on":""); b.innerHTML=`<i>${st.learned[t.id]?"✓":i+1}</i>${t.title}`; b.onclick=()=>openLesson(i); r.appendChild(b); }); }
function openLesson(i,scroll){ LI=i; shown=1; tDone=false; tTries=0; TP=null; road(); drawLesson(); if(scroll) $("lesson").scrollIntoView({behavior:"smooth",block:"start"}); }
function drawLesson(){
  const t=CH.topics[LI], l=t.lesson, box=$("lesson");
  box.innerHTML=`<span class="label">Lesson ${LI+1} of ${CH.topics.length}</span><h2>${t.title}</h2><div class="big">${t.idea}</div><span class="label">Simplest example — one step at a time</span><ol class="steps">${l.steps.slice(0,shown).map(s=>`<li><div><div class="m">$${s[0]}$</div><div class="w">${s[1]}</div></div></li>`).join("")}</ol>`;
  if(shown<l.steps.length){ const b=document.createElement("button"); b.className="btn"; b.style.alignSelf="flex-start"; b.textContent="Next step →"; b.onclick=()=>{ shown++; drawLesson(); }; box.appendChild(b);
    const s=document.createElement("button"); s.className="btn ghost sm"; s.style.alignSelf="flex-start"; s.textContent="Show all steps"; s.onclick=()=>{ shown=l.steps.length; drawLesson(); }; box.appendChild(s); }
  else {
    box.insertAdjacentHTML("beforeend",`<div class="warn"><b>Watch out: </b>${l.warn}</div>`);
    if(!TP) TP=t.gen[0]();
    const w=document.createElement("div"); w.className="turn";
    w.innerHTML=`<span class="label" style="color:var(--gold)">Your turn</span><div class="q">${TP.q}</div><div class="row"><input type="text" id="tAns" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><button class="btn" id="tChk">Check</button><button class="btn ghost" id="tHint">Hint</button></div><div class="howto">${HOW[TP.type]}</div><div id="tFb"></div>`;
    box.appendChild(w);
    const nav=document.createElement("div"); nav.className="lnav"; const left=document.createElement("div"); left.className="row";
    if(LI>0){ const pv=document.createElement("button"); pv.className="btn ghost sm"; pv.textContent="← Previous lesson"; pv.onclick=()=>openLesson(LI-1,true); left.appendChild(pv); }
    const right=document.createElement("div"); right.className="row"; right.id="tNext"; nav.append(left,right); box.appendChild(nav);
    const fbx=(k,tag,h)=>{ $("tFb").innerHTML=`<div class="fb ${k}"><span class="tag">${tag}</span>${h}</div>`; render($("tFb")); };
    const win=()=>{ tDone=true; st.learned[t.id]=true; save(); road(); $("tAns").disabled=true; $("tChk").disabled=true; $("tHint").disabled=true; showNext(); };
    const go=()=>{ if(tDone) return; const v=$("tAns").value.trim(); if(!v) return; const r=check(TP,v);
      if(r===null){ fbx("hint","Try again","I couldn't read that. "+HOW[TP.type]); return; }
      if(r){ fbx("good","Correct — you've got it!",`$${TP.ansTex}$`); win(); return; }
      tTries++; if(tTries<2) fbx("bad","Not yet",TP.hint+" Try again."); else { fbx("hint","Answer",`$${TP.ansTex}$. Try another one to make sure.`); const a=document.createElement("button"); a.className="btn ghost sm"; a.textContent="Try another"; a.onclick=()=>{ TP=t.gen[0](); tTries=0; drawLesson(); }; $("tFb").appendChild(a); } };
    $("tChk").onclick=go; $("tAns").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } }); $("tHint").onclick=()=>fbx("hint","Hint",TP.hint);
    if(st.learned[t.id]) showNext();
  }
  render(box);
}
function showNext(){ const r=$("tNext"); if(!r) return; r.innerHTML=""; const t=CH.topics[LI];
  const pr=document.createElement("button"); pr.className="btn ghost sm"; pr.textContent="Practice this topic"; pr.onclick=()=>{ setTab("practice"); startPractice(t,st.level[t.id]||st.rec||1); }; r.appendChild(pr);
  const n=document.createElement("button"); n.className="btn teal sm";
  if(LI<CH.topics.length-1){ n.textContent="Next lesson →"; n.onclick=()=>openLesson(LI+1,true); } else { n.textContent="Start practicing →"; n.onclick=()=>{ setTab("practice"); window.scrollTo({top:0,behavior:"smooth"}); }; }
  r.appendChild(n); }
function setTab(t){ $("learnView").hidden=t!=="learn"; $("practiceView").hidden=t!=="practice"; $("tabLearn").classList.toggle("on",t==="learn"); $("tabPractice").classList.toggle("on",t==="practice"); try{ history.replaceState(null,"","#"+CH.id+"-"+t); }catch(e){} }
function openChapter(id,tab){
  useChapter(id); $("chTitle").textContent="Chapter "+(CHAPTERS.indexOf(CH)+1)+": "+CH.title; $("practice").hidden=true;
  chapters(); recText(); topics(); const first=CH.topics.findIndex(t=>!st.learned[t.id]); openLesson(first<0?0:first);
  setTab(tab||(first<0?"practice":"learn")); }
$("tabLearn").onclick=()=>setTab("learn"); $("tabPractice").onclick=()=>setTab("practice");
window.addEventListener("load",()=>{ legend(); const m=/^#(ch\d+)(?:-(learn|practice))?$/.exec(location.hash); openChapter(m?m[1]:ST.cur,m?m[2]:null); });
</script>
