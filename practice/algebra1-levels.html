<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --ink:#16233B; --muted:#5B6474; --faint:#8C93A0; --line:#E8E2D8;
  --navy:#1F3A68; --teal:#0F7C7C; --teal-soft:#DDF0EE; --gold:#C9962B; --gold-soft:#FBF1DC; --red:#B3261E; --red-soft:#FBE7E5; --green:#1E7A45; --green-soft:#DDF4E6;

  --radius:18px; --shadow:0 8px 26px rgba(22,35,59,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
header.top .in{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:24px}
.brand{font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--teal)}
.back{margin-left:auto;font-size:15px;text-decoration:none;color:var(--muted);font-weight:500}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 48px;display:flex;flex-direction:column;gap:20px}
.intro h1{font-size:clamp(28px,4vw,40px)}
.intro p{color:var(--muted);margin:6px 0 0;max-width:680px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;font-weight:600;border:1px solid transparent;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
.btn.teal{background:var(--teal)} .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus{outline:2px solid var(--teal);outline-offset:1px}
/* level legend */
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lg{border-radius:12px;padding:10px 12px;background:var(--bg);border-left:4px solid var(--c)}
.lg b{display:block;font-size:14px;color:var(--c)} .lg span{font-size:13px;color:var(--muted)}
/* placement */
.place{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--teal-soft),#fff 70%);border:1.5px solid var(--teal)}
.place .t b{font-family:Fraunces,Georgia,serif;font-size:20px;display:block}
.place .t span{color:var(--muted);font-size:15px}
.rec{font-weight:600;color:var(--teal)}

.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.topics{grid-template-columns:minmax(0,1fr)}}
.topic{display:flex;flex-direction:column;gap:12px}
.topic h2{font-size:22px}
.idea{color:var(--muted);font-size:15px;margin:0}
.example{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;overflow-x:auto}
.example .q{font-size:17px;margin-bottom:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--c)}
.pill.on{background:var(--c);border-color:var(--c);color:#fff}
.pill .n{font-weight:500;opacity:.75;margin-left:4px}
.pill.star::after{content:"★";position:absolute;top:-8px;right:-4px;font-size:12px;color:var(--gold)}
/* practice */
.practice{display:flex;flex-direction:column;gap:14px;scroll-margin-top:80px}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.phead h2{font-size:24px}
.problem{font-size:clamp(19px,2.6vw,24px);padding:16px 18px;border-radius:14px;background:var(--bg);overflow-x:auto;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 240px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--bg)}
.preview{font-size:18px;min-height:1.4em}
.preview .pl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin-right:8px}
.howto{font-size:13px;color:var(--faint)}

.fb.good{background:var(--green-soft)} .fb.bad{background:var(--red-soft)} .fb.hint{background:var(--gold-soft)}
.fb .tag{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.fb.good .tag{color:var(--green)} .fb.bad .tag{color:var(--red)} .fb.hint .tag{color:var(--gold)}
.sol{margin:6px 0 0;padding-left:20px} .sol li{margin:2px 0}
.suggest{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1.5px dashed var(--c);border-radius:12px;padding:10px 14px}
.streak{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--faint)}
.streak i{width:10px;height:10px;border-radius:50%;background:var(--line)} .streak i.ok{background:var(--green)} .streak i.no{background:var(--red)}
/* modal quiz */
.modal{position:fixed;inset:0;background:rgba(22,35,59,.45);display:grid;place-items:center;padding:16px;z-index:60}
.modal .card{width:min(620px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.qprog{display:flex;gap:6px} .qprog i{flex:1;height:6px;border-radius:3px;background:var(--line)} .qprog i.ok{background:var(--green)} .qprog i.no{background:var(--red)} .qprog i.now{background:var(--teal)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:none;background:none;padding:10px 16px;font-weight:600;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.learn,.pview{display:flex;flex-direction:column;gap:20px}
.road{display:flex;gap:8px;flex-wrap:wrap}
.stop{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.stop i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px;border:1.5px solid var(--line)}
.stop.done i{background:var(--green);border-color:var(--green);color:#fff}
.stop.on{border-color:var(--teal);background:var(--teal-soft)}
.lesson{display:flex;flex-direction:column;gap:16px;scroll-margin-top:80px}
.lesson h2{font-size:clamp(24px,3vw,30px)}
.big{font-size:18px;background:var(--teal-soft);border-radius:14px;padding:14px 16px;overflow-x:auto}
.big b{color:var(--teal)}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;counter-reset:k}
.steps li{counter-increment:k;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;background:var(--bg);border-radius:12px;padding:10px 12px;animation:pop .25s ease}
.steps li::before{content:counter(k);width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps .m{font-size:19px;overflow-x:auto} .steps .w{font-size:14px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.steps li{animation:none}}
.warn{background:var(--red-soft);border-radius:14px;padding:12px 16px;font-size:15px;overflow-x:auto}
.warn b{color:var(--red)}
.turn{border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.turn .q{font-size:19px;overflow-x:auto}
.lnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
footer{text-align:center;color:var(--faint);font-size:13px;padding:24px}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chap{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chap i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px}
.chap.on{background:var(--navy);border-color:var(--navy);color:#fff} .chap.on i{background:rgba(255,255,255,.2)}
.chap.soon{opacity:.45;cursor:default}

/* ---- left sidebar for chapters (wide screens) ---- */
.lv-main{display:contents}
.lv-main>.intro{order:-1}
@media (min-width:900px){
  .wrap{max-width:1320px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
  .lv-main{display:flex;flex-direction:column;gap:20px;min-width:0}
  .wrap>.chapters{position:sticky;top:16px;flex-direction:column;flex-wrap:nowrap;gap:2px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
  .wrap>.chapters::before{content:attr(aria-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:4px 8px 8px}
  .wrap>.chapters .chap{border:0;border-radius:10px;background:transparent;padding:8px 8px;font-size:14px;line-height:1.3;text-align:left;width:100%;align-items:flex-start}
  .wrap>.chapters .chap i{flex:0 0 auto;min-width:24px;width:auto;padding:0 5px;height:24px;border-radius:12px}
  .wrap>.chapters .chap:hover{background:var(--bg)}
  .wrap>.chapters .chap.on{background:var(--navy);color:#fff}
}
</style>

<script>
"use strict";
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let x;do{x=rnd(a,b)}while(x===0);return x};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const sg=k=>k>=0?"+ "+k:"- "+(-k);            // "+ 3" / "- 3"
const P=n=>n<0?"("+n+")":String(n);            // wrap negatives
function co(a,v){ return (a===1?"":a===-1?"-":String(a))+v; }   // coefficient with variable
function lin(a,b,v="x"){ if(a===0) return String(b); let s=co(a,v); if(b) s+=" "+sg(b); return s; }
function cterm(a,v){ return (a<0?"- ":"+ ")+(Math.abs(a)===1?"":Math.abs(a))+v; } // signed term for middle
function frac(n,d){ if(d<0){n=-n;d=-d} const g=gcd(n,d)||1; n/=g; d/=g; return d===1?String(n):(n<0?"-":"")+"\\frac{"+Math.abs(n)+"}{"+d+"}"; }
const OPT={"<":"<","<=":"\\le",">":">",">=":"\\ge"}; const FLIP={"<":">","<=":">=",">":"<",">=":"<="};
const pt=(x,y)=>`(${x}, ${y})`;
const sq2=h=>`(x ${sg(-h)})^2`;
function ptex(cs,v="x"){ const n=cs.length-1; let t=""; cs.forEach((c,i)=>{ const d=n-i; if(!c) return; const a=Math.abs(c), vv=d===0?"":d===1?v:v+"^{"+d+"}", cf=(a===1&&d>0)?"":String(a); t+=t?(c<0?" - ":" + "):(c<0?"-":""); t+=cf+vv; }); return t||"0"; }
function pstr(cs){ const n=cs.length-1; return cs.map((c,i)=>`(${c})*x^${n-i}`).join("+"); }
function pmul(a,b){ const r=Array(a.length+b.length-1).fill(0); a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y)); return r; }
function radParts(n){ let k=1,m=n; for(let i=Math.floor(Math.sqrt(n));i>1;i--){ if(n%(i*i)===0){ k=i; m=n/(i*i); break; } } return [k,m]; }
function rad(n){ const [k,m]=radParts(n); return m===1?String(k):(k===1?"":k)+"\\sqrt{"+m+"}"; }
function radTex(c,n){ const [k,m]=radParts(n); const K=c*k; return m===1?String(K):(K===1?"":K)+"\\sqrt{"+m+"}"; }
const divisors=n=>{n=Math.abs(n);const d=[];for(let i=1;i<=n;i++) if(n%i===0) d.push(i);return d;};
const LEVELS=[
 {n:1,name:"Foundation",desc:"Review the basics first",c:"var(--l1)"},
 {n:2,name:"Basic",desc:"Textbook examples",c:"var(--l2)"},
 {n:3,name:"Standard",desc:"School test level",c:"var(--l3)"},
 {n:4,name:"Challenge",desc:"Honors / hard SAT",c:"var(--l4)"},
 {n:5,name:"Competition",desc:"MATHCOUNTS / AMC 8–10 style",c:"var(--l5)"}];
const HOW={roots:"Give every solution, separated by commas: 3, -2. Use sqrt(5) for √5; ± is fine: 2±sqrt(3).",nsol:"Type one, none, or infinitely many.",point:"Type a point like (2, -5).",yn:"Type yes or no.",list:"List the values separated by commas, like -2, 0, 5.",line:"Type an equation like y = 2x + 3 (any correct form works).",number:"Type a number. Fractions like 9/4 are fine.",set:"Type the value, like 4 or x = 4.",expr:"Type an expression like 7x - 1 or (c - b)/a.",
  ineq:"Type like x > 3 or x <= -2 (≤ and ≥ work too).",between:"Type like -2 < x <= 4.",or:"Type like x < -5 or x > 3."};
const ineqTex=(op,v)=>`x ${OPT[op]} ${v}`;

/* ================= chapters =================
   generators return {q, type, ans, ansTex, hint, sol[]} */
const CHAPTERS=[
{id:"ch1",title:"Foundations of Algebraic Thinking",topics:[
 {id:"ops",title:"Order of Operations",idea:"<b>P</b>arentheses → <b>E</b>xponents → <b>M</b>ultiply/<b>D</b>ivide (left to right) → <b>A</b>dd/<b>S</b>ubtract (left to right).",
  lesson:{steps:[["3 + 4 \\times 2","Multiplication comes before addition."],["= 3 + 8","Multiply first: $4 \\times 2 = 8$."],["= 11","Then add."]],warn:"Don't just go left to right: $3 + 4 \\times 2$ is $11$, not $14$."},
  gen:[
  ()=>{const a=rnd(2,9),b=rnd(2,9),c=rnd(2,9);return{q:`Evaluate $${a} + ${b} \\times ${c}$.`,type:"number",ans:a+b*c,ansTex:`${a+b*c}`,hint:"Multiplication comes before addition.",sol:[`Multiply first: $${b} \\times ${c} = ${b*c}$.`,`Add: $${a} + ${b*c} = ${a+b*c}$.`]}},
  ()=>{const a=rnd(1,9),b=rnd(1,9),c=rnd(2,6),d=rnd(1,20),v=(a+b)*c-d;return{q:`Evaluate $(${a} + ${b}) \\times ${c} - ${d}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Parentheses first.",sol:[`Parentheses: $${a} + ${b} = ${a+b}$.`,`Multiply: $${a+b} \\times ${c} = ${(a+b)*c}$.`,`Subtract: $${(a+b)*c} - ${d} = ${v}$.`]}},
  ()=>{const b=rnd(2,6),c=pick(divisors(b*b).filter(x=>x>1)),a=rnd(1,20),d=nz(-9,9),v=a-b*b/c+d;return{q:`Evaluate $${a} - ${b}^2 \\div ${c} ${sg(d)}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Exponent first, then divide, then add and subtract from left to right.",sol:[`Exponent: $${b}^2 = ${b*b}$.`,`Divide: $${b*b} \\div ${c} = ${b*b/c}$.`,`Left to right: $${a} - ${b*b/c} ${sg(d)} = ${v}$.`]}},
  ()=>{let m,b,c,a,d;do{m=nz(-6,6);b=rnd(1,9);c=rnd(1,9);a=m-2*(b-c);d=pick(divisors(m*m))}while(a===0);const v=m*m/d;return{q:`Evaluate $\\left[${a} + 2(${b} - ${c})\\right]^2 \\div ${d}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Work from the innermost parentheses outward.",sol:[`Inner: $${b} - ${c} = ${b-c}$, so $2(${b-c}) = ${2*(b-c)}$.`,`Bracket: $${a} + ${P(2*(b-c))} = ${m}$.`,`Square and divide: $${P(m)}^2 \\div ${d} = ${m*m} \\div ${d} = ${v}$.`]}},
  ()=>{const p=rnd(2,4),x=rnd(1,6),y=rnd(1,9),z=rnd(1,9),f=p*x-y,v=p*f-z;return{q:`Define $a \\star b = ${p}a - b$. Find $(${x} \\star ${y}) \\star ${z}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Work out the parentheses first: replace $a$ with the first number and $b$ with the second.",sol:[`$${x} \\star ${y} = ${p}(${x}) - ${y} = ${f}$.`,`$${P(f)} \\star ${z} = ${p}(${f}) - ${z} = ${v}$.`]}}
 ]},
 {id:"eval",title:"Evaluating Expressions",idea:"Replace each variable with its value <b>in parentheses</b>, then follow the order of operations.",
  lesson:{steps:[["3x + 2 \\text{ when } x = 4","Put $4$ in place of $x$."],["3(4) + 2","Use parentheses when you substitute."],["= 12 + 2 = 14","Multiply, then add."]],warn:"With negatives, always use parentheses: if $x = -3$, then $x^2 = (-3)^2 = 9$, not $-9$."},
  gen:[
  ()=>{const a=rnd(2,9),b=rnd(1,9),v=rnd(1,9);return{q:`Evaluate $${a}x + ${b}$ when $x = ${v}$.`,type:"number",ans:a*v+b,ansTex:`${a*v+b}`,hint:`Replace $x$ with $${v}$: $${a}(${v}) + ${b}$.`,sol:[`$${a}(${v}) + ${b} = ${a*v} + ${b} = ${a*v+b}$.`]}},
  ()=>{const a=rnd(2,5),b=nz(-9,9),v=-rnd(1,6);return{q:`Evaluate $${a}x^2 ${sg(b)}$ when $x = ${v}$.`,type:"number",ans:a*v*v+b,ansTex:`${a*v*v+b}`,hint:`Square first: $(${v})^2 = ${v*v}$ — positive!`,sol:[`$(${v})^2 = ${v*v}$.`,`$${a}(${v*v}) ${sg(b)} = ${a*v*v+b}$.`]}},

 {id:"simp",title:"Distribute & Combine Like Terms",idea:"<b>Distribute</b>: multiply the outside number by every term inside. <b>Combine</b>: add the numbers in front of the same variable.",
  lesson:{steps:[["2(x + 3) + 4x","Start with the parentheses."],["= 2x + 6 + 4x","Distribute: $2 \\cdot x$ and $2 \\cdot 3$."],["= 6x + 6","Combine like terms: $2x + 4x = 6x$."]],warn:"A minus in front of parentheses changes <b>every</b> sign inside: $-(x + 4) = -x - 4$."},
  gen:[
  ()=>{let p,q;do{p=rnd(1,9);q=rnd(1,9)}while(p+q===0);const c=rnd(1,9);return{q:`Simplify $${co(p,"x")} + ${c} + ${co(q,"x")}$.`,type:"expr",form:"combined",ans:`${p+q}*x+${c}`,ansTex:lin(p+q,c),hint:`Add the $x$ terms: $${p} + ${q}$.`,sol:[`$${co(p,"x")} + ${co(q,"x")} = ${co(p+q,"x")}$.`,`Answer: $${lin(p+q,c)}$.`]}},
  ()=>{const a=rnd(2,9),b=nz(-9,9);return{q:`Simplify $${a}(x ${sg(b)})$.`,type:"expr",form:"combined",ans:`${a}*x+(${a*b})`,ansTex:lin(a,a*b),hint:`Multiply $${a}$ by $x$ and by $${b}$.`,sol:[`$${a} \\cdot x = ${a}x$ and $${a} \\cdot ${P(b)} = ${a*b}$.`,`Answer: $${lin(a,a*b)}$.`]}},
  ()=>{let a,b,c;do{a=nz(-6,6);b=nz(-9,9);c=nz(-9,9)}while(a+c===0||Math.abs(a)===1);return{q:`Simplify $${a}(x ${sg(b)}) ${cterm(c,"x")}$.`,type:"expr",form:"combined",ans:`${a+c}*x+(${a*b})`,ansTex:lin(a+c,a*b),hint:"Distribute first, then combine the $x$ terms.",sol:[`Distribute: $${lin(a,a*b)} ${cterm(c,"x")}$.`,`Combine: $${lin(a+c,a*b)}$.`]}},
  ()=>{let a,p,q,r;do{a=rnd(2,5);p=rnd(1,4);q=nz(-6,6);r=nz(-9,9)}while(-a*p-1===0);const X=-a*p-1,C=-a*q-r;return{q:`Simplify $-${a}(${co(p,"x")} ${sg(q)}) - (x ${sg(r)})$.`,type:"expr",form:"combined",ans:`${X}*x+(${C})`,ansTex:lin(X,C),hint:"The minus signs change every sign inside their parentheses.",sol:[`$-${a}(${co(p,"x")} ${sg(q)}) = ${lin(-a*p,-a*q)}$.`,`$-(x ${sg(r)}) = ${lin(-1,-r)}$.`,`Combine: $${lin(X,C)}$.`]}},
  ()=>{let a,b,c,d,X,Y;do{a=rnd(2,5);b=rnd(1,4);c=rnd(2,5);d=rnd(1,3);X=a-c*d;Y=-a*b+c}while(X===0||Y===0);const yt=Y===1?"+ y":Y===-1?"- y":(Y<0?"- "+(-Y):"+ "+Y)+"y";return{q:`Simplify $${a}(x - ${co(b,"y")}) - ${c}(${co(d,"x")} - y)$.`,type:"expr",form:"combined",ans:`${X}*x+(${Y})*y`,ansTex:`${co(X,"x")} ${yt}`,hint:"Distribute both parts (watch the minus!), then combine $x$ terms and $y$ terms separately.",sol:[`$${a}(x - ${co(b,"y")}) = ${co(a,"x")} - ${a*b}y$.`,`$-${c}(${co(d,"x")} - y) = -${c*d}x + ${c}y$.`,`Combine: $${co(X,"x")} ${yt}$.`]}}
 ]}
]},
{id:"ch2",title:"Solving Linear Equations",topics:[
 {id:"two",title:"One- and Two-Step Equations",idea:"Do the <b>opposite</b> operation to <b>both sides</b>. Undo addition/subtraction first, then multiplication/division.",
  lesson:{steps:[["2x + 5 = 17","Two things happen to $x$: times $2$, then $+5$."],["2x = 12","Undo $+5$: subtract $5$ from both sides."],["x = 6","Undo $\\times 2$: divide both sides by $2$."],["2(6) + 5 = 17 \\checkmark","Check by substituting."]],warn:"Whatever you do to one side, do to the <b>other side</b> too."},
  gen:[
  ()=>{const b=nz(-9,9),x=nz(-9,12);return{q:`Solve $x ${sg(b)} = ${x+b}$.`,type:"set",ans:[x],ansTex:`x = ${x}`,hint:`Undo $${sg(b).replace(" ","")}$ by doing the opposite to both sides.`,sol:[`${b>0?"Subtract":"Add"} $${Math.abs(b)}$ on both sides: $x = ${x+b} ${sg(-b)} = ${x}$.`]}},
  ()=>{let a;do{a=nz(-9,9)}while(Math.abs(a)===1);const x=nz(-9,9);return{q:`Solve $${a}x = ${a*x}$.`,type:"set",ans:[x],ansTex:`x = ${x}`,hint:`Divide both sides by $${a}$. Watch the signs.`,sol:[`$x = \\dfrac{${a*x}}{${a}} = ${x}$.`]}},
  ()=>{let a;do{a=nz(-9,9)}while(Math.abs(a)===1);const b=nz(-12,12),x=nz(-9,9),c=a*x+b;return{q:`Solve $${lin(a,b)} = ${c}$.`,type:"set",ans:[x],ansTex:`x = ${x}`,hint:`Undo $${sg(b).replace(" ","")}$ first, then divide by $${a}$.`,sol:[`$${co(a,"x")} = ${c} ${sg(-b)} = ${c-b}$.`,`$x = ${c-b} \\div ${P(a)} = ${x}$.`]}},
  ()=>{const a=rnd(2,6),k=nz(-6,6),x=a*k,b=nz(-9,9),c=k+b;return{q:`Solve $\\dfrac{x}{${a}} ${sg(b)} = ${c}$.`,type:"set",ans:[x],ansTex:`x = ${x}`,hint:`Undo $${sg(b).replace(" ","")}$ first, then multiply both sides by $${a}$.`,sol:[`$\\dfrac{x}{${a}} = ${c} ${sg(-b)} = ${k}$.`,`$x = ${a} \\cdot ${P(k)} = ${x}$.`]}},
  ()=>{const a=rnd(2,6),x=nz(-6,9),b=nz(-9,9),c=a*x+b,k=rnd(2,3),d=nz(-9,9),v=k*a*x+d;return{q:`If $${lin(a,b)} = ${c}$, what is the value of $${lin(k*a,d)}$?`,type:"number",ans:v,ansTex:`${v}`,hint:`You can find $x$ first — or notice that $${co(k*a,"x")}$ is ${k} times $${co(a,"x")}$.`,sol:[`$${co(a,"x")} = ${c-b}$, so $${co(k*a,"x")} = ${k*(c-b)}$.`,`$${k*(c-b)} ${sg(d)} = ${v}$.`]}}
 ]},
 {id:"multi",title:"Multi-Step Equations",idea:"<b>Simplify each side first</b> (distribute, combine like terms), then solve like a two-step equation.",
  lesson:{steps:[["2(x + 3) = 14","Parentheses on the left."],["2x + 6 = 14","Distribute."],["2x = 8","Subtract $6$ from both sides."],["x = 4","Divide by $2$."]],warn:"Distribute to <b>every</b> term: $2(x + 3)$ is $2x + 6$, not $2x + 3$."},
  gen:[
  ()=>{let p,q;do{p=rnd(1,7);q=rnd(1,7)}while(p+q<2);const x=nz(-9,9);return{q:`Solve $${co(p,"x")} + ${co(q,"x")} = ${(p+q)*x}$.`,type:"set",ans:[x],ansTex:`x = ${x}`,hint:"Combine like terms first.",sol:[`$${co(p+q,"x")} = ${(p+q)*x}$.`,`$x = ${x}$.`]}},
  ()=>{const a=rnd(2,7),b=nz(-9,9),x=nz(-9,9),c=a*(x+b);return{q:`Solve $${a}(x ${sg(b)}) = ${c}$.`,type:"set",ans:[x],ansTex:`x = ${x}`,hint:`Distribute first (or divide both sides by $${a}$).`,sol:[`$${lin(a,a*b)} = ${c}$.`,`$${a}x = ${c-a*b}$, so $x = ${x}$.`]}},
  ()=>{let a,b,c,x;do{a=rnd(2,6);b=nz(-6,6);c=nz(-5,5);x=nz(-8,8)}while(a+c===0);const d=a*(x+b)+c*x;return{q:`Solve $${a}(x ${sg(b)}) ${cterm(c,"x")} = ${d}$.`,type:"set",ans:[x],ansTex:`x = ${x}`,hint:"Distribute, then combine the $x$ terms.",sol:[`$${lin(a,a*b)} ${cterm(c,"x")} = ${d}$.`,`$${lin(a+c,a*b)} = ${d}$.`,`$${co(a+c,"x")} = ${d-a*b}$, so $x = ${x}$.`]}},
  ()=>{let a,b,c,d,x;do{a=rnd(2,6);c=rnd(2,6);b=nz(-6,6);d=nz(-6,6);x=nz(-8,8)}while(a===c);const e=a*(x+b)-c*(x+d);return{q:`Solve $${a}(x ${sg(b)}) - ${c}(x ${sg(d)}) = ${e}$.`,type:"set",ans:[x],ansTex:`x = ${x}`,hint:"Distribute both parentheses. The minus sign changes both signs in the second one.",sol:[`$${lin(a,a*b)} ${sg(-c).replace(" ","")}x ${sg(-c*d)} = ${e}$.`,`$${lin(a-c,a*b-c*d)} = ${e}$.`,`$x = ${x}$.`]}},
  ()=>{let m,n,p,q,x;do{m=pick([2,3,4,5]);n=pick([2,3,4,5,6]);p=nz(-6,6);q=nz(-6,6);x=nz(-12,12)}while(m===n||(x+p)%m!==0||(x+q)%n!==0);const r=(x+p)/m+(x+q)/n;return{q:`Solve $\\dfrac{x ${sg(p)}}{${m}} + \\dfrac{x ${sg(q)}}{${n}} = ${r}$.`,type:"set",ans:[x],ansTex:`x = ${x}`,hint:`Multiply every term by the LCD, $${m*n/gcd(m,n)}$, to clear the fractions.`,sol:[`Multiply both sides by $${m*n/gcd(m,n)}$.`,`$${m*n/gcd(m,n)/m}(x ${sg(p)}) + ${m*n/gcd(m,n)/n}(x ${sg(q)}) = ${r*m*n/gcd(m,n)}$.`,`Solve: $x = ${x}$.`]}}
 ]},

{id:"ch3",title:"Linear Inequalities",topics:[
 {id:"one",title:"Solving Inequalities",idea:"Solve like an equation — but if you <b>multiply or divide by a negative</b>, <b>flip</b> the inequality sign.",
  lesson:{steps:[["-2x < 8","We need to divide by $-2$."],["x > -4","Divide by $-2$ and flip $<$ to $>$."],["x = 0:\\ -2(0) = 0 < 8 \\checkmark","Check a number from your answer."]],warn:"Forgetting to flip! Dividing by $-2$ turns $<$ into $>$."},

{id:"ch4",title:"Functions & Function Notation",topics:[

 {id:"dom",title:"Functions, Domain & Range",idea:"A <b>function</b> gives each input exactly <b>one</b> output. The <b>domain</b> is all inputs; the <b>range</b> is all outputs.",
  lesson:{steps:[["\\{(1, 4), (2, 5), (3, 4)\\}","A relation as ordered pairs."],["\\text{inputs } 1, 2, 3 \\text{ never repeat}","Each input has one output — it's a function."],["\\text{Domain } \\{1, 2, 3\\},\\ \\text{Range } \\{4, 5\\}","Outputs may repeat; that's fine."]],warn:"Repeated <b>outputs</b> are okay. A repeated <b>input</b> with different outputs means it is <b>not</b> a function."},
  gen:[
  ()=>{const xs=[...new Set(Array.from({length:4},()=>rnd(-5,6)))];while(xs.length<4)xs.push(xs.length+7);const isF=Math.random()<.5;const pts=xs.map(x=>[x,rnd(-6,9)]);if(!isF){pts[3]=[pts[0][0],pts[0][1]+rnd(1,4)];}pts.sort(()=>Math.random()-.5);return{q:`Is this relation a function? $\\{${pts.map(p=>pt(p[0],p[1])).join(", ")}\\}$ (Type yes or no.)`,type:"yn",ans:isF?"YES":"NO",ansTex:`\\text{${isF?"Yes":"No"}}`,hint:"Look at the inputs (first numbers). Does any input appear twice with different outputs?",sol:[isF?"No input repeats, so each input has exactly one output: it is a function.":`The input $${pts.find(p=>pts.filter(q=>q[0]===p[0]).length>1)[0]}$ has two different outputs, so it is not a function.`]}},
  ()=>{const xs=[...new Set(Array.from({length:5},()=>rnd(-6,8)))];const pts=xs.map(x=>[x,rnd(-5,9)]);const d=Math.random()<.5;const vals=[...new Set(pts.map(p=>d?p[0]:p[1]))].sort((a,b)=>a-b);return{q:`List the ${d?"domain":"range"} of $\\{${pts.map(p=>pt(p[0],p[1])).join(", ")}\\}$.`,type:"list",ans:vals,ansTex:`\\{${vals.join(", ")}\\}`,hint:d?"The domain is the set of first coordinates (inputs).":"The range is the set of second coordinates (outputs). List each value once.",sol:[`${d?"Inputs":"Outputs"}: $\\{${vals.join(", ")}\\}$.`]}},
  ()=>{const a=nz(-8,8);return{q:`Find the domain of $f(x) = \\sqrt{x ${sg(-a)}}$. Write it as an inequality.`,type:"ineq",ans:{op:">=",v:a},ansTex:`x \\ge ${a}`,hint:"You can't take the square root of a negative number: the inside must be $\\ge 0$.",sol:[`$x ${sg(-a)} \\ge 0$.`,`$x \\ge ${a}$.`]}},

  ()=>{const h=nz(-6,6),k=nz(-9,9),up=Math.random()<.6;return{q:`Find the range of $f(x) = ${up?"":"-"}${sq2(h)} ${sg(k)}$. Write it as an inequality in $y$.`,type:"ineq",ans:{op:up?">=":"<=",v:k},ansTex:`y ${up?"\\ge":"\\le"} ${k}`,hint:`A square is never negative, so $${up?"":"-"}${sq2(h)}$ is always ${up?"$\\ge 0$":"$\\le 0$"}.`,sol:[`$${up?"":"-"}${sq2(h)} ${up?"\\ge":"\\le"} 0$, so $f(x) ${up?"\\ge":"\\le"} ${k}$.`,`Range: $y ${up?"\\ge":"\\le"} ${k}$.`]}}
 ]},

  lesson:{steps:[["(1, 2) \\text{ and } (3, 8)","Two points on a line."],["\\text{rise} = 8 - 2 = 6,\\ \\text{run} = 3 - 1 = 2","Change in $y$, change in $x$."],["m = \\dfrac{6}{2} = 3","Rise over run."]],warn:"Keep the same order on top and bottom: $\\dfrac{y_2 - y_1}{x_2 - x_1}$, never $\\dfrac{y_2 - y_1}{x_1 - x_2}$."},
  gen:[

  ()=>{const x1=rnd(-5,5),y1=rnd(-5,5),m=nz(-4,4),dx=nz(-5,5);return{q:`A line with slope $${m}$ passes through $${pt(x1,y1)}$ and $(${x1+dx}, k)$. Find $k$.`,type:"number",ans:y1+m*dx,ansTex:`k = ${y1+m*dx}`,hint:`$\\dfrac{k - ${P(y1)}}{${x1+dx} - ${P(x1)}} = ${m}$.`,sol:[`$\\dfrac{k - ${P(y1)}}{${dx}} = ${m}$.`,`$k - ${P(y1)} = ${m*dx}$, so $k = ${y1+m*dx}$.`]}},

  ()=>{let x1,y1,x2,y2;do{x1=rnd(-6,6);y1=rnd(-6,6);x2=rnd(-6,6);y2=rnd(-6,6)}while(x1===x2||y1===y2||Number.isInteger((y2-y1)/(x2-x1)));return{q:`Write an equation of the line through $${pt(x1,y1)}$ and $${pt(x2,y2)}$.`,type:"line",ans:`(y-(${y1}))*(${x2-x1})=(${y2-y1})*(x-(${x1}))`,ansTex:`y ${sg(-y1)} = ${frac(y2-y1,x2-x1)}(x ${sg(-x1)})`,hint:"The slope is a fraction — that's fine. Use point-slope form.",sol:[`$m = \\dfrac{${y2-y1}}{${x2-x1}} = ${frac(y2-y1,x2-x1)}$.`,`$y ${sg(-y1)} = ${frac(y2-y1,x2-x1)}(x ${sg(-x1)})$.`]}},
  ()=>{const m=nz(-5,5),b=nz(-9,9),x0=nz(-5,5),y0=rnd(-8,8);return{q:`Write an equation of the line parallel to $y = ${lin(m,b)}$ through $${pt(x0,y0)}$.`,type:"line",ans:`y-(${y0})=${m}*(x-(${x0}))`,ansTex:`y = ${lin(m,y0-m*x0)}`,hint:`Parallel means the same slope, $${m}$.`,sol:[`$y ${sg(-y0)} = ${m}(x ${sg(-x0)})$.`,`$y = ${lin(m,y0-m*x0)}$.`]}},
  ()=>{const m=pick([1,2,3,-1,-2,-3,4,-4]),b=nz(-9,9),x0=m*nz(-3,3),y0=rnd(-8,8);return{q:`Write an equation of the line perpendicular to $y = ${lin(m,b)}$ through $${pt(x0,y0)}$.`,type:"line",ans:`(y-(${y0}))*(${m})=-(x-(${x0}))`,ansTex:`y = ${frac(-1,m)}x ${sg(y0+x0/m)}`,hint:`Perpendicular slope: $${frac(-1,m)}$.`,sol:[`Slope $${frac(-1,m)}$: $y ${sg(-y0)} = ${frac(-1,m)}(x ${sg(-x0)})$.`,`$y = ${frac(-1,m)}x ${sg(y0+x0/m)}$.`]}}
 ]},
 {id:"std",title:"Standard Form & Special Lines",idea:"Standard form: $Ax + By = C$. Horizontal lines are $y = k$; vertical lines are $x = h$.",
  lesson:{steps:[["y = \\tfrac{2}{3}x + 1","Clear the fraction."],["3y = 2x + 3","Multiply every term by $3$."],["-2x + 3y = 3 \\;\\text{ or }\\; 2x - 3y = -3","Move $x$ to the left side."]],warn:"A horizontal line is $y = $ number (slope $0$). A vertical line is $x = $ number (undefined slope)."},
  gen:[
  ()=>{const a=rnd(-8,8),b=rnd(-8,8),hz=Math.random()<.5;return{q:`Write the equation of the ${hz?"horizontal":"vertical"} line through $${pt(a,b)}$.`,type:"line",ans:hz?`y=${b}`:`x=${a}`,ansTex:hz?`y = ${b}`:`x = ${a}`,hint:hz?"A horizontal line keeps the same $y$-value.":"A vertical line keeps the same $x$-value.",sol:[hz?`Every point has $y = ${b}$.`:`Every point has $x = ${a}$.`]}},
  ()=>{let p,q;do{p=nz(-5,5);q=rnd(2,5)}while(gcd(p,q)!==1);const b=nz(-6,6);return{q:`Write $y = ${p<0?"-":""}\\tfrac{${Math.abs(p)}}{${q}}x ${sg(b)}$ in standard form $Ax + By = C$ with integer coefficients.`,type:"line",form:"std",ans:`y=${p}/${q}*x+(${b})`,ansTex:`${co(-p,"x")} + ${q}y = ${q*b}`,hint:`Multiply every term by $${q}$, then move the $x$ term to the left.`,sol:[`$${q}y = ${co(p,"x")} ${sg(q*b)}$.`,`$${co(-p,"x")} + ${q}y = ${q*b}$.`]}},
  ()=>{let x1,y1,x2,y2;do{x1=rnd(-6,6);y1=rnd(-6,6);x2=rnd(-6,6);y2=rnd(-6,6)}while(x1===x2||y1===y2);const A=y2-y1,B=x1-x2,C=A*x1+B*y1;return{q:`Write an equation in standard form for the line through $${pt(x1,y1)}$ and $${pt(x2,y2)}$.`,type:"line",form:"std",ans:`${A}*x+(${B})*y=${C}`,ansTex:`${co(A,"x")} ${cterm(B,"y")} = ${C}`,hint:"Find the slope, write point-slope form, then rearrange to $Ax + By = C$.",sol:[`$m = \\dfrac{${y2-y1}}{${x2-x1}}$.`,`Rearranged: $${co(A,"x")} ${cterm(B,"y")} = ${C}$.`]}},
  ()=>{const a=nz(-6,6),b=nz(-6,6);return{q:`Write an equation of the line with $x$-intercept $${a}$ and $y$-intercept $${b}$.`,type:"line",ans:`x/(${a})+y/(${b})=1`,ansTex:`\\dfrac{x}{${a}} + \\dfrac{y}{${b}} = 1`,hint:`The line passes through $${pt(a,0)}$ and $${pt(0,b)}$.`,sol:[`Slope $= \\dfrac{${b} - 0}{0 - ${P(a)}} = ${frac(-b,a)}$, $y$-intercept $${b}$.`,`$y = ${frac(-b,a)}x ${sg(b)}$.`]}},
  ()=>{const r=rnd(3,12),s=rnd(5,30),a=rnd(2,5),b=a+rnd(2,5),n=rnd(b+2,15);return{q:`A store charges a flat fee plus a fixed price per shirt. $${a}$ shirts cost $\\$${s+r*a}$ and $${b}$ shirts cost $\\$${s+r*b}$. How much do $${n}$ shirts cost?`,type:"number",ans:s+r*n,ansTex:`\\$${s+r*n}`,hint:"The price per shirt is the slope: change in cost ÷ change in shirts.",sol:[`Per shirt: $\\dfrac{${s+r*b} - ${s+r*a}}{${b-a}} = ${r}$.`,`Flat fee: $${s+r*a} - ${r}(${a}) = ${s}$.`,`$${n}$ shirts: $${s} + ${r}(${n}) = ${s+r*n}$.`]}}
 ]},
 {id:"apply",title:"Linear Models & Comparisons",idea:"When two linear plans are compared, set their costs <b>equal</b> to find the break-even point.",
  lesson:{steps:[["A: 20 + 5v,\\quad B: 10 + 7v","Two gym plans, $v$ visits."],["20 + 5v = 10 + 7v","Set the costs equal."],["10 = 2v \\Rightarrow v = 5","At $5$ visits the plans cost the same."]],warn:"Check which plan is cheaper <b>after</b> the break-even point — the one with the smaller rate."},
  gen:[

  ()=>{const s=rnd(100,500),r=rnd(10,40);return{q:`You have $\\$${s}$ saved and spend $\\$${r}$ each week. Write the amount left, $A$, after $w$ weeks.`,type:"expr",ans:`${s}-${r}*w`,ansTex:`A = ${s} - ${r}w`,hint:"Spending makes the amount go down, so the rate is negative.",sol:[`$A(w) = ${s} - ${r}w$.`]}},

  ()=>{let s1,r1,s2,r2,v;do{s1=rnd(10,60);s2=rnd(5,50);r1=rnd(2,9);r2=rnd(2,9);v=(s1-s2)/(r2-r1)}while(r1===r2||!Number.isInteger(v)||v<=0);return{q:`Plan A costs $\\$${s1}$ plus $\\$${r1}$ per visit. Plan B costs $\\$${s2}$ plus $\\$${r2}$ per visit. After how many visits do the plans cost the same?`,type:"number",ans:v,ansTex:`${v}\\text{ visits}`,hint:"Set the two cost expressions equal and solve.",sol:[`$${s1} + ${r1}v = ${s2} + ${r2}v$.`,`$${s1-s2} = ${r2-r1}v$, so $v = ${v}$.`]}},
  ()=>{let s1,r1,s2,r2,v;do{s1=pick([20,25,30,40,50]);s2=pick([5,10,15]);r1=pick([0.05,0.1,0.15]);r2=pick([0.2,0.25,0.3,0.4]);v=Math.round((s1-s2)/(r2-r1)*1000)/1000}while(!Number.isInteger(v)||v<=0);return{q:`Phone plan A costs $\\$${s1}$ per month plus $\\$${r1}$ per minute. Plan B costs $\\$${s2}$ per month plus $\\$${r2}$ per minute. For how many minutes do the plans cost exactly the same?`,type:"number",ans:v,ansTex:`${v}\\text{ minutes}`,hint:"Set the costs equal. Multiply by 100 to clear the decimals.",sol:[`$${s1} + ${r1}m = ${s2} + ${r2}m$.`,`$${s1-s2} = ${Math.round((r2-r1)*100)/100}m$, so $m = ${v}$.`]}}
 ]}
]}

{id:"ch7",title:"Systems of Linear Equations",topics:[
 {id:"solve",title:"Solving Systems",idea:"The solution of a system is the point $(x, y)$ that makes <b>both</b> equations true. Use <b>substitution</b> or <b>elimination</b>.",
  lesson:{steps:[["x + y = 10,\\quad x - y = 4","Two equations, two unknowns."],["2x = 14","Add the equations: the $y$'s cancel (elimination)."],["x = 7,\\ y = 3","Substitute $x = 7$ into $x + y = 10$."],["(7, 3)","Check: $7 - 3 = 4$ ✓"]],warn:"Find <b>both</b> $x$ and $y$ — the answer is a point."},
  gen:[
  ()=>{let m1,m2;do{m1=nz(-4,4);m2=nz(-4,4)}while(m1===m2);const x=nz(-6,6),y=rnd(-8,8),b1=y-m1*x,b2=y-m2*x;return{q:`Solve the system: $y = ${lin(m1,b1)}$ and $y = ${lin(m2,b2)}$.`,type:"point",ans:[x,y],ansTex:pt(x,y),hint:"Both equal $y$, so set the right sides equal to each other.",sol:[`$${lin(m1,b1)} = ${lin(m2,b2)}$, so $${co(m1-m2,"x")} = ${b2-b1}$ and $x = ${x}$.`,`$y = ${y}$. Solution: $${pt(x,y)}$.`]}},
  ()=>{let m,a,b;do{m=nz(-3,3);a=nz(-4,4);b=nz(-4,4)}while(a+b*m===0);const x=nz(-6,6),y0=rnd(-6,6),k=y0-m*x,c=a*x+b*y0;return{q:`Solve the system: $y = ${lin(m,k)}$ and $${co(a,"x")} ${cterm(b,"y")} = ${c}$.`,type:"point",ans:[x,y0],ansTex:pt(x,y0),hint:"Substitute the first equation into the second.",sol:[`$${co(a,"x")} ${sg(b)}(${lin(m,k)}) = ${c}$.`,`$${co(a+b*m,"x")} ${sg(b*k)} = ${c}$, so $x = ${x}$.`,`$y = ${y0}$: $${pt(x,y0)}$.`]}},
  ()=>{let a1,a2,b;do{a1=nz(-5,5);a2=nz(-5,5);b=rnd(1,5)}while(a1+a2===0);const x=nz(-6,6),y=nz(-6,6);return{q:`Solve: $${co(a1,"x")} + ${co(b,"y")} = ${a1*x+b*y}$ and $${co(a2,"x")} - ${co(b,"y")} = ${a2*x-b*y}$.`,type:"point",ans:[x,y],ansTex:pt(x,y),hint:"Add the equations — the $y$ terms cancel.",sol:[`Add: $${co(a1+a2,"x")} = ${(a1+a2)*x}$, so $x = ${x}$.`,`Substitute to get $y = ${y}$: $${pt(x,y)}$.`]}},
  ()=>{let a1,b1,a2,b2;do{a1=nz(-6,6);b1=nz(-6,6);a2=nz(-6,6);b2=nz(-6,6)}while(a1*b2-a2*b1===0||Math.abs(b1)===Math.abs(b2)||Math.abs(a1)===Math.abs(a2));const x=nz(-5,5),y=nz(-5,5);return{q:`Solve: $${co(a1,"x")} ${cterm(b1,"y")} = ${a1*x+b1*y}$ and $${co(a2,"x")} ${cterm(b2,"y")} = ${a2*x+b2*y}$.`,type:"point",ans:[x,y],ansTex:pt(x,y),hint:"Multiply one or both equations so one variable has opposite coefficients, then add.",sol:[`Multiply to match coefficients, then eliminate one variable.`,`Solution: $${pt(x,y)}$.`]}},
  ()=>{const A=rnd(6,15),C=rnd(2,A-1),a=rnd(5,40),c=rnd(3,30),M=A*a+C*c,N=a+c;return{q:`Adult tickets cost $\\$${A}$ and child tickets cost $\\$${C}$. A group of $${N}$ people paid $\\$${M}$. How many adult tickets were bought?`,type:"number",ans:a,ansTex:`${a}`,hint:"Let $a$ = adults, $c$ = children: $a + c = "+N+"$ and $"+A+"a + "+C+"c = "+M+"$.",sol:[`$a + c = ${N}$ and $${A}a + ${C}c = ${M}$.`,`Substitute $c = ${N} - a$: $${A}a + ${C}(${N} - a) = ${M}$, so $${A-C}a = ${M-C*N}$.`,`$a = ${a}$.`]}}
 ]},
 {id:"nsol",title:"How Many Solutions?",idea:"Different slopes → <b>one</b> solution. Same slope, different intercept → <b>no</b> solution (parallel). Same line → <b>infinitely many</b>.",
  lesson:{steps:[["y = 2x + 1,\\quad y = 2x - 3","Compare slopes and intercepts."],["\\text{same slope } 2","The lines are parallel..."],["\\text{different intercepts}","...and never meet: <b>no solution</b>."]],warn:"Rewrite both equations in $y = mx + b$ form before comparing — $2x - y = 3$ and $4x - 2y = 6$ are the <b>same</b> line."},
  gen:[
  ()=>{const m=nz(-5,5),b1=nz(-9,9),one=Math.random()<.5;let m2=m,b2;if(one){do{m2=nz(-5,5)}while(m2===m);b2=nz(-9,9)}else{do{b2=nz(-9,9)}while(b2===b1)}return{q:`How many solutions does the system have? $y = ${lin(m,b1)}$ and $y = ${lin(m2,b2)}$`,type:"nsol",ans:one?"ONE":"NONE",ansTex:one?"\\text{one}":"\\text{none}",hint:"Compare the slopes first.",sol:[one?"Different slopes, so the lines cross once: one solution.":"Same slope, different intercepts: parallel lines, no solution."]}},
  ()=>{const kind=pick(["ONE","NONE","INF"]),m=nz(-4,4),b=nz(-8,8),k=pick([2,3,-2]);let L2;if(kind==="INF")L2=`${co(-m*k,"x")} + ${k===1?"":k}y = ${b*k}`.replace("+ -","- ");else if(kind==="NONE")L2=`y = ${lin(m,b+nz(1,5))}`;else L2=`y = ${lin(m+nz(1,3),b)}`;return{q:`How many solutions does the system have? $y = ${lin(m,b)}$ and $${L2}$`,type:"nsol",ans:kind,ansTex:{ONE:"\\text{one}",NONE:"\\text{none}",INF:"\\text{infinitely many}"}[kind],hint:"Put both in $y = mx + b$ form and compare slope and intercept.",sol:[{ONE:"Different slopes: one solution.",NONE:"Same slope, different intercept: no solution.",INF:"After dividing, the second equation is the same line: infinitely many solutions."}[kind]]}},
  ()=>{const kind=pick(["ONE","NONE","INF"]),a=nz(-5,5),b=nz(-5,5),c=nz(-9,9),k=pick([2,3,-2,-3]);let a2=a*k,b2=b*k,c2=c*k;if(kind==="NONE")c2=c*k+nz(1,4);if(kind==="ONE")b2=b*k+pick([1,-1]);return{q:`How many solutions? $${co(a,"x")} ${cterm(b,"y")} = ${c}$ and $${co(a2,"x")} ${cterm(b2,"y")} = ${c2}$`,type:"nsol",ans:kind,ansTex:{ONE:"\\text{one}",NONE:"\\text{none}",INF:"\\text{infinitely many}"}[kind],hint:`Is the second equation exactly $${k}$ times the first? Check the left side and the right side.`,sol:[{ONE:"The coefficients are not proportional, so the slopes differ: one solution.",NONE:`The left side is $${k}$ times the first, but the right side isn't: parallel, no solution.`,INF:`The whole equation is $${k}$ times the first: same line, infinitely many solutions.`}[kind]]}},
  ()=>{const m=nz(-5,5),b=nz(-6,6),r=pick([2,3,4]),c=nz(-9,9);return{q:`For what value of $k$ does the system $y = ${lin(m,b)}$ and $${co(r*m,"x")} - ky = ${c}$ have <b>no solution</b>?`,type:"number",ans:r,ansTex:`k = ${r}`,hint:"No solution means the slopes are equal. Find the slope of the second line in terms of $k$.",sol:[`Second line: $y = \\dfrac{${r*m}}{k}x - \\dfrac{${c}}{k}$, slope $\\dfrac{${r*m}}{k}$.`,`Set $\\dfrac{${r*m}}{k} = ${m}$: $k = ${r}$ (and check the intercepts differ).`]}},
  ()=>{const p=nz(-5,5),q=nz(-4,4),c=nz(-6,6),k=pick([2,3,-2]);return{q:`The system $ax ${cterm(k*q,"y")} = ${k*c}$ and $${co(p,"x")} ${cterm(q,"y")} = b$ has infinitely many solutions. Find $a + b$.`,type:"number",ans:k*p+c,ansTex:`a + b = ${k*p+c}`,hint:"Infinitely many means one equation is a multiple of the other. Compare the $y$ coefficients to find the multiple.",sol:[`$y$ coefficients: $${k*q} = ${k}(${q})$, so the first equation is $${k}$ times the second.`,`$a = ${k}(${p}) = ${k*p}$ and $${k*c} = ${k}b$, so $b = ${c}$.`,`$a + b = ${k*p+c}$.`]}}
 ]},
 {id:"word",title:"System Word Problems",idea:"Name two unknowns, write <b>two equations</b> from the two facts, then solve the system.",
  lesson:{steps:[["\\text{Two numbers: sum } 20,\\ \\text{difference } 6","Two facts → two equations."],["x + y = 20,\\quad x - y = 6","Write them."],["2x = 26 \\Rightarrow x = 13,\\ y = 7","Add and solve."]],warn:"Each fact gives one equation. Two unknowns need <b>two</b> equations."},
  gen:[
  ()=>{const a=rnd(10,50),b=rnd(1,a-1);return{q:`The sum of two numbers is $${a+b}$ and their difference is $${a-b}$. Find the larger number.`,type:"number",ans:a,ansTex:`${a}`,hint:"Add the two equations $x + y$ and $x - y$.",sol:[`$x + y = ${a+b}$, $x - y = ${a-b}$.`,`$2x = ${2*a}$, so $x = ${a}$.`]}},
  ()=>{const A=rnd(8,15),C=rnd(3,A-2),a=rnd(10,60),c=rnd(10,60);return{q:`A theater sold $${a+c}$ tickets for $\\$${A*a+C*c}$. Adult tickets cost $\\$${A}$ and student tickets cost $\\$${C}$. How many student tickets were sold?`,type:"number",ans:c,ansTex:`${c}`,hint:"Write one equation for the number of tickets and one for the money.",sol:[`$a + s = ${a+c}$, $${A}a + ${C}s = ${A*a+C*c}$.`,`$${A}(${a+c} - s) + ${C}s = ${A*a+C*c}$, so $${A-C}s = ${(A-C)*c}$.`,`$s = ${c}$.`]}},
  ()=>{const n=rnd(5,30),d=rnd(5,30);return{q:`Maya has $${n+d}$ coins, all nickels and dimes, worth $\\$${((5*n+10*d)/100).toFixed(2)}$. How many dimes does she have?`,type:"number",ans:d,ansTex:`${d}`,hint:"Work in cents: $5n + 10d = "+(5*n+10*d)+"$.",sol:[`$n + d = ${n+d}$, $5n + 10d = ${5*n+10*d}$.`,`$5(${n+d} - d) + 10d = ${5*n+10*d}$, so $5d = ${5*d}$.`,`$d = ${d}$.`]}},
  ()=>{let p1,p2,pt_,A,B;do{p1=pick([10,20,25,30]);p2=pick([40,50,60,70,80]);A=rnd(2,20);B=rnd(2,20);pt_=(p1*A+p2*B)/(A+B)}while(!Number.isInteger(pt_));return{q:`How many liters of a $${p1}\\%$ salt solution must be mixed with a $${p2}\\%$ solution to make $${A+B}$ liters of a $${pt_}\\%$ solution?`,type:"number",ans:A,ansTex:`${A}\\text{ L}`,hint:`Let $x$ = liters of ${p1}%. Then $${p1}x + ${p2}(${A+B} - x) = ${pt_}(${A+B})$.`,sol:[`$${p1}x + ${p2}(${A+B} - x) = ${pt_*(A+B)}$.`,`$${p2*(A+B)} - ${p2-p1}x = ${pt_*(A+B)}$, so $x = ${A}$.`]}},
  ()=>{let b,c,d,u;do{b=rnd(8,25);c=rnd(1,b-3);d=pick([2,3,4,5,6]);u=(b+c)*d/(b-c)}while(!Number.isInteger(u));return{q:`A boat travels $${(b+c)*d}$ miles downstream in $${d}$ hours and the same distance back upstream in $${u}$ hours. What is the speed of the boat in still water?`,type:"number",ans:b,ansTex:`${b}\\text{ mph}`,hint:"Downstream speed = boat + current. Upstream speed = boat − current.",sol:[`Downstream: $${(b+c)*d} \\div ${d} = ${b+c}$ mph. Upstream: $${(b+c)*d} \\div ${u} = ${b-c}$ mph.`,`$b + c = ${b+c}$ and $b - c = ${b-c}$, so $b = ${b}$.`]}}
 ]}
]},
{id:"ch8",title:"Exponents & Exponent Rules",topics:[
 {id:"rules",title:"Exponent Rules",idea:"Multiply → <b>add</b> exponents. Divide → <b>subtract</b>. Power of a power → <b>multiply</b>.",

  ()=>{const a=nz(-6,6),b=rnd(2,6),m=rnd(2,6),n=rnd(2,6);return{q:`Simplify $(${co(a,"x^{"+m+"}")})(${co(b,"x^{"+n+"}")})$.`,type:"expr",form:"simp",ans:`${a*b}*x^${m+n}`,ansTex:`${a*b}x^{${m+n}}`,hint:"Multiply the numbers, add the exponents.",sol:[`$${a} \\cdot ${b} = ${a*b}$ and $x^{${m}+${n}} = x^{${m+n}}$.`,`$${a*b}x^{${m+n}}$.`]}},

  ()=>{const d=rnd(2,6),k=rnd(2,6),a=rnd(4,8),b=rnd(2,a-1),c=rnd(2,4),e=c+rnd(1,4);return{q:`Simplify $\\dfrac{${d*k}x^{${a}}y^{${c}}}{${d}x^{${b}}y^{${e}}}$. Use positive exponents.`,type:"expr",form:"simp",ans:`${k}*x^${a-b}/y^${e-c}`,ansTex:`\\dfrac{${k}${a-b===1?"x":"x^{"+(a-b)+"}"}}{${e-c===1?"y":"y^{"+(e-c)+"}"}}`,hint:"Divide the numbers, subtract exponents. If $y$ ends up negative, move it to the bottom.",sol:[`$${d*k} \\div ${d} = ${k}$, $x^{${a}-${b}} = x^{${a-b}}$, $y^{${c}-${e}} = y^{${c-e}} = \\dfrac{1}{y^{${e-c}}}$.`]}},
  ()=>{let b,p,q,a,c,x;do{b=pick([2,3,5]);p=rnd(1,3);q=rnd(1,3);a=nz(-3,3);c=nz(-3,3);x=(q*c-p*a)/(p-q)}while(p===q||!Number.isInteger(x));return{q:`Solve $${b**p}^{x ${sg(a)}} = ${b**q}^{x ${sg(c)}}$.`,type:"set",ans:[x],ansTex:`x = ${x}`,hint:`Write both sides as powers of $${b}$, then set the exponents equal.`,sol:[`$${b}^{${p}(x ${sg(a)})} = ${b}^{${q}(x ${sg(c)})}$.`,`$${p}x ${sg(p*a)} = ${q}x ${sg(q*c)}$, so $x = ${x}$.`]}}
 ]},
 {id:"neg",title:"Zero & Negative Exponents",idea:"$a^0 = 1$ and $a^{-n} = \\dfrac{1}{a^n}$. A negative exponent means \"flip it\", not \"make it negative\".",
  lesson:{steps:[["2^{-3}","Negative exponent."],["= \\dfrac{1}{2^3}","Flip to the denominator."],["= \\dfrac{1}{8}","Not $-8$!"]],warn:"$2^{-3}$ is $\\dfrac{1}{8}$, a small positive number — not $-8$ or $-6$."},

  ()=>{const m=rnd(2,6),n=rnd(2,6),c=rnd(2,9);return{q:`Rewrite with positive exponents: $${c}x^{-${m}}y^{${n}}$.`,type:"expr",form:"simp",ans:`${c}*y^${n}/x^${m}`,ansTex:`\\dfrac{${c}y^{${n}}}{x^{${m}}}`,hint:"Only $x$ has a negative exponent, so only $x$ moves to the bottom.",sol:[`$x^{-${m}} = \\dfrac{1}{x^{${m}}}$.`,`$\\dfrac{${c}y^{${n}}}{x^{${m}}}$.`]}},

 ]},
 {id:"sci",title:"Scientific Notation & Growth",idea:"$3.2 \\times 10^4 = 32{,}000$. Exponential growth: $y = a \\cdot b^t$ — start at $a$, multiply by $b$ each step.",

 ]}

{id:"ch9",title:"Polynomials: Operations",topics:[
 {id:"add",title:"Adding & Subtracting Polynomials",idea:"Combine <b>like terms</b> — same variable, same exponent. When subtracting, change <b>every</b> sign in the second polynomial.",
  lesson:{steps:[["(3x^2 + 2x - 1) - (x^2 - 4x + 5)","Subtracting."],["3x^2 + 2x - 1 - x^2 + 4x - 5","Change every sign in the second one."],["2x^2 + 6x - 6","Combine like terms."]],warn:"$x^2$ and $x$ are <b>not</b> like terms. Only add terms with the same exponent."},
  gen:[
  ()=>{const A=[nz(-6,6),nz(-9,9),nz(-9,9)],B=[nz(-6,6),nz(-9,9),nz(-9,9)],S=A.map((v,i)=>v+B[i]);return{q:`Simplify $(${ptex(A)}) + (${ptex(B)})$.`,type:"expr",form:"poly",ans:pstr(S),ansTex:ptex(S),hint:"Add the $x^2$ terms, the $x$ terms, and the numbers.",sol:[`$${ptex(S)}$.`]}},
  ()=>{const A=[nz(-6,6),nz(-9,9),nz(-9,9)],B=[nz(-6,6),nz(-9,9),nz(-9,9)],S=A.map((v,i)=>v-B[i]);return{q:`Simplify $(${ptex(A)}) - (${ptex(B)})$.`,type:"expr",form:"poly",ans:pstr(S),ansTex:ptex(S),hint:"Change every sign in the second polynomial, then combine.",sol:[`$${ptex(A)} ${ptex(B.map(v=>-v)).startsWith("-")?"":"+ "}${ptex(B.map(v=>-v))}$.`,`$= ${ptex(S)}$.`]}},
  ()=>{const A=[nz(-4,4),nz(-6,6),0,nz(-9,9)],B=[0,nz(-6,6),nz(-9,9),nz(-9,9)],C=[nz(-4,4),0,nz(-6,6),nz(-9,9)],S=A.map((v,i)=>v+B[i]-C[i]);return{q:`Simplify $(${ptex(A)}) + (${ptex(B)}) - (${ptex(C)})$.`,type:"expr",form:"poly",ans:pstr(S),ansTex:ptex(S),hint:"Line up like terms by degree. Watch the minus on the last group.",sol:[`$${ptex(S)}$.`]}},
  ()=>{const a=pick([2,3,-2,-3]),b=pick([2,3,4,-4]),A=[nz(-4,4),nz(-6,6),nz(-9,9)],B=[nz(-4,4),nz(-6,6),nz(-9,9)],S=A.map((v,i)=>a*v+b*B[i]);return{q:`Simplify $${a}(${ptex(A)}) ${b<0?"-":"+"} ${Math.abs(b)}(${ptex(B)})$.`,type:"expr",form:"poly",ans:pstr(S),ansTex:ptex(S),hint:"Distribute each number first, then combine like terms.",sol:[`$${ptex(A.map(v=>a*v))} ${ptex(B.map(v=>b*v)).startsWith("-")?"":"+ "}${ptex(B.map(v=>b*v))}$.`,`$= ${ptex(S)}$.`]}},
  ()=>{const a=nz(-3,3),b=nz(-4,4),n=rnd(2,3),c=nz(-3,3),d=nz(-3,3),v=(a+b)**n*(c+d);return{q:`What is the sum of the coefficients of $(${lin(a,b)})^{${n}}(${lin(c,d)})$ when it is expanded?`,type:"number",ans:v,ansTex:`${v}`,hint:"Shortcut: the sum of the coefficients of a polynomial equals its value at $x = 1$.",sol:[`Substitute $x = 1$: $(${a+b})^{${n}}(${c+d}) = ${v}$.`]}}
 ]},
 {id:"mul",title:"Multiplying Polynomials",idea:"Multiply <b>every</b> term in the first by <b>every</b> term in the second, then combine like terms. For two binomials: <b>FOIL</b>.",
  lesson:{steps:[["(x + 3)(x + 4)","Two binomials."],["x^2 + 4x + 3x + 12","First, Outer, Inner, Last."],["x^2 + 7x + 12","Combine the middle terms."]],warn:"$(x + 3)^2$ is <b>not</b> $x^2 + 9$. It's $(x + 3)(x + 3) = x^2 + 6x + 9$."},
  gen:[

  ()=>{const r=nz(-9,9),s=nz(-9,9),S=[1,r+s,r*s];return{q:`Multiply $(x ${sg(r)})(x ${sg(s)})$.`,type:"expr",form:"poly",ans:pstr(S),ansTex:ptex(S),hint:"FOIL: First, Outer, Inner, Last.",sol:[`$x^2 ${sg(s)}x ${sg(r)}x ${sg(r*s)}$.`,`$= ${ptex(S)}$.`]}},
  ()=>{const a=nz(-5,5),b=nz(-7,7),c=nz(-5,5),d=nz(-7,7),S=pmul([a,b],[c,d]);return{q:`Multiply $(${lin(a,b)})(${lin(c,d)})$.`,type:"expr",form:"poly",ans:pstr(S),ansTex:ptex(S),hint:"FOIL, then combine the two middle terms.",sol:[`$${co(a*c,"x^2")} ${sg(a*d)}x ${sg(b*c)}x ${sg(b*d)}$.`,`$= ${ptex(S)}$.`]}},
  ()=>{if(Math.random()<.5){const a=rnd(1,5),b=nz(-7,7),S=pmul([a,b],[a,b]);return{q:`Expand $(${lin(a,b)})^2$.`,type:"expr",form:"poly",ans:pstr(S),ansTex:ptex(S),hint:"$(A + B)^2 = A^2 + 2AB + B^2$ — don't forget the middle term!",sol:[`$(${co(a,"x")})^2 + 2(${co(a,"x")})(${b}) + (${b})^2$.`,`$= ${ptex(S)}$.`]}}const a=nz(-4,4),b=nz(-6,6),C=[1,nz(-5,5),nz(-6,6)],S=pmul([a,b],C);return{q:`Multiply $(${lin(a,b)})(${ptex(C)})$.`,type:"expr",form:"poly",ans:pstr(S),ansTex:ptex(S),hint:"Multiply each term of the binomial by all three terms, then combine.",sol:[`$${ptex(S)}$.`]}},
  ()=>{const n=rnd(3,5),k=rnd(1,n-1),a=nz(-3,3),C=[1,1,2,6,24,120],v=C[n]/(C[k]*C[n-k])*a**(n-k);return{q:`What is the coefficient of $x^{${k}}$ in the expansion of $(x ${sg(a)})^{${n}}$?`,type:"number",ans:v,ansTex:`${v}`,hint:`Binomial Theorem: the $x^{${k}}$ term is $\\binom{${n}}{${k}}x^{${k}}(${a})^{${n-k}}$.`,sol:[`$\\binom{${n}}{${k}} = ${C[n]/(C[k]*C[n-k])}$ and $(${a})^{${n-k}} = ${a**(n-k)}$.`,`Coefficient: $${v}$.`]}}
 ]},
 {id:"div",title:"Dividing Polynomials",idea:"Divide by a monomial: divide <b>each term</b>. Divide by a binomial: use long division or factor and cancel.",
  lesson:{steps:[["\\dfrac{6x^3 + 9x^2}{3x}","Divide each term by $3x$."],["\\dfrac{6x^3}{3x} + \\dfrac{9x^2}{3x}","Split it up."],["2x^2 + 3x","Divide numbers, subtract exponents."]],warn:"Divide <b>every</b> term, not just the first one."},

  ()=>{const d=nz(-4,4),a=nz(-4,4),b=nz(-5,5),c=nz(-6,6);return{q:`Simplify $\\dfrac{${ptex([a*d,b*d,c*d,0])}}{${co(d,"x")}}$.`,type:"expr",form:"poly",ans:pstr([a,b,c]),ansTex:ptex([a,b,c]),hint:"Divide every term — watch the signs if the divisor is negative.",sol:[`$${ptex([a,b,c])}$.`]}},
  ()=>{const r=nz(-7,7),s=nz(-7,7);return{q:`Divide: $(${ptex([1,r+s,r*s])}) \\div (x ${sg(r)})$.`,type:"expr",form:"poly",ans:`x+(${s})`,ansTex:`x ${sg(s)}`,hint:"Factor the top, then cancel — or use long division.",sol:[`$${ptex([1,r+s,r*s])} = (x ${sg(r)})(x ${sg(s)})$.`,`Quotient: $x ${sg(s)}$.`]}},
  ()=>{const r=nz(-4,4),Q=[1,nz(-5,5),nz(-6,6)],N=pmul([1,-r],Q);return{q:`Divide: $(${ptex(N)}) \\div (x ${sg(-r)})$.`,type:"expr",form:"poly",ans:pstr(Q),ansTex:ptex(Q),hint:`Use long division or synthetic division with $${r}$.`,sol:[`Synthetic division by $${r}$ gives $${ptex(Q)}$ with remainder $0$.`]}},
  ()=>{const C=[nz(-3,3),nz(-5,5),nz(-6,6),nz(-9,9)],a=nz(-3,3),v=C[0]*a**3+C[1]*a**2+C[2]*a+C[3];return{q:`What is the remainder when $${ptex(C)}$ is divided by $x ${sg(-a)}$?`,type:"number",ans:v,ansTex:`${v}`,hint:`Remainder Theorem: the remainder is the value of the polynomial at $x = ${a}$.`,sol:[`$P(${a}) = ${v}$.`]}}
 ]}

{id:"ch10",title:"Factoring Polynomials",topics:[
 {id:"gcf",title:"GCF & Difference of Squares",idea:"Always take out the <b>greatest common factor</b> first. Then look for $a^2 - b^2 = (a - b)(a + b)$.",
  lesson:{steps:[["2x^2 - 50","Is there a GCF?"],["2(x^2 - 25)","Take out $2$."],["2(x - 5)(x + 5)","$x^2 - 25$ is a difference of squares."]],warn:"$x^2 + 25$ does <b>not</b> factor — only a <b>difference</b> of squares does."},
  gen:[
  ()=>{let g,a,b;do{g=rnd(2,9);a=rnd(1,9);b=nz(-9,9)}while(gcd(a,b)!==1);return{q:`Factor: $${lin(g*a,g*b)}$.`,type:"expr",form:"factored",ans:`${g}*(${a}*x+(${b}))`,ansTex:`${g}(${lin(a,b)})`,hint:"What is the largest number that divides both terms?",sol:[`GCF $= ${g}$.`,`$${g}(${lin(a,b)})$.`]}},
  ()=>{let g,a,b;do{g=rnd(1,6);a=rnd(1,6);b=nz(-9,9)}while(gcd(a,b)!==1);return{q:`Factor: $${ptex([g*a,g*b,0])}$.`,type:"expr",form:"factored",ans:`${g}*x*(${a}*x+(${b}))`,ansTex:`${g===1?"":g}x(${lin(a,b)})`,hint:"Both terms have a common number and a common $x$.",sol:[`GCF $= ${g===1?"":g}x$.`,`$${g===1?"":g}x(${lin(a,b)})$.`]}},
  ()=>{const a=rnd(2,12);return{q:`Factor: $x^2 - ${a*a}$.`,type:"expr",form:"factored",ans:`(x-${a})*(x+${a})`,ansTex:`(x - ${a})(x + ${a})`,hint:`$${a*a} = ${a}^2$: difference of squares.`,sol:[`$x^2 - ${a}^2 = (x - ${a})(x + ${a})$.`]}},
  ()=>{if(Math.random()<.5){const a=rnd(2,6),b=rnd(1,9);if(gcd(a,b)!==1)return{q:`Factor completely: $${a*a}x^2 - 1$.`,type:"expr",form:"factored",ans:`(${a}*x-1)*(${a}*x+1)`,ansTex:`(${a}x - 1)(${a}x + 1)`,hint:"Difference of squares.",sol:[`$(${a}x)^2 - 1^2 = (${a}x - 1)(${a}x + 1)$.`]};return{q:`Factor completely: $${a*a}x^2 - ${b*b}$.`,type:"expr",form:"factored",ans:`(${a}*x-${b})*(${a}*x+${b})`,ansTex:`(${a}x - ${b})(${a}x + ${b})`,hint:`$(${a}x)^2 - ${b}^2$.`,sol:[`$(${a}x - ${b})(${a}x + ${b})$.`]}}const g=rnd(2,5),a=rnd(2,9);return{q:`Factor completely: $${g}x^2 - ${g*a*a}$.`,type:"expr",form:"factored",ans:`${g}*(x-${a})*(x+${a})`,ansTex:`${g}(x - ${a})(x + ${a})`,hint:"Take out the GCF first, then use difference of squares.",sol:[`$${g}(x^2 - ${a*a})$.`,`$${g}(x - ${a})(x + ${a})$.`]}},
  ()=>{const n=pick([100,1000,50,200]),k=rnd(1,9),v=(n+k)**2-(n-k)**2;return{q:`Compute $${n+k}^2 - ${n-k}^2$ without a calculator.`,type:"number",ans:v,ansTex:`${v}`,hint:"Difference of squares: $a^2 - b^2 = (a - b)(a + b)$.",sol:[`$(${n+k} - ${n-k})(${n+k} + ${n-k}) = ${2*k} \\cdot ${2*n} = ${v}$.`]}}
 ]},
 {id:"tri1",title:"Factoring x² + bx + c",idea:"Find two numbers that <b>multiply to $c$</b> and <b>add to $b$</b>. Then $x^2 + bx + c = (x + m)(x + n)$.",
  lesson:{steps:[["x^2 + 7x + 12","Need: multiply to $12$, add to $7$."],["3 \\cdot 4 = 12,\\ 3 + 4 = 7","Found them."],["(x + 3)(x + 4)","Write the factors."]],warn:"If $c$ is negative, the two numbers have <b>opposite</b> signs. If $c$ is positive and $b$ negative, <b>both</b> are negative."},
  gen:[

function lineEq(student,expected,form){

function radOK(input){ const t=clean(input).replace(/\s+/g,""); if(/\/\(?\*?sqrt/.test(t)) return false; const args=[...t.matchAll(/sqrt\(([^)]*)\)/g)].map(m=>m[1]); for(const a of args){ const n=Number(a); if(!Number.isInteger(n)||n<2) return false; if(radParts(n)[0]!==1) return false; } return true; }
function parseRoots(s){ s=clean(s).replace(/\+\/-|\+-/g,"±").replace(/\b(or|and)\b/gi,",").replace(/;/g,","); const out=[];
  for(let part of s.split(",")){ part=part.trim(); if(!part) continue; if(part.includes("=")) part=part.split("=").pop().trim();
    if(part.includes("±")){ const i=part.indexOf("±"), L=part.slice(0,i).trim(), R=part.slice(i+1).trim();

function factorsOf(n){ n=strip(n); if(n.isOperatorNode&&n.fn==="unaryMinus") return factorsOf(n.args[0]); if(n.isOperatorNode&&n.fn==="multiply") return n.args.flatMap(factorsOf); if(n.isOperatorNode&&n.fn==="pow"&&isSum(n.args[0])) return [strip(n.args[0])]; return [n]; }
function coeffsX(node){ const ys=[0,1,2,3,4].map(x=>evalAt(node,{x})); if(ys.some(isNaN)) return null; const c=[]; let d=ys.slice(); const fact=[1,1,2,6,24]; const diffs=[];

function formOK(S,s,form){
  if(form==="simp"){ if(/\)\s*\^/.test(s)||/\^\s*-|\^\(-/.test(s)) return false; const cnt={}; S.traverse((n,path,parent)=>{ if(n.isSymbolNode&&!(parent&&parent.isFunctionNode&&path==="fn")&&!CONST.has(n.name)) cnt[n.name]=(cnt[n.name]||0)+1; }); return !Object.values(cnt).some(c=>c>1); }

    for(const fa of f){ if(!isSum(fa)) continue; const vs=varsOf(fa); if(vs.length!==1||vs[0]!=="x") continue; const c=coeffsX(fa); if(!c) continue; const g=c.filter(v=>v!==0).reduce((a,b)=>gcd(a,Math.round(b)),0); if(Math.abs(g)>1) return false;
      const nz_=c.filter(v=>v!==0).length; if(c[2]!==0&&c[3]===0&&c[1]!==0||false){ /* quadratic factor: check if it factors further over integers */ const A=c[2],B=c[1],C=c[0],D=B*B-4*A*C; if(D>=0&&Number.isInteger(Math.sqrt(D))) return false; }
      if(c[2]!==0&&c[3]===0&&c[1]===0&&c[0]!==0){ const A=c[2],C=c[0],D=-4*A*C; if(D>0&&Number.isInteger(Math.sqrt(D))) return false; } }
    return true; }

/* inequalities → list of intervals {lo,li,hi,hiI} */
function ray(op,v){ return op===">"?{lo:v,li:false,hi:Infinity,hiI:false}:op===">="?{lo:v,li:true,hi:Infinity,hiI:false}:op==="<"?{lo:-Infinity,li:false,hi:v,hiI:false}:{lo:-Infinity,li:false,hi:v,hiI:true}; }
function parseIneqPart(str){
  const t=str.replace(/\s+/g,"").split(/(<=|>=|<|>)/); const isV=x=>/^[a-z]$/i.test(x);
  if(t.length===3){ if(isV(t[0])){ const v=val(t[2]); return isNaN(v)?null:ray(t[1],v); } if(isV(t[2])){ const v=val(t[0]); return isNaN(v)?null:ray(FLIP[t[1]],v); } return null; }

function parseIneq(s){ s=clean(s).toLowerCase(); const out=[];

    q("qr").hidden=true; q("qh").textContent=""; q("qf").innerHTML=""; const b=document.createElement("button"); b.className="btn teal"; b.textContent="See the topics"; b.onclick=()=>m.remove(); q("qf").appendChild(b); };
  const answer=r=>{ res.push(r); if(!r){ end(); return; } i++; i>=PL.length?end():ask(); };
  q("qc").onclick=()=>{ const v=q("qa").value.trim(); if(!v) return; const r=check(pr,v); if(r===null){ q("qf").innerHTML=`<div class="fb hint">I couldn't read that. ${HOW[pr.type]}</div>`; return; } answer(r); };
  q("qa").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); q("qc").click(); } });
  q("qs").onclick=()=>answer(false); q("qx").onclick=()=>m.remove(); m.addEventListener("click",e=>{ if(e.target===m) m.remove(); });
  ask(); };

/* ---- learn ---- */
let LI=0, shown=1, TP=null, tDone=false, tTries=0;
function road(){ const r=$("road"); r.innerHTML=""; CH.topics.forEach((t,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="stop"+(st.learned[t.id]?" done":"")+(i===LI?" on":""); b.innerHTML=`<i>${st.learned[t.id]?"✓":i+1}</i>${t.title}`; b.onclick=()=>openLesson(i); r.appendChild(b); }); }
function openLesson(i,scroll){ LI=i; shown=1; tDone=false; tTries=0; TP=null; road(); drawLesson(); if(scroll) $("lesson").scrollIntoView({behavior:"smooth",block:"start"}); }
function drawLesson(){
  const t=CH.topics[LI], l=t.lesson, box=$("lesson");
  box.innerHTML=`<span class="label">Lesson ${LI+1} of ${CH.topics.length}</span><h2>${t.title}</h2><div class="big">${t.idea}</div><span class="label">Simplest example — one step at a time</span><ol class="steps">${l.steps.slice(0,shown).map(s=>`<li><div><div class="m">$${s[0]}$</div><div class="w">${s[1]}</div></div></li>`).join("")}</ol>`;
  if(shown<l.steps.length){ const b=document.createElement("button"); b.className="btn"; b.style.alignSelf="flex-start"; b.textContent="Next step →"; b.onclick=()=>{ shown++; drawLesson(); }; box.appendChild(b);
    const s=document.createElement("button"); s.className="btn ghost sm"; s.style.alignSelf="flex-start"; s.textContent="Show all steps"; s.onclick=()=>{ shown=l.steps.length; drawLesson(); }; box.appendChild(s); }
  else {
    box.insertAdjacentHTML("beforeend",`<div class="warn"><b>Watch out: </b>${l.warn}</div>`);
    if(!TP) TP=t.gen[0]();
    const w=document.createElement("div"); w.className="turn";
    w.innerHTML=`<span class="label" style="color:var(--gold)">Your turn</span><div class="q">${TP.q}</div><div class="row"><input type="text" id="tAns" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><button class="btn" id="tChk">Check</button><button class="btn ghost" id="tHint">Hint</button></div><div class="howto">${HOW[TP.type]}</div><div id="tFb"></div>`;
    box.appendChild(w);
    const nav=document.createElement("div"); nav.className="lnav"; const left=document.createElement("div"); left.className="row";
    if(LI>0){ const pv=document.createElement("button"); pv.className="btn ghost sm"; pv.textContent="← Previous lesson"; pv.onclick=()=>openLesson(LI-1,true); left.appendChild(pv); }
    const right=document.createElement("div"); right.className="row"; right.id="tNext"; nav.append(left,right); box.appendChild(nav);
    const fbx=(k,tag,h)=>{ $("tFb").innerHTML=`<div class="fb ${k}"><span class="tag">${tag}</span>${h}</div>`; render($("tFb")); };
    const win=()=>{ tDone=true; st.learned[t.id]=true; save(); road(); $("tAns").disabled=true; $("tChk").disabled=true; $("tHint").disabled=true; showNext(); };
    const go=()=>{ if(tDone) return; const v=$("tAns").value.trim(); if(!v) return; const r=check(TP,v);
      if(r===null){ fbx("hint","Try again","I couldn't read that. "+HOW[TP.type]); return; }
      if(r){ fbx("good","Correct — you've got it!",`$${TP.ansTex}$`); win(); return; }
      tTries++; if(tTries<2) fbx("bad","Not yet",TP.hint+" Try again."); else { fbx("hint","Answer",`$${TP.ansTex}$. Try another one to make sure.`); const a=document.createElement("button"); a.className="btn ghost sm"; a.textContent="Try another"; a.onclick=()=>{ TP=t.gen[0](); tTries=0; drawLesson(); }; $("tFb").appendChild(a); } };
    $("tChk").onclick=go; $("tAns").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } }); $("tHint").onclick=()=>fbx("hint","Hint",TP.hint);
    if(st.learned[t.id]) showNext();
  }
  render(box);
}
function showNext(){ const r=$("tNext"); if(!r) return; r.innerHTML=""; const t=CH.topics[LI];
  const pr=document.createElement("button"); pr.className="btn ghost sm"; pr.textContent="Practice this topic"; pr.onclick=()=>{ setTab("practice"); startPractice(t,st.level[t.id]||st.rec||1); }; r.appendChild(pr);
  const n=document.createElement("button"); n.className="btn teal sm";
  if(LI<CH.topics.length-1){ n.textContent="Next lesson →"; n.onclick=()=>openLesson(LI+1,true); } else { n.textContent="Start practicing →"; n.onclick=()=>{ setTab("practice"); window.scrollTo({top:0,behavior:"smooth"}); }; }
  r.appendChild(n); }
function setTab(t){ $("learnView").hidden=t!=="learn"; $("practiceView").hidden=t!=="practice"; $("tabLearn").classList.toggle("on",t==="learn"); $("tabPractice").classList.toggle("on",t==="practice"); try{ history.replaceState(null,"","#"+CH.id+"-"+t); }catch(e){} }
function openChapter(id,tab){
  useChapter(id); $("chTitle").textContent="Chapter "+(CHAPTERS.indexOf(CH)+1)+": "+CH.title; $("practice").hidden=true;
  chapters(); recText(); topics(); const first=CH.topics.findIndex(t=>!st.learned[t.id]); openLesson(first<0?0:first);
  setTab(tab||(first<0?"practice":"learn")); }
$("tabLearn").onclick=()=>setTab("learn"); $("tabPractice").onclick=()=>setTab("practice");
window.addEventListener("load",()=>{ legend(); const m=/^#(ch\d+)(?:-(learn|practice))?$/.exec(location.hash); openChapter(m?m[1]:ST.cur,m?m[2]:null); });
</script>
