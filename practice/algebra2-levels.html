<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --ink:#16233B; --muted:#5B6474; --faint:#8C93A0; --line:#E8E2D8;
  --navy:#1F3A68; --teal:#0F7C7C; --teal-soft:#DDF0EE; --gold:#C9962B; --gold-soft:#FBF1DC; --red:#B3261E; --red-soft:#FBE7E5; --green:#1E7A45; --green-soft:#DDF4E6;
  --l1:#2E8B57; --l2:#0F7C7C; --l3:#1F3A68; --l4:#B7472A; --l5:#6A4BD8;
  --radius:18px; --shadow:0 8px 26px rgba(22,35,59,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
header.top .in{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:24px}
.brand{font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--teal)}
.back{margin-left:auto;font-size:15px;text-decoration:none;color:var(--muted);font-weight:500}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 48px;display:flex;flex-direction:column;gap:20px}
.intro h1{font-size:clamp(28px,4vw,40px)}
.intro p{color:var(--muted);margin:6px 0 0;max-width:680px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;font-weight:600;border:1px solid transparent;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
.btn.teal{background:var(--teal)} .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus{outline:2px solid var(--teal);outline-offset:1px}
/* level legend */
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lg{border-radius:12px;padding:10px 12px;background:var(--bg);border-left:4px solid var(--c)}
.lg b{display:block;font-size:14px;color:var(--c)} .lg span{font-size:13px;color:var(--muted)}
/* placement */
.place{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--teal-soft),#fff 70%);border:1.5px solid var(--teal)}
.place .t b{font-family:Fraunces,Georgia,serif;font-size:20px;display:block}
.place .t span{color:var(--muted);font-size:15px}
.rec{font-weight:600;color:var(--teal)}
/* topics */
.topics{display:block}
.psec{display:flex;flex-direction:column;gap:8px}.psec h2{font-size:22px;margin:0 0 4px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.prow.on{border-color:var(--teal);background:var(--teal-soft)}
.prow .pt{flex:1;font-weight:600}.prow small{color:var(--green);font-size:13px;font-weight:600}
@media (max-width:760px){.topics{grid-template-columns:minmax(0,1fr)}}
.topic{display:flex;flex-direction:column;gap:12px}
.topic h2{font-size:22px}
.idea{color:var(--muted);font-size:15px;margin:0}
.example{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;overflow-x:auto}
.example .q{font-size:17px;margin-bottom:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--c)}
.pill.on{background:var(--c);border-color:var(--c);color:#fff}
.pill .n{font-weight:500;opacity:.75;margin-left:4px}
.pill.star::after{content:"★";position:absolute;top:-8px;right:-4px;font-size:12px;color:var(--gold)}
/* practice */
.practice{display:flex;flex-direction:column;gap:14px;scroll-margin-top:80px}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.phead h2{font-size:24px}
.problem{font-size:clamp(19px,2.6vw,24px);padding:16px 18px;border-radius:14px;background:var(--bg);overflow-x:auto;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap} .row[hidden],.problem[hidden]{display:none}
.row input{flex:1 1 240px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--bg)}
.preview{font-size:18px;min-height:1.4em}
.preview .pl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin-right:8px}
.howto{font-size:13px;color:var(--faint)}
.fb{border-radius:12px;padding:10px 14px;font-size:15px;overflow-x:auto}
.fb.good{background:var(--green-soft)} .fb.bad{background:var(--red-soft)} .fb.hint{background:var(--gold-soft)}
.fb .tag{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.fb.good .tag{color:var(--green)} .fb.bad .tag{color:var(--red)} .fb.hint .tag{color:var(--gold)}
.sol{margin:6px 0 0;padding-left:20px} .sol li{margin:2px 0}
.suggest{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1.5px dashed var(--c);border-radius:12px;padding:10px 14px}
.streak{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--faint)}
.streak i{width:10px;height:10px;border-radius:50%;background:var(--line)} .streak i.ok{background:var(--green)} .streak i.no{background:var(--red)}
.streak i.todo{background:transparent;border:1.5px solid var(--line)} .streak span{margin-right:6px;font-weight:600;color:var(--ink)}
.rres{border:1.5px solid var(--teal);border-radius:14px;padding:16px 18px;background:var(--teal-soft)}
.rres .rsc{display:flex;align-items:baseline;gap:10px} .rres .rsc b{font-family:Fraunces,Georgia,serif;font-size:34px} .rres .rsc span{color:var(--muted)}
.rres p{margin:6px 0 12px} .racts{display:flex;flex-wrap:wrap;gap:10px;align-items:center} .rdone{font-weight:600}
.rres .suggest{margin-top:12px}
.cs-card h3 .cs-part{display:block;font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
/* modal quiz */
.modal{position:fixed;inset:0;background:rgba(22,35,59,.45);display:grid;place-items:center;padding:16px;z-index:60}
.modal .card{width:min(620px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.qprog{display:flex;gap:6px} .qprog i{flex:1;height:6px;border-radius:3px;background:var(--line)} .qprog i.ok{background:var(--green)} .qprog i.no{background:var(--red)} .qprog i.now{background:var(--teal)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:none;background:none;padding:10px 16px;font-weight:600;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.learn,.pview{display:flex;flex-direction:column;gap:20px}
.road{display:flex;gap:8px;flex-wrap:wrap}
.stop{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.stop i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px;border:1.5px solid var(--line)}
.stop.done i{background:var(--green);border-color:var(--green);color:#fff}
.stop.on{border-color:var(--teal);background:var(--teal-soft)}
.lesson{display:flex;flex-direction:column;gap:16px;scroll-margin-top:80px}
.lesson h2{font-size:clamp(24px,3vw,30px)}
.big{font-size:18px;background:var(--teal-soft);border-radius:14px;padding:14px 16px;overflow-x:auto}
.big b{color:var(--teal)}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;counter-reset:k}
.steps li{counter-increment:k;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;background:var(--bg);border-radius:12px;padding:10px 12px;animation:pop .25s ease}
.steps li::before{content:counter(k);width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps .m{font-size:19px;overflow-x:auto;overflow-y:hidden;padding:3px 0 4px} .steps .w{font-size:14px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.steps li{animation:none}}
.warn{background:var(--red-soft);border-radius:14px;padding:12px 16px;font-size:15px;overflow-x:auto}
.warn b{color:var(--red)}
.turn{border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.turn .q{font-size:19px;overflow-x:auto}
.lnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
footer{text-align:center;color:var(--faint);font-size:13px;padding:24px}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chap{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chap i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px}
.chap.on{background:var(--navy);border-color:var(--navy);color:#fff} .chap.on i{background:rgba(255,255,255,.2)}
.chap.soon{opacity:.45;cursor:default}
.fig{display:block;width:100%;max-width:360px;height:auto;margin:4px 0 8px}
.problem .fig{max-width:340px}
.mc{display:grid;gap:6px;margin-top:10px;font-size:.92em}
.mc div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mc div{cursor:pointer} .mc div:hover{border-color:var(--teal)} .mc div.sel{border-color:var(--teal);background:var(--teal-soft)}

/* ---- left sidebar for chapters (wide screens) ---- */
.lv-main{display:contents}
.lv-main>.intro{order:-1}
@media (min-width:720px){
  .wrap{max-width:1320px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start;padding-left:14px;padding-right:14px}
  .lv-main{display:flex;flex-direction:column;gap:20px;min-width:0}
  .wrap>.chapters{position:sticky;top:16px;flex-direction:column;flex-wrap:nowrap;gap:2px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
  .wrap>.chapters::before{content:attr(aria-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:4px 8px 8px}
  .wrap>.chapters .chap{border:0;border-radius:10px;background:transparent;padding:8px 8px;font-size:14px;line-height:1.3;text-align:left;width:100%;align-items:flex-start}
  .wrap>.chapters .chap i{flex:0 0 auto;min-width:24px;width:auto;padding:0 5px;height:24px;border-radius:12px}
  .wrap>.chapters .chap:hover{background:var(--bg)}
  .wrap>.chapters .chap.on{background:var(--navy);color:#fff}
  .secs{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 18px;padding-left:10px;border-left:2px solid var(--line)}
  .sec{display:flex;gap:7px;align-items:flex-start;border:0;background:transparent;text-align:left;font:inherit;font-size:13px;line-height:1.3;color:var(--muted,#555);padding:6px 8px;border-radius:8px;cursor:pointer}
  .sec b{font-weight:700;color:var(--faint);min-width:24px;font-size:12px;padding-top:1px}
  .sec:hover{background:var(--bg)}
  .sec.on{background:var(--teal-soft);color:var(--ink);font-weight:600}
  .sec.on b{color:var(--teal)}
  .sec.done b{color:var(--green)}
  .road .stop.other{display:none}
  .road.single{display:none}
}
@media (max-width:719.98px){ .secs{display:none} }
@media (min-width:1050px){ .wrap{grid-template-columns:260px minmax(0,1fr);gap:28px;padding-left:20px;padding-right:20px} }

/* ---- compact level bar: one level for the whole chapter ---- */
.lvbar{display:flex;flex-direction:column;gap:10px;padding:14px 18px}
.lvtop{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.lvtop>.label{margin:0}
.lvchips{display:flex;flex-wrap:wrap;gap:6px}
.lvc{position:relative;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.2}
.lvc i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--bg);color:var(--c)}
.lvc:hover{border-color:var(--c)}
.lvc.on{background:var(--c);border-color:var(--c);color:#fff}
.lvc.on i{background:rgba(255,255,255,.25);color:#fff}
.lvc.star::after{content:"★";position:absolute;top:-7px;right:-3px;font-size:11px;color:var(--gold)}
.lvsub{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;font-size:14px;color:var(--muted)}
.lvsub b{color:var(--ink)}
.lvsub .lvplace{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#pLevels{display:none}
.topic .tgo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topic .tgo small{color:var(--muted);font-size:13px}
.watch{margin:-4px 0 4px;font-size:14px;color:var(--muted)} .watch b{color:var(--ink)}
.rootbox{background:#FFF8EA;border:1px solid var(--gold,#C9962B);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.6;margin:2px 0 6px}

/* ---- hide the topic cards while a practice problem is open ---- */
#practice:not([hidden]) ~ #topics{display:none}
/* ---- chapter cheat sheet ---- */
.tabs .cs-btn{margin-left:auto;align-self:center;border:1.5px solid var(--gold,#C9962B);background:#FFF8EA;color:#8A6415;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:6px}
.tabs .cs-btn:hover{background:#FBF0D9}
.csm{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow-y:auto}
.cs-sheet{background:#fff;border-radius:16px;max-width:980px;width:100%;padding:22px 26px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.cs-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.cs-top h2{font-family:Fraunces,Georgia,serif;font-size:24px;margin:0;color:var(--navy)}
.cs-top .sub{font-size:13px;color:var(--muted)}
.cs-top .cs-acts{display:flex;gap:8px}
.cs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.cs-grid{grid-template-columns:1fr}}
.cs-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;break-inside:avoid;page-break-inside:avoid}
.cs-card h3{margin:0 0 6px;font-size:16px;color:var(--navy);font-family:Fraunces,Georgia,serif}
.cs-card .cs-idea{font-size:14px;line-height:1.55;margin-bottom:8px}
.cs-card .cs-ex{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px}
.cs-card .cs-ex .lab,.cs-card .cs-warn .lab{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:2px}
.cs-card .cs-ex div{margin:2px 0;overflow-x:auto}
.cs-card .cs-warn{margin-top:8px;font-size:13px;line-height:1.5;border-left:3px solid var(--red,#C0392B);padding:2px 0 2px 8px}
.cs-card .cs-warn .lab{color:var(--red,#C0392B)}
.cs-foot{margin-top:12px;font-size:12px;color:var(--faint);text-align:right}
@media print{
  body.cs-printing > *:not(.csm){display:none !important}
  body.cs-printing .csm{position:static;background:none;padding:0;overflow:visible}
  body.cs-printing .cs-sheet{box-shadow:none;border-radius:0;padding:0;max-width:none}
  body.cs-printing .cs-acts{display:none}
  body.cs-printing .cs-card .cs-ex{background:#f4f4f4}
  @page{margin:12mm}
}
</style>
</head>

<script>
"use strict";
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let x;do{x=rnd(a,b)}while(x===0);return x};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const sg=k=>k>=0?"+ "+k:"- "+(-k);            // "+ 3" / "- 3"

function setLevel(n){ st.lvl=n; save(); if(T&&!$("practice").hidden){ L=n; streak=[]; newRound(); newProblem(); } legend(); topics(); }
function recText(){ $("recText").innerHTML=st.rec?`★ Suggested: Level ${st.rec}`:"Not sure?"; $("placeBtn").textContent=st.rec?"Retake the check":"Take the 5-question check"; }
function pillsFor(t,cur,onPick){ const w=document.createElement("div"); w.className="pills";
  LEVELS.forEach(l=>{ const b=document.createElement("button"); b.type="button"; b.className="pill"+(l.n===cur?" on":"")+(st.rec===l.n?" star":""); b.style.setProperty("--c",l.c); const n=st.solved[t.id+l.n]||0; b.innerHTML=`${l.n} ${l.name}`+(n?`<span class="n">✓${n}</span>`:""); b.onclick=()=>onPick(l.n); w.appendChild(b); }); return w; }
function topics(){ const box=$("topics"); box.innerHTML=""; legend(); const lvl=curLv();
  /* practice = only the section that is open (pick another section in the list on the left) */
  const SG=sections(), G=SG.find(g=>g.idx.includes(LI))||SG[0];
  const c=document.createElement("div"); c.className="card psec";
  c.innerHTML=`<span class="label">Practice · Level ${lvl} ${LEVELS[lvl-1].name}</span>`;
  G.idx.map(i=>CH.topics[i]).forEach(t=>{ const n=st.solved[t.id+lvl]||0, on=T===t&&!$("practice").hidden;
    const r=document.createElement("div"); r.className="prow"+(on?" on":"");
    r.innerHTML=`<span class="pt">${G.idx.length>1?tlab(t).part:"5 levels · new problems every time"}</span><small>${n?`✓ ${n} solved`:""}</small>`;
    const go=document.createElement("button"); go.className="btn teal sm"; go.textContent=on?"Practicing ↓":"Practice →"; go.onclick=()=>startPractice(t,lvl); r.appendChild(go); c.appendChild(r); });
  box.appendChild(c); render(box); }
function startPractice(t,n){ n=curLv(); T=t; L=n; st.level[t.id]=n; save(); streak=[]; newRound(); $("practice").hidden=false; $("pTitle").textContent=tlab(t).full; newProblem(); $("practice").scrollIntoView({behavior:"smooth",block:"start"}); topics(); }
function levelPills(){ $("pLevels").replaceWith(Object.assign(pillsFor(T,L,n=>{ L=n; st.level[T.id]=n; save(); streak=[]; newRound(); newProblem(); topics(); }),{id:"pLevels"})); }
function newProblem(){
  PR=T.gen[L-1](); tries=0; done=false; firstTry=true;
  $("pQ").innerHTML=`<span class="label" style="color:${LEVELS[L-1].c}">Level ${L} · ${LEVELS[L-1].name}</span><div>${PR.q}</div>`; render($("pQ"));
  $("pAns").value=""; $("pAns").disabled=false; $("pPrev").textContent=""; $("pHow").textContent=PR.type==="word"&&PR.opts?"Type one of: "+PR.opts.map(o=>o==="NONE"?"none":o.length>3?o.toLowerCase():o).join(", ")+".":PR.form==="factored"?"Type the factored form, like 2(x - 3)(x + 4).":PR.form==="poly"?"Type the simplified polynomial, like 3x^2 - 5x + 2.":PR.form==="simp"?"Type the simplified expression with positive exponents, like 6x^5 or 3x^2/y^4.":PR.form==="rad"?"Type the simplest radical form, like 5sqrt(2).":PR.form==="si"?"Type it as y = mx + b, like y = -2x + 5.":PR.form==="std"?"Type it as Ax + By = C with whole numbers, like 3x - 2y = 6.":HOW[PR.type]; $("pFb").innerHTML=""; $("pSuggest").innerHTML="";
  $("pQ").hidden=false; $("pAns").closest(".row").hidden=false; $("pCheck").hidden=false; $("pNext").hidden=true; $("pHint").disabled=false; $("pShow").hidden=true; $("pAns").disabled=false; levelPills(); drawStreak(); $("pAns").focus({preventScroll:true}); }
function fb(kind,tag,html){ $("pFb").innerHTML=`<div class="fb ${kind}"><span class="tag">${tag}</span>${html}</div>`; render($("pFb")); }
const solHtml=()=>`<ol class="sol">${PR.sol.map(s=>`<li>${s}</li>`).join("")}</ol>`;
function finish(correct){ done=true; $("pAns").disabled=true; $("pCheck").hidden=true; $("pNext").hidden=false; $("pShow").hidden=true; $("pHint").disabled=true;
  if(correct){ st.solved[T.id+L]=(st.solved[T.id+L]||0)+1; save(); }
  streak.push(correct&&firstTry); if(streak.length>6) streak.shift();
  RND.n++; if(correct) RND.right++; if(correct&&firstTry) RND.first++; drawStreak(); levelPills();
  $("pNext").textContent=RND.n>=RLEN?"See my result →":"Next problem →"; $("pNext").focus({preventScroll:true}); }
function submit(){ if(done||!PR) return; const v=$("pAns").value.trim(); if(!v) return; const r=check(PR,v);
  if(r===null){ fb("hint","Try again","I couldn't read that. "+HOW[PR.type]); return; }
  if(r){ fb("good","Correct"+(firstTry?" on the first try!":""),`$${PR.ansTex}$`+solHtml()); finish(true); return; }
  tries++; firstTry=false;
  if(tries===1){ fb("bad","Not yet",PR.hint+" Try again."); $("pShow").hidden=false; }
  else { fb("bad","Not yet","Here's how it works:"+solHtml()); finish(false); } }
/* ---- a round = 5 problems; then the student chooses: redo, or move to the next section ---- */
const RLEN=5; let RND={n:0,right:0,first:0};
function newRound(){ RND={n:0,right:0,first:0}; $("pSuggest").innerHTML=""; }
function drawStreak(){ const s=$("pStreak"); s.innerHTML=`<span>Problem ${Math.min(RND.n+(done?0:1),RLEN)} of ${RLEN}</span> `; (RND.n?streak.slice(-RND.n):[]).forEach(x=>{ const i=document.createElement("i"); i.className=x?"ok":"no"; s.appendChild(i); }); for(let k=RND.n;k<RLEN;k++){ const i=document.createElement("i"); i.className="todo"; s.appendChild(i); } }
function nextAfter(t){ const SG=sections(), i=CH.topics.indexOf(t), G=SG.find(g=>g.idx.includes(i)), k=G.idx.indexOf(i);
  if(k<G.idx.length-1) return {t:CH.topics[G.idx[k+1]], label:`Next: ${tlab(CH.topics[G.idx[k+1]]).part}`};
  const H=SG[SG.indexOf(G)+1]; return H?{t:CH.topics[H.idx[0]], label:`Move to ${H.no} ${H.name}`}:null; }
function roundResult(){
  const secKey="r_"+T.id+"_"+L, best=Math.max(st[secKey]||0,RND.right); st[secKey]=best; save();
  $("pQ").hidden=true; $("pAns").closest(".row").hidden=true; $("pAns").disabled=true; $("pNext").hidden=true; $("pCheck").hidden=true; $("pHint").disabled=true; $("pShow").hidden=true; $("pPrev").textContent=""; $("pHow").textContent="";
  const perfect=RND.first===RLEN, weak=RND.right<=2, nx=nextAfter(T);
  const msg=perfect?`All ${RLEN} right on the first try — excellent!`:RND.right===RLEN?`All ${RLEN} right!`:RND.right>=3?`Good work — ${RND.right} out of ${RLEN}.`:`${RND.right} out of ${RLEN}. Look at the example in <b>Learn</b> once more, then redo it.`;
  $("pFb").innerHTML=`<div class="rres"><div class="rsc"><b>${RND.right} / ${RLEN}</b><span>correct · ${RND.first} on the first try</span></div><p>${msg}</p><div class="racts"></div></div>`;
  const A=$("pFb").querySelector(".racts");
  const redo=document.createElement("button"); redo.className="btn ghost"; redo.textContent="↻ Redo it"; redo.onclick=()=>{ $("pFb").innerHTML=""; newRound(); newProblem(); }; A.appendChild(redo);
  if(weak){ const lb=document.createElement("button"); lb.className="btn ghost"; lb.textContent="📘 Back to Learn"; lb.onclick=()=>{ setTab("learn"); openLesson(CH.topics.indexOf(T),true); }; A.appendChild(lb); }
  if(nx){ const nb=document.createElement("button"); nb.className="btn teal"; nb.textContent=nx.label+" →"; nb.onclick=()=>{ $("pFb").innerHTML=""; LI=CH.topics.indexOf(nx.t); road(); startPractice(nx.t); }; A.appendChild(nb); }
  else { const d=document.createElement("span"); d.className="rdone"; d.textContent="🎉 Last section of this chapter done!"; A.appendChild(d); }
  if(perfect&&L<5){ const d=document.createElement("div"); d.className="suggest"; d.style.setProperty("--c",LEVELS[L].c); d.innerHTML=`<span>Ready for <b>Level ${L+1} · ${LEVELS[L].name}</b>?</span>`; const b=document.createElement("button"); b.className="btn sm"; b.style.background=LEVELS[L].c; b.textContent="Move up ↑"; b.onclick=()=>{ $("pFb").innerHTML=""; setLevel(L+1); }; d.appendChild(b); $("pFb").querySelector(".rres").appendChild(d); }
  $("pStreak").innerHTML=""; render($("pFb")); topics(); }
function suggest(){ const box=$("pSuggest"); box.innerHTML=""; const last=streak.slice(-3),last2=streak.slice(-2); let to=null,msg="";
  if(L<5&&last.length===3&&last.every(Boolean)){ to=L+1; msg=`3 in a row on the first try! Ready for <b>Level ${L+1} · ${LEVELS[L].name}</b>?`; }
  else if(L>1&&last2.length===2&&last2.every(x=>!x)){ to=L-1; msg=`These are tough — that's okay! Practice <b>Level ${L-1} · ${LEVELS[L-2].name}</b> first, then come back stronger.`; }
  if(!to) return; const d=document.createElement("div"); d.className="suggest"; d.style.setProperty("--c",LEVELS[to-1].c); d.innerHTML=`<span>${msg}</span>`;
  const b=document.createElement("button"); b.className="btn sm"; b.style.background=LEVELS[to-1].c; b.textContent=to>L?"Move up ↑":"Go to Level "+to; b.onclick=()=>{ setLevel(to); }; d.appendChild(b); box.appendChild(d); }
$("pCheck").onclick=submit; $("pAns").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); done?$("pNext").onclick():submit(); } });

/* ---- chapter cheat sheet ---- */
function cheatSheet(){
  const old=document.querySelector(".csm"); if(old) old.remove();
  const page=(document.querySelector(".intro .label")||{}).textContent||"";
  const course=page.split("·")[0].trim();
  const m=document.createElement("div"); m.className="csm";
  m.innerHTML=`<div class="cs-sheet"><div class="cs-top"><div><h2>${$("chTitle").textContent}</h2><span class="sub">${course} · Cheat Sheet · Prof. Fang Math</span></div><div class="cs-acts"><button class="btn teal sm" id="csPrint">🖨 Print / Save PDF</button><button class="btn ghost sm" id="csClose">Close</button></div></div>
    <div class="cs-grid">${CH.topics.map(t=>`<div class="cs-card"><h3>${!tlab(t).multi?t.title:tlab(t).first?`${tlab(t).sec}<small class="cs-part">${tlab(t).part}</small>`:tlab(t).part}</h3><div class="cs-idea">${t.idea}</div>${t.lesson&&t.lesson.steps&&t.lesson.steps.length?`<div class="cs-ex"><span class="lab">Example</span>${t.lesson.steps.map(s=>`<div>$${s[0]}$</div>`).join("")}</div>`:""}${t.lesson&&t.lesson.warn?`<div class="cs-warn"><span class="lab">Watch out</span>${t.lesson.warn}</div>`:""}</div>`).join("")}</div>
    <div class="cs-foot">fangmath.com</div></div>`;
  document.body.appendChild(m); render(m);
  const close=()=>{ m.remove(); document.body.classList.remove("cs-printing"); };
  m.querySelector("#csClose").onclick=close; m.onclick=e=>{ if(e.target===m) close(); };
  m.querySelector("#csPrint").onclick=()=>{ document.body.classList.add("cs-printing"); window.print(); setTimeout(()=>document.body.classList.remove("cs-printing"),500); };
  document.addEventListener("keydown",function esc(e){ if(e.key==="Escape"){ close(); document.removeEventListener("keydown",esc); } });
}
$("csBtn").onclick=cheatSheet;
$("pNext").onclick=()=>{ if(RND.n>=RLEN) roundResult(); else newProblem(); }; $("closeP").onclick=()=>{ $("practice").hidden=true; };
$("pHint").onclick=()=>{ if(done) return; firstTry=false; fb("hint","Hint",PR.hint); };
$("pShow").onclick=()=>{ fb("hint","Solution",`$${PR.ansTex}$`+solHtml()); finish(false); };
$("pAns").addEventListener("input",()=>{ const v=$("pAns").value.trim(),pv=$("pPrev"); if(!v||!window.katex){ pv.textContent=""; return; }
  try{ let tex; const c=clean(v);
    if(/<|>/.test(c)) tex=c.replace(/<=/g,"\\le ").replace(/>=/g,"\\ge ").replace(/\bor\b/gi,"\\text{ or }").replace(/\band\b/gi,"\\text{ and }");
    else tex=c.split("=").map(x=>math.parse(x).toTex({parenthesis:"auto",implicit:"hide"})).join(" = ");
    pv.innerHTML='<span class="pl">You wrote</span><span class="pm"></span>'; katex.render(tex,pv.querySelector(".pm"),{throwOnError:false}); }catch(e){ pv.textContent=""; } });

/* ---- placement ---- */
$("placeBtn").onclick=()=>{
  const PL=[0,1,2,0,1].map((ti,k)=>[CH.topics[ti%CH.topics.length],k+1]); let i=0,res=[],pr;
  const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<div class="card"><div class="phead"><h2>Where should I start?</h2><button class="btn ghost sm" id="qx">Close</button></div><div class="qprog" id="qp"></div><div class="problem" id="qq"></div><div class="row" id="qr"><input id="qa" type="text" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><button class="btn" id="qc">Check</button><button class="btn ghost" id="qs">I don't know</button></div><div class="howto" id="qh"></div><div id="qf"></div></div>`;
  document.body.appendChild(m); const q=id=>m.querySelector("#"+id);
  const prog=()=>{ q("qp").innerHTML=PL.map((_,k)=>`<i class="${k<res.length?(res[k]?"ok":"no"):k===i?"now":""}"></i>`).join(""); };
  const ask=()=>{ const [t,lv]=PL[i]; pr=t.gen[lv-1](); q("qq").innerHTML=`<span class="label">Question ${i+1} of 5 · Level ${lv}</span><div>${pr.q}</div>`; render(q("qq")); q("qa").value=""; q("qh").textContent=HOW[pr.type]; q("qf").innerHTML=""; prog(); q("qa").focus(); };
  const end=()=>{ const lvl=res.indexOf(false)===-1?5:res.indexOf(false)+1; st.rec=lvl; st.lvl=lvl; save(); recText(); topics(); prog();
    q("qq").innerHTML=`<span class="label">Result</span><div>Start at <b style="color:${LEVELS[lvl-1].c}">Level ${lvl} · ${LEVELS[lvl-1].name}</b>.</div><div style="font-size:15px;color:var(--muted)">${lvl===5?"You answered every question correctly — go for Competition!":lvl===1?"Foundation builds the base everything else needs. Move up whenever you get 3 in a row.":"You got the first "+(lvl-1)+" level"+(lvl===2?"":"s")+" right. Level "+lvl+" is the right challenge for you."}</div>`;
    q("qr").hidden=true; q("qh").textContent=""; q("qf").innerHTML=""; const b=document.createElement("button"); b.className="btn teal"; b.textContent="See the topics"; b.onclick=()=>m.remove(); q("qf").appendChild(b); };
  const answer=r=>{ res.push(r); if(!r){ end(); return; } i++; i>=PL.length?end():ask(); };
  q("qc").onclick=()=>{ const v=q("qa").value.trim(); if(!v) return; const r=check(pr,v); if(r===null){ q("qf").innerHTML=`<div class="fb hint">I couldn't read that. ${HOW[pr.type]}</div>`; return; } answer(r); };
  q("qa").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); q("qc").click(); } });
  q("qs").onclick=()=>answer(false); q("qx").onclick=()=>m.remove(); m.addEventListener("click",e=>{ if(e.target===m) m.remove(); });
  ask(); };

/* ---- learn ---- */
let LI=0, shown=1, TP=null, tDone=false, tTries=0;
function road(){ const r=$("road"); r.innerHTML=""; const G=sections().find(g=>g.idx.includes(LI)); r.classList.toggle("single",!G||G.idx.length<2); secList(); CH.topics.forEach((t,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="stop"+(st.learned[t.id]?" done":"")+(i===LI?" on":"")+(G&&!G.idx.includes(i)?" other":""); const sm=/^(\d+\.\d+) (.*)$/.exec(t.title); const tl=tlab(t); b.innerHTML=`<i>${st.learned[t.id]?"✓":tl.multi&&G&&G.idx.includes(i)?tl.k:sm?sm[1]:i+1}</i>${sm?sm[2]:t.title}`; b.onclick=()=>openLesson(i); r.appendChild(b); }); }
function openLesson(i,scroll){ LI=i; shown=1; tDone=false; tTries=0; TP=null; road(); if($("topics")&&st){ const G=sections().find(g=>g.idx.includes(i)); if(T&&G&&!G.idx.includes(CH.topics.indexOf(T))) $("practice").hidden=true; topics(); } if(window.drawStory) drawStory(CH.id,CH.topics[i]); drawLesson(); if(scroll) ($("story")||$("lesson")).scrollIntoView({behavior:"smooth",block:"start"}); }
function drawLesson(){
  const t=CH.topics[LI], l=t.lesson, box=$("lesson");
  const inl=false;
  box.innerHTML=`<span class="label">${inl?`Part 2 of 2 · Name it with symbols`:tlab(t).multi?`${tlab(t).sec} · Part ${tlab(t).k} of ${tlab(t).n}`:`Lesson ${LI+1} of ${CH.topics.length}`}</span><h2>${inl?`Line, ray, segment or length?`:tlab(t).multi?tlab(t).part:t.title}</h2><div class="big">${t.idea}</div>${l.fig||""}<span class="label">👀 Watch me — simplest example</span><p class="watch">I'll solve it one step at a time. Read each step and think about <b>why</b>. When it makes sense, press <b>Got it — next step</b>.</p><ol class="steps">${l.steps.slice(0,shown).map(s=>`<li><div><div class="m">$${s[0]}$</div><div class="w">${s[1]}</div></div></li>`).join("")}</ol>`;
  if(shown<l.steps.length){ const b=document.createElement("button"); b.className="btn"; b.style.alignSelf="flex-start"; b.textContent="Got it — next step →"; b.onclick=()=>{ shown++; drawLesson(); }; box.appendChild(b);
    const s=document.createElement("button"); s.className="btn ghost sm"; s.style.alignSelf="flex-start"; s.textContent="Show all steps at once"; s.onclick=()=>{ shown=l.steps.length; drawLesson(); }; box.appendChild(s); }
  else {
    box.insertAdjacentHTML("beforeend",`<div class="warn"><b>Watch out: </b>${l.warn}</div>`);
    if(!TP) TP=t.gen[0]();
    const w=document.createElement("div"); w.className="turn";
    w.innerHTML=`<span class="label" style="color:var(--gold)">Your turn</span><div class="q">${TP.q}</div><div class="row"><input type="text" id="tAns" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><button class="btn" id="tChk">Check</button><button class="btn ghost" id="tHint">Hint</button></div><div class="howto">${HOW[TP.type]}</div><div id="tFb"></div>`;
    box.appendChild(w);
    const nav=document.createElement("div"); nav.className="lnav"; const left=document.createElement("div"); left.className="row";
    if(LI>0){ const pv=document.createElement("button"); pv.className="btn ghost sm"; pv.textContent="← Previous lesson"; pv.onclick=()=>openLesson(LI-1,true); left.appendChild(pv); }
    const right=document.createElement("div"); right.className="row"; right.id="tNext"; nav.append(left,right); box.appendChild(nav);
    const fbx=(k,tag,h)=>{ $("tFb").innerHTML=`<div class="fb ${k}"><span class="tag">${tag}</span>${h}</div>`; render($("tFb")); };
    const win=()=>{ tDone=true; st.learned[t.id]=true; save(); road(); $("tAns").disabled=true; $("tChk").disabled=true; $("tHint").disabled=true; showNext(); };
    const go=()=>{ if(tDone) return; const v=$("tAns").value.trim(); if(!v) return; const r=check(TP,v);
      if(r===null){ fbx("hint","Try again","I couldn't read that. "+HOW[TP.type]); return; }
      if(r){ fbx("good","Correct — you've got it!",`$${TP.ansTex}$`); win(); return; }
      tTries++; if(tTries<2) fbx("bad","Not yet",TP.hint+" Try again."); else { fbx("hint","Answer",`$${TP.ansTex}$. Try another one to make sure.`); const a=document.createElement("button"); a.className="btn ghost sm"; a.textContent="Try another"; a.onclick=()=>{ TP=t.gen[0](); tTries=0; drawLesson(); }; $("tFb").appendChild(a); } };
    $("tChk").onclick=go; $("tAns").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } }); $("tHint").onclick=()=>fbx("hint","Hint",TP.hint);
    if(st.learned[t.id]) showNext();
  }
  render(box);
}
function showNext(){ const r=$("tNext"); if(!r) return; r.innerHTML=""; const t=CH.topics[LI];
  const pr=document.createElement("button"); pr.className="btn ghost sm"; pr.textContent="Practice this topic"; pr.onclick=()=>{ setTab("practice"); startPractice(t,st.level[t.id]||st.rec||1); }; r.appendChild(pr);
  const n=document.createElement("button"); n.className="btn teal sm";
  if(LI<CH.topics.length-1){ n.textContent="Next lesson →"; n.onclick=()=>openLesson(LI+1,true); } else { n.textContent="Start practicing →"; n.onclick=()=>{ setTab("practice"); window.scrollTo({top:0,behavior:"smooth"}); }; }
  r.appendChild(n); }
function setTab(t){ $("learnView").hidden=t!=="learn"; $("practiceView").hidden=t!=="practice"; $("tabLearn").classList.toggle("on",t==="learn"); $("tabPractice").classList.toggle("on",t==="practice"); try{ history.replaceState(null,"","#"+CH.id+"-"+t); }catch(e){} }
function openChapter(id,tab){
  useChapter(id); $("chTitle").textContent="Chapter "+ALLCH.find(c=>c[2]===CH.id)[0]+": "+CH.title; $("practice").hidden=true;
  chapters(); recText(); topics(); const first=CH.topics.findIndex(t=>!st.learned[t.id]); openLesson(first<0?0:first);
  setTab(tab||(first<0?"practice":"learn")); }
document.addEventListener("click",e=>{ const d=e.target.closest(".mc > div"); if(!d) return; const card=d.closest(".practice, .turn, .modal .card"); const inp=card&&card.querySelector("input[type=text]"); if(inp&&!inp.disabled){ inp.value=d.querySelector("b").textContent.trim()[0]; inp.focus(); d.parentElement.querySelectorAll("div").forEach(x=>x.classList.toggle("sel",x===d)); } });
$("tabLearn").onclick=()=>setTab("learn"); $("tabPractice").onclick=()=>setTab("practice");
window.addEventListener("load",()=>{ legend(); const m=/^#(ch\d+)(?:-(learn|practice))?$/.exec(location.hash); openChapter(m?m[1]:ST.cur,m?m[2]:null); });
