<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --ink:#16233B; --muted:#5B6474; --faint:#8C93A0; --line:#E8E2D8;
  --navy:#1F3A68; --teal:#0F7C7C; --teal-soft:#DDF0EE; --gold:#C9962B; --gold-soft:#FBF1DC; --red:#B3261E; --red-soft:#FBE7E5; --green:#1E7A45; --green-soft:#DDF4E6;
  --l1:#2E8B57; --l2:#0F7C7C; --l3:#1F3A68; --l4:#B7472A; --l5:#6A4BD8;
  --radius:18px; --shadow:0 8px 26px rgba(22,35,59,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
header.top .in{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:24px}
.brand{font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--teal)}
.back{margin-left:auto;font-size:15px;text-decoration:none;color:var(--muted);font-weight:500}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 48px;display:flex;flex-direction:column;gap:20px}
.intro h1{font-size:clamp(28px,4vw,40px)}
.intro p{color:var(--muted);margin:6px 0 0;max-width:680px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;font-weight:600;border:1px solid transparent;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
.btn.teal{background:var(--teal)} .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus{outline:2px solid var(--teal);outline-offset:1px}
/* level legend */
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lg{border-radius:12px;padding:10px 12px;background:var(--bg);border-left:4px solid var(--c)}
.lg b{display:block;font-size:14px;color:var(--c)} .lg span{font-size:13px;color:var(--muted)}
/* placement */
.place{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--teal-soft),#fff 70%);border:1.5px solid var(--teal)}
.place .t b{font-family:Fraunces,Georgia,serif;font-size:20px;display:block}
.place .t span{color:var(--muted);font-size:15px}
.rec{font-weight:600;color:var(--teal)}
/* topics */
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.topics{grid-template-columns:minmax(0,1fr)}}
.topic{display:flex;flex-direction:column;gap:12px}
.topic h2{font-size:22px}
.idea{color:var(--muted);font-size:15px;margin:0}
.example{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;overflow-x:auto}
.example .q{font-size:17px;margin-bottom:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--c)}
.pill.on{background:var(--c);border-color:var(--c);color:#fff}
.pill .n{font-weight:500;opacity:.75;margin-left:4px}
.pill.star::after{content:"★";position:absolute;top:-8px;right:-4px;font-size:12px;color:var(--gold)}
/* practice */
.practice{display:flex;flex-direction:column;gap:14px;scroll-margin-top:80px}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.phead h2{font-size:24px}
.problem{font-size:clamp(19px,2.6vw,24px);padding:16px 18px;border-radius:14px;background:var(--bg);overflow-x:auto;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 240px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--bg)}
.preview{font-size:18px;min-height:1.4em}
.preview .pl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin-right:8px}
.howto{font-size:13px;color:var(--faint)}
.fb{border-radius:12px;padding:10px 14px;font-size:15px;overflow-x:auto}
.fb.good{background:var(--green-soft)} .fb.bad{background:var(--red-soft)} .fb.hint{background:var(--gold-soft)}
.fb .tag{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.fb.good .tag{color:var(--green)} .fb.bad .tag{color:var(--red)} .fb.hint .tag{color:var(--gold)}
.sol{margin:6px 0 0;padding-left:20px} .sol li{margin:2px 0}
.suggest{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1.5px dashed var(--c);border-radius:12px;padding:10px 14px}
.streak{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--faint)}
.streak i{width:10px;height:10px;border-radius:50%;background:var(--line)} .streak i.ok{background:var(--green)} .streak i.no{background:var(--red)}
/* modal quiz */
.modal{position:fixed;inset:0;background:rgba(22,35,59,.45);display:grid;place-items:center;padding:16px;z-index:60}
.modal .card{width:min(620px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.qprog{display:flex;gap:6px} .qprog i{flex:1;height:6px;border-radius:3px;background:var(--line)} .qprog i.ok{background:var(--green)} .qprog i.no{background:var(--red)} .qprog i.now{background:var(--teal)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:none;background:none;padding:10px 16px;font-weight:600;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.learn,.pview{display:flex;flex-direction:column;gap:20px}
.road{display:flex;gap:8px;flex-wrap:wrap}
.stop{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.stop i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px;border:1.5px solid var(--line)}
.stop.done i{background:var(--green);border-color:var(--green);color:#fff}
.stop.on{border-color:var(--teal);background:var(--teal-soft)}
.lesson{display:flex;flex-direction:column;gap:16px;scroll-margin-top:80px}
.lesson h2{font-size:clamp(24px,3vw,30px)}
.big{font-size:18px;background:var(--teal-soft);border-radius:14px;padding:14px 16px;overflow-x:auto}
.big b{color:var(--teal)}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;counter-reset:k}
.steps li{counter-increment:k;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;background:var(--bg);border-radius:12px;padding:10px 12px;animation:pop .25s ease}
.steps li::before{content:counter(k);width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps .m{font-size:19px;overflow-x:auto;overflow-y:hidden;padding:3px 0 4px} .steps .w{font-size:14px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.steps li{animation:none}}
.warn{background:var(--red-soft);border-radius:14px;padding:12px 16px;font-size:15px;overflow-x:auto}
.warn b{color:var(--red)}
.turn{border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.turn .q{font-size:19px;overflow-x:auto}
.lnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
footer{text-align:center;color:var(--faint);font-size:13px;padding:24px}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chap{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chap i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px}
.chap.on{background:var(--navy);border-color:var(--navy);color:#fff} .chap.on i{background:rgba(255,255,255,.2)}
.chap.soon{opacity:.45;cursor:default}
.fig{display:block;width:100%;max-width:360px;height:auto;margin:4px 0 8px}
.problem .fig{max-width:340px}
.mc{display:grid;gap:6px;margin-top:10px;font-size:.92em}
.mc div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mc div{cursor:pointer} .mc div:hover{border-color:var(--teal)} .mc div.sel{border-color:var(--teal);background:var(--teal-soft)}

/* ---- left sidebar for chapters (wide screens) ---- */
.lv-main{display:contents}
.lv-main>.intro{order:-1}
@media (min-width:720px){
  .wrap{max-width:1320px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start;padding-left:14px;padding-right:14px}
  .lv-main{display:flex;flex-direction:column;gap:20px;min-width:0}
  .wrap>.chapters{position:sticky;top:16px;flex-direction:column;flex-wrap:nowrap;gap:2px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
  .wrap>.chapters::before{content:attr(aria-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:4px 8px 8px}
  .wrap>.chapters .chap{border:0;border-radius:10px;background:transparent;padding:8px 8px;font-size:14px;line-height:1.3;text-align:left;width:100%;align-items:flex-start}
  .wrap>.chapters .chap i{flex:0 0 auto;min-width:24px;width:auto;padding:0 5px;height:24px;border-radius:12px}
  .wrap>.chapters .chap:hover{background:var(--bg)}
  .wrap>.chapters .chap.on{background:var(--navy);color:#fff}
}
@media (min-width:1050px){ .wrap{grid-template-columns:260px minmax(0,1fr);gap:28px;padding-left:20px;padding-right:20px} }

/* ---- compact level bar: one level for the whole chapter ---- */
.lvbar{display:flex;flex-direction:column;gap:10px;padding:14px 18px}
.lvtop{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.lvtop>.label{margin:0}
.lvchips{display:flex;flex-wrap:wrap;gap:6px}
.lvc{position:relative;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.2}
.lvc i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--bg);color:var(--c)}
.lvc:hover{border-color:var(--c)}
.lvc.on{background:var(--c);border-color:var(--c);color:#fff}
.lvc.on i{background:rgba(255,255,255,.25);color:#fff}
.lvc.star::after{content:"★";position:absolute;top:-7px;right:-3px;font-size:11px;color:var(--gold)}
.lvsub{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;font-size:14px;color:var(--muted)}
.lvsub b{color:var(--ink)}
.lvsub .lvplace{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#pLevels{display:none}
.topic .tgo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topic .tgo small{color:var(--muted);font-size:13px}
.watch{margin:-4px 0 4px;font-size:14px;color:var(--muted)} .watch b{color:var(--ink)}

/* ---- hide the topic cards while a practice problem is open ---- */
#practice:not([hidden]) ~ #topics{display:none}
/* ---- chapter cheat sheet ---- */
.tabs .cs-btn{margin-left:auto;align-self:center;border:1.5px solid var(--gold,#C9962B);background:#FFF8EA;color:#8A6415;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:6px}
.tabs .cs-btn:hover{background:#FBF0D9}
.csm{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow-y:auto}
.cs-sheet{background:#fff;border-radius:16px;max-width:980px;width:100%;padding:22px 26px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.cs-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.cs-top h2{font-family:Fraunces,Georgia,serif;font-size:24px;margin:0;color:var(--navy)}
.cs-top .sub{font-size:13px;color:var(--muted)}
.cs-top .cs-acts{display:flex;gap:8px}
.cs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.cs-grid{grid-template-columns:1fr}}
.cs-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;break-inside:avoid;page-break-inside:avoid}
.cs-card h3{margin:0 0 6px;font-size:16px;color:var(--navy);font-family:Fraunces,Georgia,serif}
.cs-card .cs-idea{font-size:14px;line-height:1.55;margin-bottom:8px}
.cs-card .cs-ex{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px}
.cs-card .cs-ex .lab,.cs-card .cs-warn .lab{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:2px}
.cs-card .cs-ex div{margin:2px 0;overflow-x:auto}
.cs-card .cs-warn{margin-top:8px;font-size:13px;line-height:1.5;border-left:3px solid var(--red,#C0392B);padding:2px 0 2px 8px}
.cs-card .cs-warn .lab{color:var(--red,#C0392B)}
.cs-foot{margin-top:12px;font-size:12px;color:var(--faint);text-align:right}
@media print{
  body.cs-printing > *:not(.csm){display:none !important}
  body.cs-printing .csm{position:static;background:none;padding:0;overflow:visible}
  body.cs-printing .cs-sheet{box-shadow:none;border-radius:0;padding:0;max-width:none}
  body.cs-printing .cs-acts{display:none}
  body.cs-printing .cs-card .cs-ex{background:#f4f4f4}
  @page{margin:12mm}
}
</style>

<script>
"use strict";
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let x;do{x=rnd(a,b)}while(x===0);return x};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const sg=k=>k>=0?"+ "+k:"- "+(-k);            // "+ 3" / "- 3"
const P=n=>n<0?"("+n+")":String(n);            // wrap negatives
function co(a,v){ return (a===1?"":a===-1?"-":String(a))+v; }   // coefficient with variable
function lin(a,b,v="x"){ if(a===0) return String(b); let s=co(a,v); if(b) s+=" "+sg(b); return s; }
function cterm(a,v){ return (a<0?"- ":"+ ")+(Math.abs(a)===1?"":Math.abs(a))+v; } // signed term for middle
function frac(n,d){ if(d<0){n=-n;d=-d} const g=gcd(n,d)||1; n/=g; d/=g; return d===1?String(n):(n<0?"-":"")+"\\frac{"+Math.abs(n)+"}{"+d+"}"; }
const OPT={"<":"<","<=":"\\le",">":">",">=":"\\ge"}; const FLIP={"<":">","<=":">=",">":"<",">=":"<="};
const pt=(x,y)=>`(${x}, ${y})`;
const sq2=h=>`(x ${sg(-h)})^2`;
function ptex(cs,v="x"){ const n=cs.length-1; let t=""; cs.forEach((c,i)=>{ const d=n-i; if(!c) return; const a=Math.abs(c), vv=d===0?"":d===1?v:v+"^{"+d+"}", cf=(a===1&&d>0)?"":String(a); t+=t?(c<0?" - ":" + "):(c<0?"-":""); t+=cf+vv; }); return t||"0"; }
function pstr(cs){ const n=cs.length-1; return cs.map((c,i)=>`(${c})*x^${n-i}`).join("+"); }
function pmul(a,b){ const r=Array(a.length+b.length-1).fill(0); a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y)); return r; }
function radParts(n){ let k=1,m=n; for(let i=Math.floor(Math.sqrt(n));i>1;i--){ if(n%(i*i)===0){ k=i; m=n/(i*i); break; } } return [k,m]; }
function rad(n){ const [k,m]=radParts(n); return m===1?String(k):(k===1?"":k)+"\\sqrt{"+m+"}"; }
function radTex(c,n){ const [k,m]=radParts(n); const K=c*k; return m===1?String(K):(K===1?"":K)+"\\sqrt{"+m+"}"; }

const N=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"{,}");      // 1{,}000 inside $...$

const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function words(n){ if(n<20) return ONES[n]; if(n<100) return TENS[Math.floor(n/10)]+(n%10?"-"+ONES[n%10]:""); if(n<1000) return ONES[Math.floor(n/100)]+" hundred"+(n%100?" "+words(n%100):""); return "one thousand"; }
const digs=n=>[Math.floor(n/100),Math.floor(n/10)%10,n%10];
const PLACE=["hundreds","tens","ones"], PV=[100,10,1];
function expTex(n){ const d=digs(n); return d.map((x,i)=>x*PV[i]).filter(x=>x).join(" + ")||"0"; }
const r10=n=>Math.round(n/10)*10, r100=n=>Math.round(n/100)*100;   // whole numbers: .5 rounds up

function threeDigit(noZero){ let n; do{ n=rnd(101,999); }while(noZero&&digs(n).includes(0)); return n; }
function addPair(regroup){ let a,b; do{ a=rnd(101,799); b=rnd(101,899-0); }while(a+b>999||((a%10+b%10>=10||Math.floor(a/10)%10+Math.floor(b/10)%10>=10)!==regroup)); return [a,b]; }
function subPair(regroup){ let a,b; do{ a=rnd(200,999); b=rnd(101,a-50); }while((a%10<b%10||Math.floor(a/10)%10<Math.floor(b/10)%10)!==regroup); return [a,b]; }
function colAdd(a,b){ const s=[]; const o=a%10+b%10, t=Math.floor(a/10)%10+Math.floor(b/10)%10+(o>=10?1:0);
  s.push(`Ones: $${a%10} + ${b%10} = ${o}$${o>=10?` → write $${o%10}$, regroup $10$ ones as $1$ ten`:""}.`);
  s.push(`Tens: $${Math.floor(a/10)%10} + ${Math.floor(b/10)%10}${o>=10?" + 1":""} = ${t}$${t>=10?` → write $${t%10}$, regroup $10$ tens as $1$ hundred`:""}.`);
  s.push(`Hundreds: $${Math.floor(a/100)} + ${Math.floor(b/100)}${t>=10?" + 1":""} = ${Math.floor(a/100)+Math.floor(b/100)+(t>=10?1:0)}$. So $${N(a)} + ${N(b)} = ${N(a+b)}$.`); return s; }
function colSub(a,b){ const s=[]; let [h,t,o]=digs(a); const [bh,bt,bo]=digs(b);
  if(o<bo){ if(t===0){ h--; t=9; s.push(`No tens to open, so open a hundred: $${a}$ becomes $${h}$ hundreds, $10$ tens, then open a ten: $${h}$ hundreds, $9$ tens, $${o+10}$ ones.`); } else { t--; s.push(`Not enough ones: open a ten. Now $${t}$ tens and $${o+10}$ ones.`); } o+=10; }
  s.push(`Ones: $${o} - ${bo} = ${o-bo}$.`);
  if(t<bt){ h--; t+=10; s.push(`Not enough tens: open a hundred. Now $${h}$ hundreds and $${t}$ tens.`); }
  s.push(`Tens: $${t} - ${bt} = ${t-bt}$. Hundreds: $${h} - ${bh} = ${h-bh}$.`);
  s.push(`So $${a} - ${b} = ${a-b}$. Check: $${a-b} + ${b} = ${a}$ ✓`); return s; }

function fbar(d,sh,ws){ const W=300,H=42; let x=6,o=""; const tot=ws?ws.reduce((a,b)=>a+b,0):d; for(let i=0;i<d;i++){ const w=W*(ws?ws[i]:1)/tot; o+=`<rect x="${x}" y="6" width="${w}" height="${H-12}" fill="${i<sh?"#7FC8C0":"#fff"}" stroke="#16233B" stroke-width="2"/>`; x+=w; }
  return `<svg class="fig" viewBox="0 0 312 ${H}" style="max-width:320px;display:block;margin:8px 0" role="img" aria-label="bar split into ${d} parts, ${sh} shaded">${o}</svg>`; }
function pie(d,sh){ const r=40,c=46; let o=""; for(let i=0;i<d;i++){ const a0=-Math.PI/2+2*Math.PI*i/d,a1=-Math.PI/2+2*Math.PI*(i+1)/d; const x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);
  o+=`<path d="M${c},${c} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${d===1?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${i<sh?"#7FC8C0":"#fff"}" stroke="#16233B" stroke-width="2"/>`; }
  return `<svg class="fig" viewBox="0 0 92 92" style="max-width:120px;display:block;margin:8px 0" role="img" aria-label="circle split into ${d} parts, ${sh} shaded">${o}</svg>`; }

function addMin(h,m,d){ let t=((h%12)*60+m+d)%720; if(t<0) t+=720; let H=Math.floor(t/60); return [H===0?12:H,t%60]; }
function clock(h,m){ const c=60,r=52; let o=`<circle cx="${c}" cy="${c}" r="${r}" fill="#fff" stroke="#16233B" stroke-width="3"/>`;
  for(let i=0;i<60;i++){ const a=i*Math.PI/30,big=i%5===0; o+=`<line x1="${c+Math.sin(a)*(r-(big?8:4))}" y1="${c-Math.cos(a)*(r-(big?8:4))}" x2="${c+Math.sin(a)*(r-1)}" y2="${c-Math.cos(a)*(r-1)}" stroke="#16233B" stroke-width="${big?2:1}"/>`; }
  for(let i=1;i<=12;i++){ const a=i*Math.PI/6; o+=`<text x="${c+Math.sin(a)*(r-17)}" y="${c-Math.cos(a)*(r-17)+4}" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#16233B">${i}</text>`; }

  o+=`<line x1="${c}" y1="${c}" x2="${c+Math.sin(ma)*44}" y2="${c-Math.cos(ma)*44}" stroke="#0F7C7C" stroke-width="3" stroke-linecap="round"/><circle cx="${c}" cy="${c}" r="4" fill="#16233B"/>`;
  return `<svg class="fig" viewBox="0 0 120 120" style="max-width:150px;display:block;margin:8px 0" role="img" aria-label="clock">${o}</svg>`; }
function barGraph(cats,vals,step,top,title){ const W=360,H=200,L=40,B=30,T=14,pw=W-L-10,ph=H-B-T,sc=ph/top; let o="";
  for(let v=0;v<=top;v+=step){ const y=H-B-v*sc; o+=`<line x1="${L}" y1="${y}" x2="${W-10}" y2="${y}" stroke="#E8E2D8"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-family="Inter,sans-serif" font-size="11" fill="#5B6474">${v}</text>`; }
  const bw=pw/cats.length; cats.forEach((cn,i)=>{ const x=L+i*bw+bw*.22,h=vals[i]*sc; o+=`<rect x="${x}" y="${H-B-h}" width="${bw*.56}" height="${h}" fill="#7FC8C0" stroke="#0F7C7C"/><text x="${x+bw*.28}" y="${H-B+16}" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#16233B">${cn}</text>`; });

function ruler(len,endQ,qMarks){ const W=380,x0=14,u=(W-2*x0)/len; let o=`<rect x="${x0}" y="34" width="${W-2*x0}" height="30" fill="#FBF1DC" stroke="#C9962B"/>`;

function mixT(q){ const w=Math.floor(q/4),r=q%4; if(!r) return `${w}`; const f=r===2?FR(1,2):FR(r,4); return w?`${w}${f}`:f; }   // q = quarters

function grid(r,c){ const s=Math.min(26,300/c); let o=""; for(let i=0;i<r;i++) for(let j=0;j<c;j++) o+=`<rect x="${4+j*s}" y="${4+i*s}" width="${s}" height="${s}" fill="#DDF0EE" stroke="#0F7C7C"/>`;

function rectPic(l,w,u){ const s=Math.min(30,260/l,130/w),W=l*s,H=w*s; return `<svg class="fig" viewBox="0 0 ${W+90} ${H+50}" style="max-width:${Math.min(360,W+90)}px;display:block;margin:8px 0" role="img" aria-label="rectangle ${l} by ${w}"><rect x="40" y="16" width="${W}" height="${H}" fill="#DDF0EE" stroke="#0F7C7C" stroke-width="2.5"/><text x="${40+W/2}" y="${H+36}" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#16233B">${l} ${u}</text><text x="${46+W}" y="${20+H/2}" font-family="Inter,sans-serif" font-size="13" fill="#16233B">${w} ${u}</text></svg>`; }

  let lab=""; P.forEach((p,i)=>{ const q=P[(i+1)%n],mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,dx=mx-c[0],dy=my-c[1],d=Math.hypot(dx,dy)||1; lab+=`<text x="${mx+dx/d*16}" y="${my+dy/d*16+4}" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#16233B">${sides[i]}${u&&sides[i]!=="?"?" "+u:""}</text>`; });

function hexPic(sh){ const c=[70,70],R=62; let o=""; for(let i=0;i<6;i++){ const a0=Math.PI/6+i*Math.PI/3,a1=a0+Math.PI/3; o+=`<polygon points="${c.join(",")} ${c[0]+R*Math.cos(a0)},${c[1]+R*Math.sin(a0)} ${c[0]+R*Math.cos(a1)},${c[1]+R*Math.sin(a1)}" fill="${i<sh?"#7FC8C0":"#fff"}" stroke="#16233B" stroke-width="2"/>`; }

function sqParts(n,sh,mode){ // square cut into n equal parts: mode "cols" | "grid"

{id:"ch2",title:"Multiplication & Division Facts",topics:[

}
function showNext(){ const r=$("tNext"); if(!r) return; r.innerHTML=""; const t=CH.topics[LI];
  const pr=document.createElement("button"); pr.className="btn ghost sm"; pr.textContent="Practice this topic"; pr.onclick=()=>{ setTab("practice"); startPractice(t,st.level[t.id]||st.rec||1); }; r.appendChild(pr);
  const n=document.createElement("button"); n.className="btn teal sm";
  if(LI<CH.topics.length-1){ n.textContent="Next lesson →"; n.onclick=()=>openLesson(LI+1,true); } else { n.textContent="Start practicing →"; n.onclick=()=>{ setTab("practice"); window.scrollTo({top:0,behavior:"smooth"}); }; }
  r.appendChild(n); }
function setTab(t){ $("learnView").hidden=t!=="learn"; $("practiceView").hidden=t!=="practice"; $("tabLearn").classList.toggle("on",t==="learn"); $("tabPractice").classList.toggle("on",t==="practice"); try{ history.replaceState(null,"","#"+CH.id+"-"+t); }catch(e){} }
function openChapter(id,tab){
  useChapter(id); $("chTitle").textContent="Unit "+ALLCH.find(c=>c[2]===CH.id)[0]+": "+CH.title; $("practice").hidden=true;
  chapters(); recText(); topics(); const first=CH.topics.findIndex(t=>!st.learned[t.id]); openLesson(first<0?0:first);
  setTab(tab||(first<0?"practice":"learn")); }
document.addEventListener("click",e=>{ const d=e.target.closest(".mc > div"); if(!d) return; const card=d.closest(".practice, .turn, .modal .card"); const inp=card&&card.querySelector("input[type=text]"); if(inp&&!inp.disabled){ inp.value=d.querySelector("b").textContent.trim()[0]; inp.focus(); d.parentElement.querySelectorAll("div").forEach(x=>x.classList.toggle("sel",x===d)); } });
$("tabLearn").onclick=()=>setTab("learn"); $("tabPractice").onclick=()=>setTab("practice");
window.addEventListener("load",()=>{ legend(); const m=/^#(ch\d+)(?:-(learn|practice))?$/.exec(location.hash); openChapter(m?m[1]:ST.cur,m?m[2]:null); });
</script>
