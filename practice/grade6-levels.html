<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --ink:#16233B; --muted:#5B6474; --faint:#8C93A0; --line:#E8E2D8;
  --navy:#1F3A68; --teal:#0F7C7C; --teal-soft:#DDF0EE; --gold:#C9962B; --gold-soft:#FBF1DC; --red:#B3261E; --red-soft:#FBE7E5; --green:#1E7A45; --green-soft:#DDF4E6;
  --l1:#2E8B57; --l2:#0F7C7C; --l3:#1F3A68; --l4:#B7472A; --l5:#6A4BD8;
  --radius:18px; --shadow:0 8px 26px rgba(22,35,59,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
header.top .in{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:24px}
.brand{font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--teal)}
.back{margin-left:auto;font-size:15px;text-decoration:none;color:var(--muted);font-weight:500}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 48px;display:flex;flex-direction:column;gap:20px}
.intro h1{font-size:clamp(28px,4vw,40px)}
.intro p{color:var(--muted);margin:6px 0 0;max-width:680px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;font-weight:600;border:1px solid transparent;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
.btn.teal{background:var(--teal)} .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus{outline:2px solid var(--teal);outline-offset:1px}
/* level legend */
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lg{border-radius:12px;padding:10px 12px;background:var(--bg);border-left:4px solid var(--c)}
.lg b{display:block;font-size:14px;color:var(--c)} .lg span{font-size:13px;color:var(--muted)}
/* placement */
.place{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--teal-soft),#fff 70%);border:1.5px solid var(--teal)}
.place .t b{font-family:Fraunces,Georgia,serif;font-size:20px;display:block}
.place .t span{color:var(--muted);font-size:15px}
.rec{font-weight:600;color:var(--teal)}
/* topics */
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.topics{grid-template-columns:minmax(0,1fr)}}
.topic{display:flex;flex-direction:column;gap:12px}
.topic h2{font-size:22px}
.idea{color:var(--muted);font-size:15px;margin:0}
.example{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;overflow-x:auto}
.example .q{font-size:17px;margin-bottom:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--c)}
.pill.on{background:var(--c);border-color:var(--c);color:#fff}
.pill .n{font-weight:500;opacity:.75;margin-left:4px}
.pill.star::after{content:"★";position:absolute;top:-8px;right:-4px;font-size:12px;color:var(--gold)}
/* practice */
.practice{display:flex;flex-direction:column;gap:14px;scroll-margin-top:80px}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.phead h2{font-size:24px}
.problem{font-size:clamp(19px,2.6vw,24px);padding:16px 18px;border-radius:14px;background:var(--bg);overflow-x:auto;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 240px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--bg)}
.preview{font-size:18px;min-height:1.4em}
.preview .pl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin-right:8px}
.howto{font-size:13px;color:var(--faint)}
.fb{border-radius:12px;padding:10px 14px;font-size:15px;overflow-x:auto}
.fb.good{background:var(--green-soft)} .fb.bad{background:var(--red-soft)} .fb.hint{background:var(--gold-soft)}
.fb .tag{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.fb.good .tag{color:var(--green)} .fb.bad .tag{color:var(--red)} .fb.hint .tag{color:var(--gold)}
.sol{margin:6px 0 0;padding-left:20px} .sol li{margin:2px 0}
.suggest{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1.5px dashed var(--c);border-radius:12px;padding:10px 14px}
.streak{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--faint)}
.streak i{width:10px;height:10px;border-radius:50%;background:var(--line)} .streak i.ok{background:var(--green)} .streak i.no{background:var(--red)}
/* modal quiz */
.modal{position:fixed;inset:0;background:rgba(22,35,59,.45);display:grid;place-items:center;padding:16px;z-index:60}
.modal .card{width:min(620px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.qprog{display:flex;gap:6px} .qprog i{flex:1;height:6px;border-radius:3px;background:var(--line)} .qprog i.ok{background:var(--green)} .qprog i.no{background:var(--red)} .qprog i.now{background:var(--teal)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:none;background:none;padding:10px 16px;font-weight:600;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.learn,.pview{display:flex;flex-direction:column;gap:20px}
.road{display:flex;gap:8px;flex-wrap:wrap}
.stop{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.stop i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px;border:1.5px solid var(--line)}
.stop.done i{background:var(--green);border-color:var(--green);color:#fff}
.stop.on{border-color:var(--teal);background:var(--teal-soft)}
.lesson{display:flex;flex-direction:column;gap:16px;scroll-margin-top:80px}
.lesson h2{font-size:clamp(24px,3vw,30px)}
.big{font-size:18px;background:var(--teal-soft);border-radius:14px;padding:14px 16px;overflow-x:auto}
.big b{color:var(--teal)}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;counter-reset:k}
.steps li{counter-increment:k;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;background:var(--bg);border-radius:12px;padding:10px 12px;animation:pop .25s ease}
.steps li::before{content:counter(k);width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps .m{font-size:19px;overflow-x:auto;overflow-y:hidden;padding:3px 0 4px} .steps .w{font-size:14px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.steps li{animation:none}}
.warn{background:var(--red-soft);border-radius:14px;padding:12px 16px;font-size:15px;overflow-x:auto}
.warn b{color:var(--red)}
.turn{border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.turn .q{font-size:19px;overflow-x:auto}
.lnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
footer{text-align:center;color:var(--faint);font-size:13px;padding:24px}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chap{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chap i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px}
.chap.on{background:var(--navy);border-color:var(--navy);color:#fff} .chap.on i{background:rgba(255,255,255,.2)}
.chap.soon{opacity:.45;cursor:default}
.fig{display:block;width:100%;max-width:360px;height:auto;margin:4px 0 8px}
.problem .fig{max-width:340px}
.mc{display:grid;gap:6px;margin-top:10px;font-size:.92em}
.mc div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mc div{cursor:pointer} .mc div:hover{border-color:var(--teal)} .mc div.sel{border-color:var(--teal);background:var(--teal-soft)}

/* ---- left sidebar for chapters (wide screens) ---- */
.lv-main{display:contents}
.lv-main>.intro{order:-1}
@media (min-width:720px){
  .wrap{max-width:1320px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start;padding-left:14px;padding-right:14px}
  .lv-main{display:flex;flex-direction:column;gap:20px;min-width:0}
  .wrap>.chapters{position:sticky;top:16px;flex-direction:column;flex-wrap:nowrap;gap:2px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
  .wrap>.chapters::before{content:attr(aria-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:4px 8px 8px}
  .wrap>.chapters .chap{border:0;border-radius:10px;background:transparent;padding:8px 8px;font-size:14px;line-height:1.3;text-align:left;width:100%;align-items:flex-start}
  .wrap>.chapters .chap i{flex:0 0 auto;min-width:24px;width:auto;padding:0 5px;height:24px;border-radius:12px}
  .wrap>.chapters .chap:hover{background:var(--bg)}
  .wrap>.chapters .chap.on{background:var(--navy);color:#fff}
}
@media (min-width:1050px){ .wrap{grid-template-columns:260px minmax(0,1fr);gap:28px;padding-left:20px;padding-right:20px} }

/* ---- compact level bar: one level for the whole chapter ---- */
.lvbar{display:flex;flex-direction:column;gap:10px;padding:14px 18px}
.lvtop{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.lvtop>.label{margin:0}
.lvchips{display:flex;flex-wrap:wrap;gap:6px}
.lvc{position:relative;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.2}
.lvc i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--bg);color:var(--c)}
.lvc:hover{border-color:var(--c)}
.lvc.on{background:var(--c);border-color:var(--c);color:#fff}
.lvc.on i{background:rgba(255,255,255,.25);color:#fff}
.lvc.star::after{content:"★";position:absolute;top:-7px;right:-3px;font-size:11px;color:var(--gold)}
.lvsub{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;font-size:14px;color:var(--muted)}
.lvsub b{color:var(--ink)}
.lvsub .lvplace{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#pLevels{display:none}
.topic .tgo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topic .tgo small{color:var(--muted);font-size:13px}
.watch{margin:-4px 0 4px;font-size:14px;color:var(--muted)} .watch b{color:var(--ink)}

/* ---- hide the topic cards while a practice problem is open ---- */
#practice:not([hidden]) ~ #topics{display:none}
/* ---- chapter cheat sheet ---- */
.tabs .cs-btn{margin-left:auto;align-self:center;border:1.5px solid var(--gold,#C9962B);background:#FFF8EA;color:#8A6415;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:6px}
.tabs .cs-btn:hover{background:#FBF0D9}
.csm{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow-y:auto}
.cs-sheet{background:#fff;border-radius:16px;max-width:980px;width:100%;padding:22px 26px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.cs-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.cs-top h2{font-family:Fraunces,Georgia,serif;font-size:24px;margin:0;color:var(--navy)}
.cs-top .sub{font-size:13px;color:var(--muted)}
.cs-top .cs-acts{display:flex;gap:8px}
.cs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.cs-grid{grid-template-columns:1fr}}
.cs-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;break-inside:avoid;page-break-inside:avoid}
.cs-card h3{margin:0 0 6px;font-size:16px;color:var(--navy);font-family:Fraunces,Georgia,serif}
.cs-card .cs-idea{font-size:14px;line-height:1.55;margin-bottom:8px}
.cs-card .cs-ex{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px}
.cs-card .cs-ex .lab,.cs-card .cs-warn .lab{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:2px}
.cs-card .cs-ex div{margin:2px 0;overflow-x:auto}
.cs-card .cs-warn{margin-top:8px;font-size:13px;line-height:1.5;border-left:3px solid var(--red,#C0392B);padding:2px 0 2px 8px}
.cs-card .cs-warn .lab{color:var(--red,#C0392B)}
.cs-foot{margin-top:12px;font-size:12px;color:var(--faint);text-align:right}
@media print{
  body.cs-printing > *:not(.csm){display:none !important}
  body.cs-printing .csm{position:static;background:none;padding:0;overflow:visible}
  body.cs-printing .cs-sheet{box-shadow:none;border-radius:0;padding:0;max-width:none}
  body.cs-printing .cs-acts{display:none}
  body.cs-printing .cs-card .cs-ex{background:#f4f4f4}
  @page{margin:12mm}
}
</style>

<script>
"use strict";
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let x;do{x=rnd(a,b)}while(x===0);return x};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const sg=k=>k>=0?"+ "+k:"- "+(-k);            // "+ 3" / "- 3"
const P=n=>n<0?"("+n+")":String(n);            // wrap negatives
function co(a,v){ return (a===1?"":a===-1?"-":String(a))+v; }   // coefficient with variable
function lin(a,b,v="x"){ if(a===0) return String(b); let s=co(a,v); if(b) s+=" "+sg(b); return s; }
function cterm(a,v){ return (a<0?"- ":"+ ")+(Math.abs(a)===1?"":Math.abs(a))+v; } // signed term for middle
function frac(n,d){ if(d<0){n=-n;d=-d} const g=gcd(n,d)||1; n/=g; d/=g; return d===1?String(n):(n<0?"-":"")+"\\frac{"+Math.abs(n)+"}{"+d+"}"; }
const OPT={"<":"<","<=":"\\le",">":">",">=":"\\ge"}; const FLIP={"<":">","<=":">=",">":"<",">=":"<="};
const pt=(x,y)=>`(${x}, ${y})`;
const sq2=h=>`(x ${sg(-h)})^2`;
function ptex(cs,v="x"){ const n=cs.length-1; let t=""; cs.forEach((c,i)=>{ const d=n-i; if(!c) return; const a=Math.abs(c), vv=d===0?"":d===1?v:v+"^{"+d+"}", cf=(a===1&&d>0)?"":String(a); t+=t?(c<0?" - ":" + "):(c<0?"-":""); t+=cf+vv; }); return t||"0"; }
function pstr(cs){ const n=cs.length-1; return cs.map((c,i)=>`(${c})*x^${n-i}`).join("+"); }
function pmul(a,b){ const r=Array(a.length+b.length-1).fill(0); a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y)); return r; }
function radParts(n){ let k=1,m=n; for(let i=Math.floor(Math.sqrt(n));i>1;i--){ if(n%(i*i)===0){ k=i; m=n/(i*i); break; } } return [k,m]; }
function rad(n){ const [k,m]=radParts(n); return m===1?String(k):(k===1?"":k)+"\\sqrt{"+m+"}"; }
function radTex(c,n){ const [k,m]=radParts(n); const K=c*k; return m===1?String(K):(K===1?"":K)+"\\sqrt{"+m+"}"; }

function words(n){ if(n<20) return ONES[n]; if(n<100) return TENS[Math.floor(n/10)]+(n%10?"-"+ONES[n%10]:""); if(n<1000) return ONES[Math.floor(n/100)]+" hundred"+(n%100?" "+words(n%100):""); return "one thousand"; }

function subPair(regroup){ let a,b; do{ a=rnd(200,999); b=rnd(101,a-50); }while((a%10<b%10||Math.floor(a/10)%10<Math.floor(b/10)%10)!==regroup); return [a,b]; }
function colAdd(a,b){ const s=[]; const o=a%10+b%10, t=Math.floor(a/10)%10+Math.floor(b/10)%10+(o>=10?1:0);
  s.push(`Ones: $${a%10} + ${b%10} = ${o}$${o>=10?` → write $${o%10}$, regroup $10$ ones as $1$ ten`:""}.`);
  s.push(`Tens: $${Math.floor(a/10)%10} + ${Math.floor(b/10)%10}${o>=10?" + 1":""} = ${t}$${t>=10?` → write $${t%10}$, regroup $10$ tens as $1$ hundred`:""}.`);
  s.push(`Hundreds: $${Math.floor(a/100)} + ${Math.floor(b/100)}${t>=10?" + 1":""} = ${Math.floor(a/100)+Math.floor(b/100)+(t>=10?1:0)}$. So $${N(a)} + ${N(b)} = ${N(a+b)}$.`); return s; }
function colSub(a,b){ const s=[]; let [h,t,o]=digs(a); const [bh,bt,bo]=digs(b);
  if(o<bo){ if(t===0){ h--; t=9; s.push(`No tens to open, so open a hundred: $${a}$ becomes $${h}$ hundreds, $10$ tens, then open a ten: $${h}$ hundreds, $9$ tens, $${o+10}$ ones.`); } else { t--; s.push(`Not enough ones: open a ten. Now $${t}$ tens and $${o+10}$ ones.`); } o+=10; }
  s.push(`Ones: $${o} - ${bo} = ${o-bo}$.`);
  if(t<bt){ h--; t+=10; s.push(`Not enough tens: open a hundred. Now $${h}$ hundreds and $${t}$ tens.`); }
  s.push(`Tens: $${t} - ${bt} = ${t-bt}$. Hundreds: $${h} - ${bh} = ${h-bh}$.`);
  s.push(`So $${a} - ${b} = ${a-b}$. Check: $${a-b} + ${b} = ${a}$ ✓`); return s; }

  ()=>{ const p=rnd(125,899)/100,k=rnd(3,8),pay=Math.ceil(p*k/10)*10+pick([0,10]); return {q:`${nm()} buys $${k}$ notebooks at $\\$${p.toFixed(2)}$ each and pays with $\\$${pay}$. How much change?`,type:"number",ans:dp(pay-p*k),ansTex:`\\$${(pay-p*k).toFixed(2)}`,hint:"Multiply to find the total cost, then subtract from the money paid.",sol:[`Cost: $${k} \\times ${p.toFixed(2)} = ${(p*k).toFixed(2)}$.`,`Change: $${pay} - ${(p*k).toFixed(2)} = ${(pay-p*k).toFixed(2)}$.`]}; }
 ]},
 {id:"gcf",title:"GCF, LCM & the Distributive Property",idea:"The <b>GCF</b> (greatest common factor) is the biggest number that divides both. The <b>LCM</b> (least common multiple) is the smallest number both divide. The distributive property lets you pull out a common factor: $24 + 36 = 12(2 + 3)$.",
  lesson:{steps:[["\\text{GCF}(24, 36)","Factors of $24$: $1,2,3,4,6,8,12,24$. Of $36$: $1,2,3,4,6,9,12,18,36$."],["\\text{GCF} = 12","The biggest one on both lists."],["24 + 36 = 12(2 + 3)","Pull the GCF out with the distributive property."]],warn:"GCF is never bigger than the smaller number; LCM is never smaller than the bigger number."},
  gen:[
  ()=>{ const g=rnd(2,12),a=g*rnd(2,8); let b; do{ b=g*rnd(2,8); }while(b===a||gcd(a,b)!==g); return {q:`Find the GCF of $${a}$ and $${b}$.`,type:"number",ans:g,ansTex:`${g}`,hint:"List the factors of each, or use prime factorizations.",sol:[`The common factors include $${divisors(g).join(", ")}$; the greatest is $${g}$.`]}; },
  ()=>{ const a=rnd(3,15); let b; do{ b=rnd(3,15); }while(b===a); const l=a*b/gcd(a,b); return {q:`Find the LCM of $${a}$ and $${b}$.`,type:"number",ans:l,ansTex:`${l}`,hint:`List multiples of $${Math.max(a,b)}$ until one is also a multiple of $${Math.min(a,b)}$.`,sol:[`Multiples of $${Math.max(a,b)}$: $${[1,2,3,4].map(k=>k*Math.max(a,b)).join(", ")}, \\ldots$`,`LCM $= ${l}$.`]}; },
  ()=>{ const g=rnd(2,12); let x,y; do{ x=rnd(1,9); y=rnd(1,9); }while(x===y||gcd(x,y)!==1); return {q:`Use the GCF to rewrite: $${g*x} + ${g*y} = \\square(${x} + ${y})$. What goes in the box?`,type:"number",ans:g,ansTex:`${g}`,hint:"Find the GCF of the two numbers.",sol:[`GCF$(${g*x}, ${g*y}) = ${g}$.`,`$${g*x} + ${g*y} = ${g}(${x} + ${y})$.`]}; },
  ()=>{ if(Math.random()<.5){ const g=rnd(3,12),x=rnd(2,6); let y; do{ y=rnd(2,6); }while(gcd(x,y)!==1); const A=pick(["pencils","erasers"]); return {q:`A teacher has $${g*x}$ pencils and $${g*y}$ erasers. She makes identical kits with no supplies left over. What is the <b>greatest</b> number of kits she can make?`,type:"number",ans:g,ansTex:`${g}`,hint:"Identical groups with nothing left: GCF.",sol:[`GCF$(${g*x}, ${g*y}) = ${g}$ kits.`]}; } const a=pick([6,8,10,12]),b=pick([8,10,12,15].filter(v=>v!==a)),l=a*b/gcd(a,b); return {q:`Hot dogs come in packs of $${a}$ and buns in packs of $${b}$. What is the smallest number of hot dogs you can buy to have exactly as many buns?`,type:"number",ans:l,ansTex:`${l}`,hint:"The first number both pack sizes reach: LCM.",sol:[`LCM$(${a}, ${b}) = ${l}$.`]}; },
  ()=>{ const g=rnd(2,8); let x,y; do{ x=rnd(2,9); y=rnd(2,9); }while(x===y||gcd(x,y)!==1); const a=g*x,b=g*y,l=g*x*y; return {q:`Two numbers have GCF $${g}$ and LCM $${l}$. One of the numbers is $${a}$. What is the other number?`,type:"number",ans:b,ansTex:`${b}`,hint:"For any two numbers, GCF × LCM = the product of the two numbers.",sol:[`$${g} \\times ${l} = ${g*l} = ${a} \\times \\square$.`,`$\\square = ${g*l} \\div ${a} = ${b}$.`]}; }
 ]},
 {id:"fdiv",title:"Dividing Fractions",idea:"Dividing asks “<b>how many of these fit?</b>” To divide by a fraction, <b>multiply by its reciprocal</b> (flip it): $\\frac34 \\div \\frac18 = \\frac34 \\times \\frac81 = 6$.",
  lesson:{steps:[["3 \\div \\tfrac14","How many quarters fit in $3$ wholes?"],["3 \\times 4 = 12","Each whole holds $4$ quarters."],["\\tfrac23 \\div \\tfrac16 = \\tfrac23 \\times \\tfrac61 = 4","Keep, change, flip — then multiply."]],warn:"Flip only the <b>second</b> fraction (the divisor), and change mixed numbers to fractions first."},
  gen:[
  ()=>{ const w=rnd(2,9),d=rnd(2,8); return {q:`Divide: $${w} \\div \\tfrac{1}{${d}}$.`,type:"number",ans:w*d,ansTex:`${w*d}`,hint:`How many $\\frac{1}{${d}}$s fit in one whole? In $${w}$ wholes?`,sol:[`$${w} \\times ${d} = ${w*d}$.`]}; },
  ()=>{ const d=rnd(2,9),n=cpn(d),w=rnd(2,6); return {q:`Divide: $\\tfrac{${n}}{${d}} \\div ${w}$.`,type:"mixed",ans:[n,d*w],ansTex:mixTex(n,d*w),hint:`Dividing by $${w}$ is the same as multiplying by $\\frac{1}{${w}}$.`,sol:[`$\\frac{${n}}{${d}} \\times \\frac{1}{${w}} = \\frac{${n}}{${d*w}}$${gcd(n,d*w)>1?` $= ${mixTex(n,d*w)}$`:""}.`]}; },
  ()=>{ const b=rnd(2,9),a=cpn(b),d=rnd(2,9),c=cpn(d); return {q:`Divide: $\\tfrac{${a}}{${b}} \\div \\tfrac{${c}}{${d}}$. (A fraction or mixed number is fine.)`,type:"mixed",ans:[a*d,b*c],ansTex:mixTex(a*d,b*c),hint:"Keep, change, flip: multiply by the reciprocal.",sol:[`$\\frac{${a}}{${b}} \\times \\frac{${d}}{${c}} = \\frac{${a*d}}{${b*c}}$.`,`$= ${mixTex(a*d,b*c)}$.`]}; },
  ()=>{ const b=rnd(2,6),a=cpn(b),w1=rnd(1,4),d=rnd(2,6),c=cpn(d),w2=rnd(1,3); const N1=w1*b+a,N2=w2*d+c; return {q:`Divide: $${MIX(w1,a,b)} \\div ${MIX(w2,c,d)}$.`,type:"mixed",ans:[N1*d,b*N2],ansTex:mixTex(N1*d,b*N2),hint:"Change both mixed numbers to fractions first.",sol:[`$\\frac{${N1}}{${b}} \\div \\frac{${N2}}{${d}} = \\frac{${N1}}{${b}} \\times \\frac{${d}}{${N2}} = \\frac{${N1*d}}{${b*N2}}$.`,`$= ${mixTex(N1*d,b*N2)}$.`]}; },
  ()=>{ const b=rnd(2,6),a=cpn(b),k=pick([2,3,4,6]); /* a/b ÷ ? = a*k/b  -> ? = 1/k */ const q=[a*k,b]; return {q:`$\\tfrac{${a}}{${b}} \\div \\square = ${mixTex(q[0],q[1])}$. What fraction goes in the box?`,type:"mixed",ans:[1,k],ansTex:`\\tfrac{1}{${k}}`,hint:"Dividing gave a bigger answer — so the box is a fraction less than 1. Think: what times the answer gives the start?",sol:[`$\\square = \\tfrac{${a}}{${b}} \\div ${mixTex(q[0],q[1])} = \\tfrac{${a}}{${b}} \\times \\tfrac{${q[1]}}{${q[0]}} = \\tfrac{1}{${k}}$.`]}; }
 ]}
]},

 {id:"fword",title:"Fraction Division Word Problems",idea:"Ask one of two questions: <b>How many groups?</b> (how many $\\frac34$-cup servings in $6$ cups → $6 \\div \\frac34$) or <b>How much in one group?</b> ($\\frac23$ lb shared by $4$ → $\\frac23 \\div 4$).",
  lesson:{steps:[["6 \\text{ cups, } \\tfrac34 \\text{ cup per serving}","How many groups of $\\frac34$ fit in $6$?"],["6 \\div \\tfrac34 = 6 \\times \\tfrac43","Multiply by the reciprocal."],["= 8 \\text{ servings}","Check: $8 \\times \\frac34 = 6$ ✓"]],warn:"Read carefully: “$\\frac34$ of $6$” is <b>multiplication</b>; “how many $\\frac34$ in $6$” is <b>division</b>."},
  gen:[

  ()=>{ const d=rnd(2,6),n=cpn(d),k=rnd(2,6); return {q:`$\\tfrac{${n}}{${d}}$ pound of trail mix is shared equally among $${k}$ friends. How many pounds does each friend get?`,type:"mixed",ans:[n,d*k],ansTex:mixTex(n,d*k),hint:`How much in one group: $\\tfrac{${n}}{${d}} \\div ${k}$.`,sol:[`$\\tfrac{${n}}{${d}} \\times \\tfrac{1}{${k}} = ${mixTex(n,d*k)}$ lb.`]}; },
  ()=>{ const b=rnd(2,6),a=cpn(b),d=rnd(2,6),c=cpn(d); return {q:`A rectangle has area $\\tfrac{${a}}{${b}}$ square meter and length $\\tfrac{${c}}{${d}}$ meter. What is its width?`,type:"mixed",ans:[a*d,b*c],ansTex:mixTex(a*d,b*c),hint:"Width = area ÷ length.",sol:[`$\\tfrac{${a}}{${b}} \\div \\tfrac{${c}}{${d}} = \\tfrac{${a*d}}{${b*c}} = ${mixTex(a*d,b*c)}$ m.`]}; },
  ()=>{ const d=pick([3,4,5,6]),n=cpn(d,2),w=rnd(3,9); return {q:`A ribbon is $${w}$ feet long. How many pieces $\\tfrac{${n}}{${d}}$ foot long can be cut, as a mixed number (the last piece may be a part of a piece)?`,type:"mixed",ans:[w*d,n],ansTex:mixTex(w*d,n),hint:`$${w} \\div \\tfrac{${n}}{${d}} = ${w} \\times \\tfrac{${d}}{${n}}$.`,sol:[`$${w} \\times \\tfrac{${d}}{${n}} = \\tfrac{${w*d}}{${n}} = ${mixTex(w*d,n)}$ pieces.`]}; }
 ]},
 {id:"ratio",title:"Ratios",idea:"A <b>ratio</b> compares two quantities: $a$ to $b$, $a : b$, or $\\frac{a}{b}$. <b>Part-to-part</b> compares two groups; <b>part-to-whole</b> compares a group to the total. Simplify like a fraction.",
  lesson:{steps:[["\\text{12 dogs, 18 cats}","Part-to-part: dogs to cats."],["12 : 18 = 2 : 3","Divide both by $6$."],["\\text{dogs to all pets} = 12 : 30 = 2 : 5","Part-to-whole uses the total."]],warn:"Order matters: dogs to cats is $2 : 3$, but cats to dogs is $3 : 2$."},
  gen:[
  ()=>{ const a=rnd(2,12),b=rnd(2,12),A=pick(["red","blue","green"]),B=pick(["yellow","white","purple"]); return {q:`A bag has $${a}$ ${A} marbles and $${b}$ ${B} marbles. Write the ratio of ${A} to ${B} marbles. (Type like 3:5.)`,type:"ratio",ans:[a,b],ansTex:`${a} : ${b}`,hint:"First quantity : second quantity.",sol:[`${A} : ${B} $= ${a} : ${b}$${gcd(a,b)>1?` $= ${a/gcd(a,b)} : ${b/gcd(a,b)}$`:""}.`]}; },
  ()=>{ const g=rnd(2,9); let x,y; do{ x=rnd(1,9); y=rnd(1,9); }while(x===y||gcd(x,y)!==1); return {q:`Write $${g*x} : ${g*y}$ in simplest form.`,type:"ratio",simp:true,ans:[x,y],ansTex:`${x} : ${y}`,hint:"Divide both numbers by their GCF.",sol:[`GCF $= ${g}$: $${g*x} : ${g*y} = ${x} : ${y}$.`]}; },
  ()=>{ const b=rnd(5,15),g=rnd(5,15); return {q:`A class has $${b}$ boys and $${g}$ girls. What is the ratio of girls to <b>all students</b>, in simplest form?`,type:"ratio",simp:true,ans:[g/gcd(g,b+g),(b+g)/gcd(g,b+g)],ansTex:`${g/gcd(g,b+g)} : ${(b+g)/gcd(g,b+g)}`,hint:"Part-to-whole: use the total number of students.",sol:[`Total: $${b+g}$. Girls : total $= ${g} : ${b+g}$${gcd(g,b+g)>1?` $= ${g/gcd(g,b+g)} : ${(b+g)/gcd(g,b+g)}$`:""}.`]}; },
  ()=>{ let x,y; do{ x=rnd(1,7); y=rnd(1,7); }while(x===y||gcd(x,y)!==1); const k=rnd(3,12),A=pick(["juice","paint","sand"]); return {q:`The ratio of boys to girls in a club is $${x} : ${y}$. There are $${(x+y)*k}$ members. How many are girls?`,type:"number",ans:y*k,ansTex:`${y*k}`,hint:`There are $${x+y}$ equal parts in all.`,sol:[`One part: $${(x+y)*k} \\div ${x+y} = ${k}$.`,`Girls: $${y} \\times ${k} = ${y*k}$.`]}; },
  ()=>{ let x,y; do{ x=rnd(1,5); y=rnd(x+1,8); }while(gcd(x,y)!==1); const k=rnd(2,6); return {q:`A box has red and blue cubes in the ratio $${x} : ${y}$. There are $${x*k}$ red cubes. How many <b>more</b> red cubes must be added so the ratio becomes $1 : 1$?`,type:"number",ans:(y-x)*k,ansTex:`${(y-x)*k}`,hint:"Find the number of blue cubes first.",sol:[`Blue: $${y} \\times ${k} = ${y*k}$.`,`Need $${y*k} - ${x*k} = ${(y-x)*k}$ more red cubes.`]}; }
 ]},
 {id:"rtab",title:"Ratio Tables & Double Number Lines",idea:"Equivalent ratios come from <b>multiplying or dividing both</b> quantities by the same number. A ratio table or a double number line keeps the pairs lined up.",
  lesson:{steps:[["3 \\text{ cups flour} : 2 \\text{ eggs}","The recipe ratio."],["\\times 4:\\quad 12 \\text{ cups} : 8 \\text{ eggs}","Multiply both by $4$."],["\\div 2:\\quad 6 \\text{ cups} : 4 \\text{ eggs}","Dividing works too."]],warn:"Adding the same number to both does <b>not</b> keep the ratio: $3 : 2$ is not the same as $4 : 3$."},
  gen:[

  ()=>{ const a=rnd(2,9),b=rnd(2,9),k=rnd(2,6); return {q:`Complete: $${a*k} : ${b*k} = \\square : ${b}$.`,type:"number",ans:a,ansTex:`${a}`,hint:`$${b*k}$ was divided by $${k}$.`,sol:[`$${a*k} \\div ${k} = ${a}$.`]}; },
  ()=>{ const a=rnd(2,6),b=rnd(3,12),k=rnd(4,7); const top=[0,a,2*a,3*a,k*a],bot=[0,b,2*b,3*b,"?"]; const W=380; let o=`<line x1="20" y1="30" x2="360" y2="30" stroke="#16233B" stroke-width="2"/><line x1="20" y1="80" x2="360" y2="80" stroke="#16233B" stroke-width="2"/>`; top.forEach((t,i)=>{ const x=20+i*85; o+=`<line x1="${x}" y1="24" x2="${x}" y2="36" stroke="#16233B"/><line x1="${x}" y1="74" x2="${x}" y2="86" stroke="#16233B"/>`+TX(x,18,t)+TX(x,102,bot[i],bot[i]==="?"?'font-weight="700" fill="#B3261E"':""); }); o+=TX(372,34,"gal",'font-size="11" text-anchor="start"')+TX(372,84,"$",'font-size="11"'); return {q:`${SV(W,110,o,"double number line")}The double number line shows the cost of gas. How much do $${k*a}$ gallons cost (in dollars)?`,type:"number",ans:k*b,ansTex:`${k*b}`,hint:`Every $${a}$ gallons cost $${b}$ dollars.`,sol:[`$${k*a} = ${k} \\times ${a}$, so the cost is $${k} \\times ${b} = ${k*b}$ dollars.`]}; },
  ()=>{ const a=rnd(2,6),b=rnd(2,9),j=rnd(2,5),k=rnd(2,5); return {q:`In a ratio table, $${a*j}$ goes with $${b*j}$, and $${a*k}$ goes with $${b*k}$. What goes with $${a*(j+k)}$?`,type:"number",ans:b*(j+k),ansTex:`${b*(j+k)}`,hint:"You can add two rows of a ratio table.",sol:[`$${a*j} + ${a*k} = ${a*(j+k)}$, so add the partners: $${b*j} + ${b*k} = ${b*(j+k)}$.`]}; },
  ()=>{ const a=pick([4,6,8,10,12]),b=pick([3,5,7,9]),c=a/2*pick([3,5,7]); const x=b*c/a; return {q:`$${a} : ${b} = ${c} : x$. Find $x$. (It may be a decimal.)`,type:"number",ans:x,ansTex:`${x}`,hint:`Find the unit rate: how much goes with $1$? ($${b} \\div ${a}$)`,sol:[`Each $1$ goes with $${b} \\div ${a} = ${b/a}$.`,`$${c} \\times ${b/a} = ${x}$.`]}; }
 ]},
 {id:"rate",title:"Unit Rates",idea:"A <b>rate</b> compares two different units (miles per hour, dollars per pound). A <b>unit rate</b> tells how much for <b>one</b>: divide the first quantity by the second.",
  lesson:{steps:[["\\$4.50 \\text{ for } 6 \\text{ apples}","Want the price of one."],["4.50 \\div 6 = 0.75","Divide money by apples."],["\\$0.75 \\text{ per apple}","Use it: $10$ apples cost $10 \\times 0.75 = \\$7.50$."]],warn:"To compare deals, compare <b>unit prices</b> — the lower price per unit is the better buy."},
  gen:[
  ()=>{ const r=rnd(25,70),h=rnd(2,9); return {q:`A car travels $${r*h}$ miles in $${h}$ hours. What is its speed in miles per hour?`,type:"number",ans:r,ansTex:`${r}`,hint:"Miles ÷ hours.",sol:[`$${r*h} \\div ${h} = ${r}$ mph.`]}; },
  ()=>{ const u=rnd(15,250)/100,n=rnd(3,12); return {q:`$${n}$ cans of soup cost $\\$${(u*n).toFixed(2)}$. What is the price per can?`,type:"number",ans:dp(u),ansTex:`\\$${u.toFixed(2)}`,hint:"Total cost ÷ number of cans.",sol:[`$${(u*n).toFixed(2)} \\div ${n} = ${u.toFixed(2)}$.`]}; },
  ()=>{ let a,b,u,v; do{ a=rnd(3,8); b=rnd(9,16); u=rnd(40,150)/100; v=rnd(40,150)/100; }while(Math.abs(u-v)<0.03); const A=`$${a}$ for $\\$${(a*u).toFixed(2)}$`,B=`$${b}$ for $\\$${(b*v).toFixed(2)}$`; const best=u<v?"A":"B"; return {q:`Which is the better buy for granola bars? <br>A: ${A} &nbsp;&nbsp; B: ${B} <br>(Type A or B.)`,type:"mc",ans:best,ansTex:`\\text{${best}}`,hint:"Find the price per bar for each.",sol:[`A: $${(a*u).toFixed(2)} \\div ${a} = ${u.toFixed(2)}$ per bar. B: $${(b*v).toFixed(2)} \\div ${b} = ${v.toFixed(2)}$ per bar.`,`${best} is cheaper per bar.`]}; },
  ()=>{ const r=rnd(3,12),h=rnd(2,6),t=rnd(7,20); return {q:`A printer prints $${r*h}$ pages in $${h}$ minutes. At the same rate, how many pages does it print in $${t}$ minutes?`,type:"number",ans:r*t,ansTex:`${r*t}`,hint:"Find the unit rate (pages per minute) first.",sol:[`$${r*h} \\div ${h} = ${r}$ pages per minute.`,`$${r} \\times ${t} = ${r*t}$ pages.`]}; },
  ()=>{ const pr=pick([[3,6,2],[4,12,3],[6,3,2],[2,3,1.2],[4,4,2],[6,12,4],[10,15,6],[3,3,1.5]]); return {q:`${nm()} can paint a fence in $${pr[0]}$ hours. ${nm()} can paint the same fence in $${pr[1]}$ hours. Working together, how many hours will it take?`,type:"number",ans:pr[2],ansTex:`${pr[2]}`,hint:`Unit rates: each hour, one paints $\\frac{1}{${pr[0]}}$ of the fence and the other $\\frac{1}{${pr[1]}}$.`,sol:[`Together: $\\frac{1}{${pr[0]}} + \\frac{1}{${pr[1]}}$ of the fence per hour $= \\frac{1}{${pr[2]}}$.`,`So it takes $${pr[2]}$ hours.`]}; }
 ]},
 {id:"pct",title:"Percents",idea:"<b>Percent</b> means “per $100$”: $35\\% = \\frac{35}{100} = 0.35$. To find a percent of a number, multiply. To find the whole from a part, divide the part by the percent.",
  lesson:{steps:[["25\\% \\text{ of } 80","$25\\% = \\frac14$."],["\\tfrac14 \\times 80 = 20","Or $0.25 \\times 80 = 20$."],["15 \\text{ is } 30\\% \\text{ of } ? \\Rightarrow 15 \\div 0.30 = 50","Part ÷ percent = whole."]],warn:"$\\%$ of a number is never bigger than the number unless the percent is over $100\\%$."},
  gen:[

 {id:"apt",title:"Area of Parallelograms & Triangles",idea:"Cut a triangle off a parallelogram and slide it over: you get a rectangle, so $A = bh$. A triangle is <b>half</b> a parallelogram: $A = \\tfrac12 bh$. The height is always <b>perpendicular</b> to the base.",

/* ================= checking ================= */
const CONST=new Set(["pi","e","E","PI","Infinity"]);
function clean(s){ return String(s).replace(/(\d),(?=\d{3}(?!\d))/g,"$1").replace(/(^|[^a-z])([a-z])\s*\(/gi,"$1$2*(").replace(/[−–]/g,"-").replace(/×|·/g,"*").replace(/÷/g,"/").replace(/π/g,"pi").replace(/≤|=</g,"<=").replace(/≥|=>/g,">=").replace(/√\s*(\d+(?:\.\d+)?|\([^)]*\)|[a-z])/g,"sqrt($1)").trim(); }
function val(s){ try{ const r=math.evaluate(s); const v=typeof r==="number"?r:(r&&typeof r.valueOf()==="number"?r.valueOf():NaN); return isFinite(v)?v:NaN; }catch(e){ return NaN; } }
const close=(a,b)=>Math.abs(a-b)<1e-6*Math.max(1,Math.abs(b));
function varsOf(node){ const v=new Set(); node.traverse((n,path,parent)=>{ if(n.isSymbolNode&&!(parent&&parent.isFunctionNode&&path==="fn")&&!CONST.has(n.name)&&typeof math[n.name]!=="function") v.add(n.name); }); return [...v]; }
function evalAt(node,sc){ try{ const r=node.evaluate(sc); const v=typeof r==="number"?r:(r&&typeof r.valueOf()==="number"?r.valueOf():NaN); return isFinite(v)?v:NaN; }catch(e){ return NaN; } }
function exprEq(student,expected,form){
  let s=clean(student); if(s.includes("=")) s=s.split("=").pop();
  let S,E; try{ S=math.parse(s); E=math.parse(expected); }catch(e){ return null; }
  if(form&&form!=="combined"&&!formOK(S,s,form)) return false;
  if(form==="combined"){ if(s.includes("(")) return false; const cnt={}; S.traverse((n,path,parent)=>{ if(n.isSymbolNode&&!(parent&&parent.isFunctionNode&&path==="fn")&&!CONST.has(n.name)) cnt[n.name]=(cnt[n.name]||0)+1; }); if(Object.values(cnt).some(c=>c>1)) return false; }
  const vars=[...new Set([...varsOf(S),...varsOf(E)])]; let t=0;
  for(let k=0;k<12&&t<6;k++){ const sc={}; vars.forEach(v=>sc[v]=Math.round((Math.random()*6-3)*1000)/1000+0.137+(k%2)); const a=evalAt(S,sc),b=evalAt(E,sc); if(isNaN(a)||isNaN(b)) continue; t++; if(!close(a,b)) return false; }
  return t>=3?true:null;
}
function lineEq(student,expected,form){
  const s=clean(student); if(s.split("=").length!==2) return null;
  const [L,R]=s.split("="); if(!L.trim()||!R.trim()) return null;
  let S,E; try{ S=math.parse("("+L+")-("+R+")"); const [eL,eR]=expected.split("="); E=math.parse("("+eL+")-("+eR+")"); }catch(e){ return null; }
  if(form==="si"&&L.replace(/\s/g,"")!=="y") return false;
  if(form==="std"){ if(s.includes("/")) return false; try{ if(varsOf(math.parse(R)).length) return false; }catch(e){ return null; } }
  let ratio=null,t=0;
  for(let k=0;k<14&&t<6;k++){ const sc={x:Math.round((Math.random()*8-4)*1000)/1000+0.31,y:Math.round((Math.random()*8-4)*1000)/1000+0.17}; const a=evalAt(S,sc),b=evalAt(E,sc); if(isNaN(a)||isNaN(b)) continue; t++;
    if(Math.abs(b)<1e-9){ if(Math.abs(a)>1e-6) return false; continue; } const r=a/b; if(Math.abs(r)<1e-9) return false; if(ratio===null) ratio=r; else if(!close(r,ratio)) return false; }
  return t>=3?true:null;
}
function radOK(input){ const t=clean(input).replace(/\s+/g,""); if(/\/\(?\*?sqrt/.test(t)) return false; const args=[...t.matchAll(/sqrt\(([^)]*)\)/g)].map(m=>m[1]); for(const a of args){ const n=Number(a); if(!Number.isInteger(n)||n<2) return false; if(radParts(n)[0]!==1) return false; } return true; }
function parseRoots(s){ s=clean(s).replace(/\+\/-|\+-/g,"±").replace(/\b(or|and)\b/gi,",").replace(/;/g,","); const out=[];
  for(let part of s.split(",")){ part=part.trim(); if(!part) continue; if(part.includes("=")) part=part.split("=").pop().trim();
    if(part.includes("±")){ const i=part.indexOf("±"), L=part.slice(0,i).trim(), R=part.slice(i+1).trim();
      if(/^\(/.test(L)&&/\)\s*\/\s*.+$/.test(R)){ const den=R.slice(R.lastIndexOf(")")+1), inner=R.slice(0,R.lastIndexOf(")")), l=L.slice(1)||"0"; out.push(val("("+l+"+("+inner+"))"+den),val("("+l+"-("+inner+"))"+den)); }
      else { const l=L||"0"; out.push(val(l+"+("+R+")"),val(l+"-("+R+")")); } }
    else out.push(val(part)); }
  return out.length&&out.every(v=>!isNaN(v))?out:null; }
function topTerms(n,out){ while(n.isParenthesisNode) n=n.content; if(n.isOperatorNode&&(n.fn==="add"||n.fn==="subtract")){ n.args.forEach(a=>topTerms(a,out)); } else if(n.isOperatorNode&&n.fn==="unaryMinus"){ topTerms(n.args[0],out); } else out.push(n); return out; }
function strip(n){ while(n&&n.isParenthesisNode) n=n.content; return n; }
function isSum(n){ n=strip(n); return n.isOperatorNode&&(n.fn==="add"||n.fn==="subtract"); }
function factorsOf(n){ n=strip(n); if(n.isOperatorNode&&n.fn==="unaryMinus") return factorsOf(n.args[0]); if(n.isOperatorNode&&n.fn==="multiply") return n.args.flatMap(factorsOf); if(n.isOperatorNode&&n.fn==="pow"&&isSum(n.args[0])) return [strip(n.args[0])]; return [n]; }
function coeffsX(node){ const ys=[0,1,2,3,4].map(x=>evalAt(node,{x})); if(ys.some(isNaN)) return null; const c=[]; let d=ys.slice(); const fact=[1,1,2,6,24]; const diffs=[];
  for(let k=0;k<5;k++){ diffs.push(d[0]); d=d.slice(1).map((v,i)=>v-d[i]); }
  if(Math.abs(diffs[4])>1e-9) return null; // degree <= 3 expected
  // Newton forward form -> standard coefficients
  const P=[[1],[0,1],[0,-1,1],[0,2,-3,1]]; const res=[0,0,0,0]; for(let k=0;k<4;k++){ const f=diffs[k]/fact[k]; P[k].forEach((v,i)=>res[i]+=f*v); }
  return res.map(v=>Math.round(v*1e6)/1e6); }
function formOK(S,s,form){
  if(form==="simp"){ if(/\)\s*\^/.test(s)||/\^\s*-|\^\(-/.test(s)) return false; const cnt={}; S.traverse((n,path,parent)=>{ if(n.isSymbolNode&&!(parent&&parent.isFunctionNode&&path==="fn")&&!CONST.has(n.name)) cnt[n.name]=(cnt[n.name]||0)+1; }); return !Object.values(cnt).some(c=>c>1); }
  if(form==="poly"){ if(s.includes("(")) return false; const degs=topTerms(S,[]).map(t=>{ const a=evalAt(t,{x:1.5}),b=evalAt(t,{x:3}); if(isNaN(a)||Math.abs(a)<1e-12) return null; return Math.round(Math.log(Math.abs(b/a))/Math.log(2)); }); if(degs.some(d=>d===null)) return false; return new Set(degs).size===degs.length; }
  if(form==="factored"){ const f=factorsOf(S); if(f.length<2||!f.some(isSum)) return false;

function drawLesson(){
  const t=CH.topics[LI], l=t.lesson, box=$("lesson");
  box.innerHTML=`<span class="label">Lesson ${LI+1} of ${CH.topics.length}</span><h2>${t.title}</h2><div class="big">${t.idea}</div>${l.fig||""}<span class="label">👀 Watch me — simplest example</span><p class="watch">I'll solve it one step at a time. Read each step and think about <b>why</b>. When it makes sense, press <b>Got it — next step</b>.</p><ol class="steps">${l.steps.slice(0,shown).map(s=>`<li><div><div class="m">$${s[0]}$</div><div class="w">${s[1]}</div></div></li>`).join("")}</ol>`;
  if(shown<l.steps.length){ const b=document.createElement("button"); b.className="btn"; b.style.alignSelf="flex-start"; b.textContent="Got it — next step →"; b.onclick=()=>{ shown++; drawLesson(); }; box.appendChild(b);
    const s=document.createElement("button"); s.className="btn ghost sm"; s.style.alignSelf="flex-start"; s.textContent="Show all steps at once"; s.onclick=()=>{ shown=l.steps.length; drawLesson(); }; box.appendChild(s); }
  else {
    box.insertAdjacentHTML("beforeend",`<div class="warn"><b>Watch out: </b>${l.warn}</div>`);
    if(!TP) TP=t.gen[0]();
    const w=document.createElement("div"); w.className="turn";
    w.innerHTML=`<span class="label" style="color:var(--gold)">Your turn</span><div class="q">${TP.q}</div><div class="row"><input type="text" id="tAns" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><button class="btn" id="tChk">Check</button><button class="btn ghost" id="tHint">Hint</button></div><div class="howto">${HOW[TP.type]}</div><div id="tFb"></div>`;
    box.appendChild(w);
    const nav=document.createElement("div"); nav.className="lnav"; const left=document.createElement("div"); left.className="row";
    if(LI>0){ const pv=document.createElement("button"); pv.className="btn ghost sm"; pv.textContent="← Previous lesson"; pv.onclick=()=>openLesson(LI-1,true); left.appendChild(pv); }
    const right=document.createElement("div"); right.className="row"; right.id="tNext"; nav.append(left,right); box.appendChild(nav);
    const fbx=(k,tag,h)=>{ $("tFb").innerHTML=`<div class="fb ${k}"><span class="tag">${tag}</span>${h}</div>`; render($("tFb")); };
    const win=()=>{ tDone=true; st.learned[t.id]=true; save(); road(); $("tAns").disabled=true; $("tChk").disabled=true; $("tHint").disabled=true; showNext(); };
    const go=()=>{ if(tDone) return; const v=$("tAns").value.trim(); if(!v) return; const r=check(TP,v);
      if(r===null){ fbx("hint","Try again","I couldn't read that. "+HOW[TP.type]); return; }
      if(r){ fbx("good","Correct — you've got it!",`$${TP.ansTex}$`); win(); return; }
      tTries++; if(tTries<2) fbx("bad","Not yet",TP.hint+" Try again."); else { fbx("hint","Answer",`$${TP.ansTex}$. Try another one to make sure.`); const a=document.createElement("button"); a.className="btn ghost sm"; a.textContent="Try another"; a.onclick=()=>{ TP=t.gen[0](); tTries=0; drawLesson(); }; $("tFb").appendChild(a); } };
    $("tChk").onclick=go; $("tAns").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } }); $("tHint").onclick=()=>fbx("hint","Hint",TP.hint);
    if(st.learned[t.id]) showNext();
  }
  render(box);
}
function showNext(){ const r=$("tNext"); if(!r) return; r.innerHTML=""; const t=CH.topics[LI];
  const pr=document.createElement("button"); pr.className="btn ghost sm"; pr.textContent="Practice this topic"; pr.onclick=()=>{ setTab("practice"); startPractice(t,st.level[t.id]||st.rec||1); }; r.appendChild(pr);
  const n=document.createElement("button"); n.className="btn teal sm";
  if(LI<CH.topics.length-1){ n.textContent="Next lesson →"; n.onclick=()=>openLesson(LI+1,true); } else { n.textContent="Start practicing →"; n.onclick=()=>{ setTab("practice"); window.scrollTo({top:0,behavior:"smooth"}); }; }
  r.appendChild(n); }
function setTab(t){ $("learnView").hidden=t!=="learn"; $("practiceView").hidden=t!=="practice"; $("tabLearn").classList.toggle("on",t==="learn"); $("tabPractice").classList.toggle("on",t==="practice"); try{ history.replaceState(null,"","#"+CH.id+"-"+t); }catch(e){} }
function openChapter(id,tab){
  useChapter(id); $("chTitle").textContent="Unit "+ALLCH.find(c=>c[2]===CH.id)[0]+": "+CH.title; $("practice").hidden=true;
  chapters(); recText(); topics(); const first=CH.topics.findIndex(t=>!st.learned[t.id]); openLesson(first<0?0:first);
  setTab(tab||(first<0?"practice":"learn")); }
document.addEventListener("click",e=>{ const d=e.target.closest(".mc > div"); if(!d) return; const card=d.closest(".practice, .turn, .modal .card"); const inp=card&&card.querySelector("input[type=text]"); if(inp&&!inp.disabled){ inp.value=d.querySelector("b").textContent.trim()[0]; inp.focus(); d.parentElement.querySelectorAll("div").forEach(x=>x.classList.toggle("sel",x===d)); } });
$("tabLearn").onclick=()=>setTab("learn"); $("tabPractice").onclick=()=>setTab("practice");
window.addEventListener("load",()=>{ legend(); const m=/^#(ch\d+)(?:-(learn|practice))?$/.exec(location.hash); openChapter(m?m[1]:ST.cur,m?m[2]:null); });
</script>
