<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --ink:#16233B; --muted:#5B6474; --faint:#8C93A0; --line:#E8E2D8;
  --navy:#1F3A68; --teal:#0F7C7C; --teal-soft:#DDF0EE; --gold:#C9962B; --gold-soft:#FBF1DC; --red:#B3261E; --red-soft:#FBE7E5; --green:#1E7A45; --green-soft:#DDF4E6;
  --l1:#2E8B57; --l2:#0F7C7C; --l3:#1F3A68; --l4:#B7472A; --l5:#6A4BD8;
  --radius:18px; --shadow:0 8px 26px rgba(22,35,59,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
header.top .in{max-width:1120px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:24px}
.brand{font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--teal)}
.back{margin-left:auto;font-size:15px;text-decoration:none;color:var(--muted);font-weight:500}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 48px;display:flex;flex-direction:column;gap:20px}
.intro h1{font-size:clamp(28px,4vw,40px)}
.intro p{color:var(--muted);margin:6px 0 0;max-width:680px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;font-weight:600;border:1px solid transparent;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
.btn.teal{background:var(--teal)} .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus{outline:2px solid var(--teal);outline-offset:1px}
/* level legend */
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lg{border-radius:12px;padding:10px 12px;background:var(--bg);border-left:4px solid var(--c)}
.lg b{display:block;font-size:14px;color:var(--c)} .lg span{font-size:13px;color:var(--muted)}
/* placement */
.place{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--teal-soft),#fff 70%);border:1.5px solid var(--teal)}
.place .t b{font-family:Fraunces,Georgia,serif;font-size:20px;display:block}
.place .t span{color:var(--muted);font-size:15px}
.rec{font-weight:600;color:var(--teal)}
/* topics */
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.topics{grid-template-columns:minmax(0,1fr)}}
.topic{display:flex;flex-direction:column;gap:12px}
.topic h2{font-size:22px}
.idea{color:var(--muted);font-size:15px;margin:0}
.example{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;overflow-x:auto}
.example .q{font-size:17px;margin-bottom:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--c)}
.pill.on{background:var(--c);border-color:var(--c);color:#fff}
.pill .n{font-weight:500;opacity:.75;margin-left:4px}
.pill.star::after{content:"★";position:absolute;top:-8px;right:-4px;font-size:12px;color:var(--gold)}
/* practice */
.practice{display:flex;flex-direction:column;gap:14px;scroll-margin-top:80px}
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.phead h2{font-size:24px}
.problem{font-size:clamp(19px,2.6vw,24px);padding:16px 18px;border-radius:14px;background:var(--bg);overflow-x:auto;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 240px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--bg)}
.preview{font-size:18px;min-height:1.4em}
.preview .pl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;margin-right:8px}
.howto{font-size:13px;color:var(--faint)}
.fb{border-radius:12px;padding:10px 14px;font-size:15px;overflow-x:auto}
.fb.good{background:var(--green-soft)} .fb.bad{background:var(--red-soft)} .fb.hint{background:var(--gold-soft)}
.fb .tag{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.fb.good .tag{color:var(--green)} .fb.bad .tag{color:var(--red)} .fb.hint .tag{color:var(--gold)}
.sol{margin:6px 0 0;padding-left:20px} .sol li{margin:2px 0}
.suggest{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1.5px dashed var(--c);border-radius:12px;padding:10px 14px}
.streak{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--faint)}
.streak i{width:10px;height:10px;border-radius:50%;background:var(--line)} .streak i.ok{background:var(--green)} .streak i.no{background:var(--red)}
/* modal quiz */
.modal{position:fixed;inset:0;background:rgba(22,35,59,.45);display:grid;place-items:center;padding:16px;z-index:60}
.modal .card{width:min(620px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.qprog{display:flex;gap:6px} .qprog i{flex:1;height:6px;border-radius:3px;background:var(--line)} .qprog i.ok{background:var(--green)} .qprog i.no{background:var(--red)} .qprog i.now{background:var(--teal)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:none;background:none;padding:10px 16px;font-weight:600;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.learn,.pview{display:flex;flex-direction:column;gap:20px}
.road{display:flex;gap:8px;flex-wrap:wrap}
.stop{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.stop i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px;border:1.5px solid var(--line)}
.stop.done i{background:var(--green);border-color:var(--green);color:#fff}
.stop.on{border-color:var(--teal);background:var(--teal-soft)}
.lesson{display:flex;flex-direction:column;gap:16px;scroll-margin-top:80px}
.lesson h2{font-size:clamp(24px,3vw,30px)}
.big{font-size:18px;background:var(--teal-soft);border-radius:14px;padding:14px 16px;overflow-x:auto}
.big b{color:var(--teal)}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;counter-reset:k}
.steps li{counter-increment:k;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;background:var(--bg);border-radius:12px;padding:10px 12px;animation:pop .25s ease}
.steps li::before{content:counter(k);width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps .m{font-size:19px;overflow-x:auto} .steps .w{font-size:14px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.steps li{animation:none}}
.warn{background:var(--red-soft);border-radius:14px;padding:12px 16px;font-size:15px;overflow-x:auto}
.warn b{color:var(--red)}
.turn{border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.turn .q{font-size:19px;overflow-x:auto}
.lnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
footer{text-align:center;color:var(--faint);font-size:13px;padding:24px}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chap{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chap i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px}
.chap.on{background:var(--navy);border-color:var(--navy);color:#fff} .chap.on i{background:rgba(255,255,255,.2)}
.chap.soon{opacity:.45;cursor:default}
.fig{display:block;width:100%;max-width:360px;height:auto;margin:4px 0 8px}
.problem .fig{max-width:340px}
.mc{display:grid;gap:6px;margin-top:10px;font-size:.92em}
.mc div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mc div{cursor:pointer} .mc div:hover{border-color:var(--teal)} .mc div.sel{border-color:var(--teal);background:var(--teal-soft)}

/* ---- left sidebar for chapters (wide screens) ---- */
.lv-main{display:contents}
.lv-main>.intro{order:-1}
@media (min-width:720px){
  .wrap{max-width:1320px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start;padding-left:14px;padding-right:14px}
  .lv-main{display:flex;flex-direction:column;gap:20px;min-width:0}
  .wrap>.chapters{position:sticky;top:16px;flex-direction:column;flex-wrap:nowrap;gap:2px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
  .wrap>.chapters::before{content:attr(aria-label);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:4px 8px 8px}
  .wrap>.chapters .chap{border:0;border-radius:10px;background:transparent;padding:8px 8px;font-size:14px;line-height:1.3;text-align:left;width:100%;align-items:flex-start}
  .wrap>.chapters .chap i{flex:0 0 auto;min-width:24px;width:auto;padding:0 5px;height:24px;border-radius:12px}
  .wrap>.chapters .chap:hover{background:var(--bg)}
  .wrap>.chapters .chap.on{background:var(--navy);color:#fff}
}
@media (min-width:1050px){ .wrap{grid-template-columns:260px minmax(0,1fr);gap:28px;padding-left:20px;padding-right:20px} }

/* ---- compact level bar: one level for the whole chapter ---- */
.lvbar{display:flex;flex-direction:column;gap:10px;padding:14px 18px}
.lvtop{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.lvtop>.label{margin:0}
.lvchips{display:flex;flex-wrap:wrap;gap:6px}
.lvc{position:relative;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.2}
.lvc i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--bg);color:var(--c)}
.lvc:hover{border-color:var(--c)}
.lvc.on{background:var(--c);border-color:var(--c);color:#fff}
.lvc.on i{background:rgba(255,255,255,.25);color:#fff}
.lvc.star::after{content:"★";position:absolute;top:-7px;right:-3px;font-size:11px;color:var(--gold)}
.lvsub{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;font-size:14px;color:var(--muted)}
.lvsub b{color:var(--ink)}
.lvsub .lvplace{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#pLevels{display:none}
.topic .tgo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topic .tgo small{color:var(--muted);font-size:13px}
</style>

<script>
"use strict";
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let x;do{x=rnd(a,b)}while(x===0);return x};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const sg=k=>k>=0?"+ "+k:"- "+(-k);            // "+ 3" / "- 3"
const P=n=>n<0?"("+n+")":String(n);            // wrap negatives
function co(a,v){ return (a===1?"":a===-1?"-":String(a))+v; }   // coefficient with variable
function lin(a,b,v="x"){ if(a===0) return String(b); let s=co(a,v); if(b) s+=" "+sg(b); return s; }
function cterm(a,v){ return (a<0?"- ":"+ ")+(Math.abs(a)===1?"":Math.abs(a))+v; } // signed term for middle
function frac(n,d){ if(d<0){n=-n;d=-d} const g=gcd(n,d)||1; n/=g; d/=g; return d===1?String(n):(n<0?"-":"")+"\\frac{"+Math.abs(n)+"}{"+d+"}"; }
const OPT={"<":"<","<=":"\\le",">":">",">=":"\\ge"}; const FLIP={"<":">","<=":">=",">":"<",">=":"<="};
const pt=(x,y)=>`(${x}, ${y})`;
const sq2=h=>`(x ${sg(-h)})^2`;
function ptex(cs,v="x"){ const n=cs.length-1; let t=""; cs.forEach((c,i)=>{ const d=n-i; if(!c) return; const a=Math.abs(c), vv=d===0?"":d===1?v:v+"^{"+d+"}", cf=(a===1&&d>0)?"":String(a); t+=t?(c<0?" - ":" + "):(c<0?"-":""); t+=cf+vv; }); return t||"0"; }
function pstr(cs){ const n=cs.length-1; return cs.map((c,i)=>`(${c})*x^${n-i}`).join("+"); }
function pmul(a,b){ const r=Array(a.length+b.length-1).fill(0); a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y)); return r; }
function radParts(n){ let k=1,m=n; for(let i=Math.floor(Math.sqrt(n));i>1;i--){ if(n%(i*i)===0){ k=i; m=n/(i*i); break; } } return [k,m]; }
function rad(n){ const [k,m]=radParts(n); return m===1?String(k):(k===1?"":k)+"\\sqrt{"+m+"}"; }
function radTex(c,n){ const [k,m]=radParts(n); const K=c*k; return m===1?String(K):(K===1?"":K)+"\\sqrt{"+m+"}"; }
const divisors=n=>{n=Math.abs(n);const d=[];for(let i=1;i<=n;i++) if(n%i===0) d.push(i);return d;};
const LEVELS=[
 {n:1,name:"Foundation",zh:"起步",desc:"Review the basics first",c:"var(--l1)"},
 {n:2,name:"Basic",zh:"基础",desc:"Textbook examples",c:"var(--l2)"},
 {n:3,name:"Standard",zh:"标准",desc:"School test level",c:"var(--l3)"},
 {n:4,name:"Challenge",zh:"挑战",desc:"Honors / hard SAT",c:"var(--l4)"},
 {n:5,name:"Competition",zh:"竞赛",desc:"MATHCOUNTS / AMC 8–10 style",c:"var(--l5)"}];
const HOW={point:"Type an ordered pair like (3, -2). Vectors can be typed like <3, -2>. Radicals are fine: 2sqrt(3).",cplx:"Type a complex number like 3-2i (fractions are fine).",croots:"List every solution separated by commas, like 2+3i, 2-3i (± is fine: 2±3i).",matrix:"Type the matrix row by row, like [[1, 2], [3, 4]] or 1 2; 3 4.",mc:"Click a choice or type its letter, then press Check.",word:"Type your answer as a word or abbreviation.",roots:"Give every solution, separated by commas: 3, -2. Use sqrt(5) for √5; ± is fine: 2±sqrt(3).",nsol:"Type one, none, or infinitely many.",point:"Type a point like (2, -5).",yn:"Type yes or no.",list:"List the values separated by commas, like -2, 0, 5.",line:"Type an equation like y = 2x + 3 (any correct form works).",number:"Type a number. Fractions like 9/4 are fine.",set:"Type the value, like 4 or x = 4.",expr:"Type an expression like 7x - 1 or (c - b)/a.",
  ineq:"Type like x > 3 or x <= -2 (≤ and ≥ work too).",between:"Type like -2 < x <= 4.",or:"Type like x < -5 or x > 3."};
const ineqTex=(op,v)=>`x ${OPT[op]} ${v}`;

/* ================= chapters =================
   generators return {q, type, ans, ansTex, hint, sol[]} */
const sq=(h,v="x")=>h===0?v+"^2":"("+v+" "+sg(-h)+")^2";
const deg=v=>`${v}^\\circ`;
function mcQ(stem,correct,wrong,hint,sol){ const opts=[correct,...wrong].map((t,i)=>({t,ok:i===0})).sort(()=>Math.random()-.5); const L="ABCDE"; const ans=L[opts.findIndex(o=>o.ok)];
  return {q:`${stem}<div class="mc">${opts.map((o,i)=>`<div><b>${L[i]}.</b> ${o.t}</div>`).join("")}</div>`,type:"mc",ans,ansTex:`\\text{${ans}}`,hint,sol:[...sol,`Answer: <b>${ans}</b>.`]}; }
const fact=n=>n<=1?1:n*fact(n-1); const nPr=(n,r)=>fact(n)/fact(n-r), nCr=(n,r)=>fact(n)/(fact(r)*fact(n-r));
const r2=v=>Math.round(v*100)/100, r1=v=>Math.round(v*10)/10;
const cx=(a,b)=>b===0?String(a):(a===0?"":a+(b>0?" + ":" - "))+(a===0&&b<0?"-":"")+(Math.abs(b)===1?"":Math.abs(b))+"i";
const fr=(n,d)=>frac(n,d);
function piTex(n,d){ if(d<0){n=-n;d=-d} if(n===0) return "0"; const g=gcd(n,d)||1; n/=g; d/=g; const top=(n===1?"":n===-1?"-":n)+"\\pi"; return d===1?top:(n<0?"-":"")+"\\dfrac{"+(Math.abs(n)===1?"":Math.abs(n))+"\\pi}{"+d+"}"; }
function numTex(v){ if(Math.abs(v)<1e-12) return "0"; const s=v<0?"-":"", a=Math.abs(v);
  for(const b of [1,2,3,5,6,7,10,11,13]) for(let q=1;q<=100;q++){ const k=a*q/Math.sqrt(b), kr=Math.round(k); if(kr>0&&Math.abs(k-kr)<1e-9){ const g=gcd(kr,q), K=kr/g, Q=q/g; const top=b===1?String(K):(K===1?"":K)+"\\sqrt{"+b+"}"; return s+(Q===1?top:"\\dfrac{"+top+"}{"+Q+"}"); } }
  return String(Math.round(v*1000)/1000); }

 {id:"los",title:"Law of Sines",idea:"$\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B} = \\dfrac{c}{\\sin C}$. Use it when you know an angle and the side across from it (AAS, ASA, SSA).",
  lesson:{steps:[["A = 40^\\circ,\\ B = 60^\\circ,\\ a = 10","Find $b$."],["\\dfrac{10}{\\sin 40^\\circ} = \\dfrac{b}{\\sin 60^\\circ}","Pair each side with its opposite angle."],["b = \\dfrac{10\\sin 60^\\circ}{\\sin 40^\\circ} \\approx 13.5","Solve."]],warn:"SSA can give $0$, $1$, or $2$ triangles — the <b>ambiguous case</b>."},
  gen:[
  ()=>{let A,B;do{A=rnd(25,85);B=rnd(25,85)}while(A+B>165||A===B);const a=rnd(5,25),b=a*sinD(B)/sinD(A);return{q:`In $\\triangle ABC$, $A = ${A}^\\circ$, $B = ${B}^\\circ$, and $a = ${a}$. Find $b$. (Nearest tenth.)`,type:"number",tol:0.06,ans:b,ansTex:`${r1(b)}`,hint:"$\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B}$.",sol:[`$b = \\dfrac{${a}\\sin ${B}^\\circ}{\\sin ${A}^\\circ} \\approx ${r1(b)}$.`]}},
  ()=>{let A,B;do{A=rnd(20,80);B=rnd(20,80)}while(A+B>160);const C=180-A-B,a=rnd(5,25),c=a*sinD(C)/sinD(A);return{q:`In $\\triangle ABC$, $A = ${A}^\\circ$, $B = ${B}^\\circ$, and $a = ${a}$. Find $c$. (Nearest tenth.)`,type:"number",tol:0.06,ans:c,ansTex:`${r1(c)}`,hint:"First find $C = 180^\\circ - A - B$.",sol:[`$C = ${C}^\\circ$.`,`$c = \\dfrac{${a}\\sin ${C}^\\circ}{\\sin ${A}^\\circ} \\approx ${r1(c)}$.`]}},
  ()=>{const A=rnd(25,80),b=rnd(5,15),a=b+rnd(2,10),B=D(Math.asin(b*sinD(A)/a));return{q:`In $\\triangle ABC$, $A = ${A}^\\circ$, $a = ${a}$, and $b = ${b}$. Find angle $B$ in degrees. (Nearest tenth.)`,type:"number",tol:0.06,ans:B,ansTex:`${r1(B)}^\\circ`,hint:"$\\sin B = \\dfrac{b\\sin A}{a}$. Since $a > b$, only the acute answer works.",sol:[`$\\sin B = \\dfrac{${b}\\sin ${A}^\\circ}{${a}}$, $B \\approx ${r1(B)}^\\circ$.`]}},
  ()=>{let A,a,b,h,n;do{A=rnd(25,70);b=rnd(8,20);h=b*sinD(A);const c=rnd(0,2);a=c===0?rnd(2,Math.floor(h)):c===1?rnd(Math.ceil(h),b-1):rnd(b,b+8)}while(Math.abs(a-h)<0.3||a<1);n=a<h?0:a<b?2:1;return{q:`In $\\triangle ABC$, $A = ${A}^\\circ$, $a = ${a}$, and $b = ${b}$. How many triangles are possible?`,type:"number",ans:n,ansTex:`${n}`,hint:"Compare $a$ with the height $h = b\\sin A$ and with $b$.",sol:[`$h = ${b}\\sin ${A}^\\circ \\approx ${r1(h)}$.`,a<h?"$a < h$: no triangle.":a<b?"$h < a < b$: two triangles.":"$a \\ge b$: one triangle."]}},
  ()=>{let A,B;do{A=rnd(25,80);B=rnd(25,80)}while(A+B>160);const C=180-A-B,a=rnd(5,20),K=a*a*sinD(B)*sinD(C)/(2*sinD(A));return{q:`In $\\triangle ABC$, $A = ${A}^\\circ$, $B = ${B}^\\circ$, and $a = ${a}$. Find the area. (Nearest tenth.)`,type:"number",tol:0.06,ans:K,ansTex:`${r1(K)}`,hint:"Find another side with the Law of Sines, then use $\\tfrac12 ab\\sin C$.",sol:[`$C = ${C}^\\circ$, $b = \\dfrac{${a}\\sin ${B}^\\circ}{\\sin ${A}^\\circ}$.`,`Area $= \\tfrac12 ab\\sin C \\approx ${r1(K)}$.`]}}
 ]},
 {id:"loc",title:"Law of Cosines",idea:"$c^2 = a^2 + b^2 - 2ab\\cos C$. Use it for SAS (find the third side) and SSS (find an angle).",
  lesson:{steps:[["a = 5,\\ b = 8,\\ C = 60^\\circ","Find $c$."],["c^2 = 25 + 64 - 2(5)(8)\\cos 60^\\circ","$\\cos 60^\\circ = \\tfrac12$."],["c^2 = 49,\\ c = 7","Done."]],warn:"In SSS, find the <b>largest</b> angle first — it is the only one that might be obtuse."},
  gen:[
  ()=>{const a=rnd(4,20),b=rnd(4,20),C=rnd(20,150),c=Math.sqrt(a*a+b*b-2*a*b*cosD(C));return{q:`In $\\triangle ABC$, $a = ${a}$, $b = ${b}$, and $C = ${C}^\\circ$. Find $c$. (Nearest tenth.)`,type:"number",tol:0.06,ans:c,ansTex:`${r1(c)}`,hint:"$c^2 = a^2 + b^2 - 2ab\\cos C$.",sol:[`$c^2 = ${a*a} + ${b*b} - ${2*a*b}\\cos ${C}^\\circ$, $c \\approx ${r1(c)}$.`]}},
  ()=>{let a,b,c;do{a=rnd(3,15);b=rnd(3,15);c=rnd(3,15)}while(a+b<=c||a+c<=b||b+c<=a);const C=D(Math.acos((a*a+b*b-c*c)/(2*a*b)));return{q:`A triangle has sides $a = ${a}$, $b = ${b}$, and $c = ${c}$. Find angle $C$ in degrees. (Nearest tenth.)`,type:"number",tol:0.06,ans:C,ansTex:`${r1(C)}^\\circ`,hint:"$\\cos C = \\dfrac{a^2 + b^2 - c^2}{2ab}$.",sol:[`$\\cos C = \\dfrac{${a*a} + ${b*b} - ${c*c}}{${2*a*b}}$, $C \\approx ${r1(C)}^\\circ$.`]}},
  ()=>{const t=pick([[3,5,120,7],[5,8,60,7],[3,8,60,7],[7,8,120,13],[8,15,60,13],[5,16,120,19],[5,21,60,19]]),k=rnd(1,2),sw=Math.random()<.5;const a=k*(sw?t[1]:t[0]),b=k*(sw?t[0]:t[1]);return{q:`In $\\triangle ABC$, $a = ${a}$, $b = ${b}$, and $C = ${t[2]}^\\circ$. Find the exact length $c$.`,type:"number",ans:k*t[3],ansTex:`${k*t[3]}`,hint:`$\\cos ${t[2]}^\\circ = ${t[2]===60?"\\tfrac12":"-\\tfrac12"}$.`,sol:[`$c^2 = ${a*a} + ${b*b} ${t[2]===60?"-":"+"} ${a*b} = ${(k*t[3])**2}$.`,`$c = ${k*t[3]}$.`]}},
  ()=>{const s1=rnd(10,40),s2=rnd(10,40),th=rnd(30,150),t=rnd(2,5),d=Math.sqrt((s1*t)**2+(s2*t)**2-2*s1*s2*t*t*cosD(th));return{q:`Two ships leave port at the same time. One sails at $${s1}$ mph, the other at $${s2}$ mph, on courses $${th}^\\circ$ apart. How far apart are they after $${t}$ hours? (Nearest tenth of a mile.)`,type:"number",tol:0.06,ans:d,ansTex:`${r1(d)}`,hint:"Find each distance traveled, then use the Law of Cosines.",sol:[`Sides $${s1*t}$ and $${s2*t}$, angle $${th}^\\circ$.`,`$d \\approx ${r1(d)}$ mi.`]}},
  ()=>{let a,b,c;do{a=rnd(2,9);b=rnd(a,10);c=rnd(b,12)}while(a+b<=c||c===a);const N=a*a+b*b-c*c;return{q:`A triangle has sides $${a}$, $${b}$, and $${c}$. Find the cosine of its largest angle.`,type:"number",ans:N/(2*a*b),ansTex:frac(N,2*a*b),hint:"The largest angle is opposite the longest side.",sol:[`$\\cos C = \\dfrac{${a*a} + ${b*b} - ${c*c}}{2(${a})(${b})} = ${frac(N,2*a*b)}$.`]}}
 ]},
 {id:"tarea",title:"Triangle Area & Heron's Formula",idea:"Area $= \\tfrac12 ab\\sin C$ (SAS). <b>Heron</b>: with $s = \\tfrac{a + b + c}{2}$, area $= \\sqrt{s(s - a)(s - b)(s - c)}$.",
  lesson:{steps:[["a = 13,\\ b = 14,\\ c = 15","$s = 21$."],["\\sqrt{21\\cdot 8\\cdot 7\\cdot 6}","Heron's formula."],["\\sqrt{7056} = 84","The area."]],warn:"$s$ is <b>half</b> the perimeter, not the whole perimeter."},
  gen:[
  ()=>{const a=rnd(2,14),b=rnd(2,14),C=pick([30,45,60,90,120,135,150]),K=a*b*sinD(C)/2;return{q:`Find the exact area of a triangle with sides $${a}$ and $${b}$ and included angle $${C}^\\circ$. (Type like 6sqrt(3).)`,type:"number",ans:K,ansTex:numTex(K),hint:"Area $= \\tfrac12 ab\\sin C$.",sol:[`$\\tfrac12(${a})(${b})\\sin ${C}^\\circ = ${numTex(K)}$.`]}},
  ()=>{const a=rnd(4,25),b=rnd(4,25),C=rnd(15,165),K=a*b*sinD(C)/2;return{q:`Find the area of a triangle with sides $${a}$ and $${b}$ and included angle $${C}^\\circ$. (Nearest tenth.)`,type:"number",tol:0.06,ans:K,ansTex:`${r1(K)}`,hint:"Area $= \\tfrac12 ab\\sin C$.",sol:[`$\\tfrac12(${a})(${b})\\sin ${C}^\\circ \\approx ${r1(K)}$.`]}},
  ()=>{const t=pick(HERON),k=rnd(1,3);return{q:`Find the area of a triangle with sides $${k*t[0]}$, $${k*t[1]}$, and $${k*t[2]}$.`,type:"number",ans:k*k*t[3],ansTex:`${k*k*t[3]}`,hint:"Heron's formula with $s = \\tfrac{a + b + c}{2}$.",sol:[`$s = ${k*(t[0]+t[1]+t[2])/2}$.`,`Area $= ${k*k*t[3]}$.`]}},
  ()=>{let a,b,c;do{a=rnd(3,20);b=rnd(3,20);c=rnd(3,20)}while(a+b<=c||a+c<=b||b+c<=a);const s=(a+b+c)/2,K=Math.sqrt(s*(s-a)*(s-b)*(s-c));return{q:`Find the area of a triangle with sides $${a}$, $${b}$, and $${c}$. (Nearest tenth.)`,type:"number",tol:0.06,ans:K,ansTex:`${r1(K)}`,hint:"Heron's formula.",sol:[`$s = ${s}$, area $= \\sqrt{${s}(${s-a})(${s-b})(${s-c})} \\approx ${r1(K)}$.`]}},
  ()=>{const t=pick(HERON),k=rnd(1,2),[a,b,c,K0]=[k*t[0],k*t[1],k*t[2],k*k*t[3]],inr=Math.random()<.5;return inr?{q:`A triangle has sides $${a}$, $${b}$, and $${c}$. Find the radius of its inscribed circle.`,type:"number",ans:2*K0/(a+b+c),ansTex:frac(2*K0,a+b+c),hint:"Area $= rs$, where $s$ is the semiperimeter.",sol:[`Area $= ${K0}$, $s = ${(a+b+c)/2}$.`,`$r = ${frac(2*K0,a+b+c)}$.`]}:{q:`A triangle has sides $${a}$, $${b}$, and $${c}$. Find the radius of its circumscribed circle.`,type:"number",ans:a*b*c/(4*K0),ansTex:frac(a*b*c,4*K0),hint:"$R = \\dfrac{abc}{4K}$, where $K$ is the area.",sol:[`Area $K = ${K0}$.`,`$R = \\dfrac{${a*b*c}}{${4*K0}} = ${frac(a*b*c,4*K0)}$.`]}}
 ]}
]},

{id:"ch8",title:"Vectors",topics:[
 {id:"vcomp",title:"Components, Magnitude & Unit Vectors",idea:"$\\vec{PQ} = \\langle x_2 - x_1, y_2 - y_1\\rangle$. Magnitude $\\|\\langle a, b\\rangle\\| = \\sqrt{a^2 + b^2}$. A unit vector is $\\dfrac{\\vec v}{\\|\\vec v\\|}$.",
  lesson:{steps:[["P(1, 2),\\ Q(4, 6)","Find $\\vec{PQ}$."],["\\langle 4 - 1,\\ 6 - 2\\rangle = \\langle 3, 4\\rangle","End minus start."],["\\|\\vec{PQ}\\| = \\sqrt{9 + 16} = 5","Its length."]],warn:"Always subtract start from end: $Q - P$, not $P - Q$."},
  gen:[
  ()=>{const x1=nz(-8,8),y1=nz(-8,8),x2=nz(-8,8),y2=nz(-8,8);return{q:`Find the component form of $\\vec{PQ}$ for $P(${x1}, ${y1})$ and $Q(${x2}, ${y2})$. (Type like &lt;3, -2&gt;.)`,type:"point",ans:[x2-x1,y2-y1],ansTex:vtex(x2-x1,y2-y1),hint:"Subtract: end minus start.",sol:[`$\\langle ${x2} - ${P(x1)},\\ ${y2} - ${P(y1)}\\rangle = ${vtex(x2-x1,y2-y1)}$.`]}},
  ()=>{const tr=Math.random()<.6;let a,b;if(tr){const t=pick(TRIP.slice(0,4));a=t[0]*pick([1,-1]);b=t[1]*pick([1,-1]);if(Math.random()<.5)[a,b]=[b,a]}else{a=nz(-7,7);b=nz(-7,7)}const m=a*a+b*b;return{q:`Find the magnitude of $\\vec v = ${vtex(a,b)}$.`,type:"number",ans:Math.sqrt(m),ansTex:rad(m),hint:"$\\sqrt{a^2 + b^2}$.",sol:[`$\\sqrt{${a*a} + ${b*b}} = ${rad(m)}$.`]}},
  ()=>{const u=[nz(-6,6),nz(-6,6)],v=[nz(-6,6),nz(-6,6)],p=rnd(2,4),q=rnd(1,3),r=[p*u[0]-q*v[0],p*u[1]-q*v[1]];return{q:`$\\vec u = ${vtex(...u)}$ and $\\vec v = ${vtex(...v)}$. Find $${p}\\vec u - ${q===1?"":q}\\vec v$.`,type:"point",ans:r,ansTex:vtex(...r),hint:"Scale each vector, then subtract component by component.",sol:[`$${vtex(p*u[0],p*u[1])} - ${vtex(q*v[0],q*v[1])} = ${vtex(...r)}$.`]}},
  ()=>{const t=pick(TRIP.slice(0,4));let a=t[0]*pick([1,-1]),b=t[1]*pick([1,-1]);if(Math.random()<.5)[a,b]=[b,a];const c=t[2];return{q:`Find the unit vector in the direction of $${vtex(a,b)}$.`,type:"point",ans:[a/c,b/c],ansTex:vtex(frac(a,c),frac(b,c)),hint:"Divide each component by the magnitude.",sol:[`Magnitude $${c}$, unit vector $${vtex(frac(a,c),frac(b,c))}$.`]}},
  ()=>{const m=2*rnd(1,10),th=pick(ANG),x=m*cosD(th),y=m*sinD(th);return{q:`A vector has magnitude $${m}$ and direction angle $${th}^\\circ$. Find its exact component form. (Type like &lt;5sqrt(3), 5&gt;.)`,type:"point",ans:[x,y],ansTex:vtex(numTex(x),numTex(y)),hint:"$\\langle \\|v\\|\\cos\\theta,\\ \\|v\\|\\sin\\theta\\rangle$.",sol:[`$\\langle ${m}\\cos ${th}^\\circ,\\ ${m}\\sin ${th}^\\circ\\rangle = ${vtex(numTex(x),numTex(y))}$.`]}}
 ]},
 {id:"dot",title:"Dot Product & Angles",idea:"$\\vec u\\cdot\\vec v = u_1v_1 + u_2v_2 = \\|\\vec u\\|\\|\\vec v\\|\\cos\\theta$. The vectors are <b>orthogonal</b> when the dot product is $0$.",
  lesson:{steps:[["\\langle 3, 4\\rangle\\cdot\\langle 4, -3\\rangle","Multiply matching components."],["12 - 12 = 0","Add."],["\\text{orthogonal}","The angle is $90^\\circ$."]],warn:"The dot product is a <b>number</b>, not a vector."},
  gen:[
  ()=>{const u=[nz(-8,8),nz(-8,8)],v=[nz(-8,8),nz(-8,8)],d=u[0]*v[0]+u[1]*v[1];return{q:`Find $${vtex(...u)}\\cdot${vtex(...v)}$.`,type:"number",ans:d,ansTex:`${d}`,hint:"$u_1v_1 + u_2v_2$.",sol:[`$${u[0]*v[0]} ${sg(u[1]*v[1])} = ${d}$.`]}},
  ()=>{let u,v;do{u=[nz(-6,6),nz(-6,6)];v=[nz(-6,6),nz(-6,6)]}while(u[0]*v[1]===u[1]*v[0]);const d=u[0]*v[0]+u[1]*v[1],th=D(Math.acos(d/Math.hypot(...u)/Math.hypot(...v)));return{q:`Find the angle between $${vtex(...u)}$ and $${vtex(...v)}$ in degrees. (Nearest tenth.)`,type:"number",tol:0.06,ans:th,ansTex:`${r1(th)}^\\circ`,hint:"$\\cos\\theta = \\dfrac{\\vec u\\cdot\\vec v}{\\|\\vec u\\|\\|\\vec v\\|}$.",sol:[`$\\cos\\theta = \\dfrac{${d}}{\\sqrt{${u[0]**2+u[1]**2}}\\sqrt{${v[0]**2+v[1]**2}}}$, $\\theta \\approx ${r1(th)}^\\circ$.`]}},
  ()=>{let a,b,c,k;do{a=nz(-6,6);b=nz(-6,6);c=nz(-6,6);k=-a*b/c}while(!Number.isInteger(k));return{q:`Find $k$ so that $${vtex(a,"k")}$ and $${vtex(b,c)}$ are orthogonal.`,type:"number",ans:k,ansTex:`k = ${k}`,hint:"Set the dot product equal to $0$.",sol:[`$${a*b} + ${c}k = 0 \\Rightarrow k = ${k}$.`]}},
  ()=>{let u,v;do{u=[nz(-6,6),nz(-6,6)];v=[nz(-4,4),nz(-4,4)]}while(u[0]*v[0]+u[1]*v[1]===0);const d=u[0]*v[0]+u[1]*v[1],m=v[0]**2+v[1]**2;return{q:`Find the projection of $\\vec u = ${vtex(...u)}$ onto $\\vec v = ${vtex(...v)}$.`,type:"point",ans:[d*v[0]/m,d*v[1]/m],ansTex:vtex(frac(d*v[0],m),frac(d*v[1],m)),hint:"$\\text{proj}_{\\vec v}\\vec u = \\dfrac{\\vec u\\cdot\\vec v}{\\|\\vec v\\|^2}\\vec v$.",sol:[`$\\dfrac{${d}}{${m}}${vtex(...v)} = ${vtex(frac(d*v[0],m),frac(d*v[1],m))}$.`]}},
  ()=>{const F=rnd(10,80),d=rnd(20,200),th=rnd(15,60),W=F*d*cosD(th);return{q:`A force of $${F}$ lb, pulling at $${th}^\\circ$ above the horizontal, drags a crate $${d}$ ft along the floor. How much work is done? (Nearest tenth of a ft-lb.)`,type:"number",tol:0.06,ans:W,ansTex:`${r1(W)}`,hint:"$W = \\|\\vec F\\|\\|\\vec d\\|\\cos\\theta$.",sol:[`$W = ${F}\\cdot ${d}\\cos ${th}^\\circ \\approx ${r1(W)}$ ft-lb.`]}}
 ]},

  ()=>{const s=rnd(150,500),w=rnd(20,60),dir=pick([["east",[1,0]],["west",[-1,0]],["northeast",[Math.SQRT1_2,Math.SQRT1_2]],["southeast",[Math.SQRT1_2,-Math.SQRT1_2]]]);const g=Math.hypot(w*dir[1][0],s+w*dir[1][1]);return{q:`A plane flies due north at $${s}$ mph through a $${w}$-mph wind blowing toward the ${dir[0]}. Find the plane's ground speed. (Nearest tenth.)`,type:"number",tol:0.06,ans:g,ansTex:`${r1(g)}`,hint:"Write both velocities as vectors, add them, and find the magnitude.",sol:[`$\\vec v = \\langle 0, ${s}\\rangle + \\vec w$, $\\|\\vec v\\| \\approx ${r1(g)}$ mph.`]}},

 {id:"seq",title:"Sequences & Series",idea:"Arithmetic: $a_n = a_1 + (n - 1)d$. Geometric: $a_n = a_1r^{n-1}$. Infinite geometric sum $\\dfrac{a_1}{1 - r}$ when $|r| < 1$. A <b>recursive</b> rule builds each term from the one before.",
  lesson:{steps:[["\\displaystyle\\sum_{k=1}^{4}(2k + 1)","Write out the terms."],["3 + 5 + 7 + 9","$k = 1, 2, 3, 4$."],["24","Add."]],warn:"In $\\sum_{k=1}^{n}$, count the terms: there are $n$ of them, not $n - 1$."},
  gen:[
  ()=>{const a=nz(-15,15),d=nz(-7,7),n=rnd(8,40);return{q:`Arithmetic sequence: $a_1 = ${a}$, $d = ${d}$. Find $a_{${n}}$.`,type:"number",ans:a+(n-1)*d,ansTex:`${a+(n-1)*d}`,hint:"$a_n = a_1 + (n - 1)d$.",sol:[`$${a} + ${n-1}(${d}) = ${a+(n-1)*d}$.`]}},
  ()=>{const a=nz(-5,5),b=rnd(-9,9),n=rnd(5,30),S=a*n*(n+1)/2+b*n;return{q:`Evaluate $\\displaystyle\\sum_{k=1}^{${n}} (${lin(a,b,"k")})$.`,type:"number",ans:S,ansTex:`${S}`,hint:"Split: $a\\sum k + \\sum b$, with $\\sum_{k=1}^{n} k = \\dfrac{n(n + 1)}{2}$.",sol:[`$${a}\\cdot\\dfrac{${n}\\cdot${n+1}}{2} ${sg(b)}\\cdot ${n} = ${S}$.`]}},
  ()=>{const a=nz(-20,20),q=rnd(2,6),p=nz(-(q-1),q-1);return{q:`Find the sum of the infinite geometric series with first term $${a}$ and ratio $${frac(p,q)}$.`,type:"number",ans:a/(1-p/q),ansTex:frac(a*q,q-p),hint:"$S = \\dfrac{a_1}{1 - r}$.",sol:[`$\\dfrac{${a}}{1 - (${frac(p,q)})} = ${frac(a*q,q-p)}$.`]}},
  ()=>{const a=nz(-5,5),m=pick([2,3,-2,-1]),c=nz(-5,5);let v=a;for(let i=2;i<=5;i++)v=m*v+c;return{q:`$a_1 = ${a}$ and $a_n = ${m===-1?"-":m}a_{n-1} ${sg(c)}$. Find $a_5$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Build the terms one at a time.",sol:[`Compute $a_2, a_3, a_4$, then $a_5 = ${v}$.`]}},
  ()=>{const n=rnd(5,50),odd=Math.random()<.5;return odd?{q:`Evaluate $\\displaystyle\\sum_{k=1}^{${n}} \\dfrac{1}{(2k - 1)(2k + 1)}$.`,type:"number",ans:n/(2*n+1),ansTex:frac(n,2*n+1),hint:"Partial fractions: $\\dfrac{1}{(2k - 1)(2k + 1)} = \\dfrac12\\left(\\dfrac{1}{2k - 1} - \\dfrac{1}{2k + 1}\\right)$ — it telescopes.",sol:[`$\\dfrac12\\left(1 - \\dfrac{1}{${2*n+1}}\\right) = ${frac(n,2*n+1)}$.`]}:{q:`Evaluate $\\displaystyle\\sum_{k=1}^{${n}} \\dfrac{1}{k(k + 1)}$.`,type:"number",ans:n/(n+1),ansTex:frac(n,n+1),hint:"$\\dfrac{1}{k(k + 1)} = \\dfrac1k - \\dfrac{1}{k + 1}$ — the middle terms cancel.",sol:[`$1 - \\dfrac{1}{${n+1}} = ${frac(n,n+1)}$.`]}}
 ]},
 {id:"binom",title:"The Binomial Theorem",idea:"$(a + b)^n = \\displaystyle\\sum_{k=0}^{n}\\binom{n}{k}a^{n-k}b^k$, with $\\dbinom{n}{k} = \\dfrac{n!}{k!(n - k)!}$ (the numbers in Pascal's triangle).",
  lesson:{steps:[["(x + 2)^3","$n = 3$: coefficients $1, 3, 3, 1$."],["x^3 + 3x^2(2) + 3x(2^2) + 2^3","Powers of $2$ go up."],["x^3 + 6x^2 + 12x + 8","Simplify."]],warn:"Include the sign and the number inside: in $(2x - 3)^n$ each term carries powers of $2$ and of $-3$."},
  gen:[
  ()=>{const n=rnd(4,12),k=rnd(2,n-2);return{q:`Evaluate $\\dbinom{${n}}{${k}}$.`,type:"number",ans:nCr(n,k),ansTex:`${nCr(n,k)}`,hint:"$\\dfrac{n!}{k!(n - k)!}$.",sol:[`$\\dbinom{${n}}{${k}} = ${nCr(n,k)}$.`]}},
  ()=>{const n=rnd(4,8),k=rnd(1,n-1),a=nz(-3,3),v=nCr(n,k)*a**(n-k);return{q:`Find the coefficient of $x^{${k}}$ in $(x ${sg(a)})^{${n}}$.`,type:"number",ans:v,ansTex:`${v}`,hint:`The $x^{${k}}$ term is $\\dbinom{${n}}{${k}}x^{${k}}(${a})^{${n-k}}$.`,sol:[`$\\dbinom{${n}}{${k}}(${a})^{${n-k}} = ${nCr(n,k)}\\cdot${a**(n-k)} = ${v}$.`]}},
  ()=>{const n=rnd(3,7),k=rnd(1,n-1),a=pick([2,3,-2]),b=nz(-3,3),v=nCr(n,k)*a**k*b**(n-k);return{q:`Find the coefficient of $x^{${k}}$ in $(${a}x ${sg(b)})^{${n}}$.`,type:"number",ans:v,ansTex:`${v}`,hint:`Term: $\\dbinom{${n}}{${k}}(${a}x)^{${k}}(${b})^{${n-k}}$.`,sol:[`$${nCr(n,k)}\\cdot${a**k}\\cdot${b**(n-k)} = ${v}$.`]}},
  ()=>{const sq=Math.random()<.5,a=nz(-3,3);if(sq){const n=3*rnd(1,3),j=2*n/3,v=nCr(n,j)*a**j;return{q:`Find the constant term of $\\left(x^2 ${a<0?"-":"+"} \\dfrac{${Math.abs(a)}}{x}\\right)^{${n}}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"General term $\\dbinom{n}{j}(x^2)^{n-j}\\left(\\tfrac{a}{x}\\right)^j$ has power $2n - 3j$. Set it to $0$.",sol:[`$2(${n}) - 3j = 0 \\Rightarrow j = ${j}$.`,`$\\dbinom{${n}}{${j}}(${a})^{${j}} = ${v}$.`]}}const n=2*rnd(2,4),v=nCr(n,n/2)*a**(n/2);return{q:`Find the constant term of $\\left(x ${a<0?"-":"+"} \\dfrac{${Math.abs(a)}}{x}\\right)^{${n}}$.`,type:"number",ans:v,ansTex:`${v}`,hint:"The $x$'s cancel when there are equally many of each factor.",sol:[`Middle term: $\\dbinom{${n}}{${n/2}}(${a})^{${n/2}} = ${v}$.`]}},
  ()=>{const a=nz(-3,3),b=nz(-3,3),n=rnd(3,7),mid=Math.random()<.5;if(mid){const N=2*rnd(2,4);return{q:`Find the sum of all the binomial coefficients in the expansion of $(x + y)^{${N}}$.`,type:"number",ans:2**N,ansTex:`${2**N}`,hint:"Set $x = y = 1$.",sol:[`$(1 + 1)^{${N}} = ${2**N}$.`]}}return{q:`Find the sum of all the coefficients of $(${a===1?"":a===-1?"-":a}x ${sg(b)})^{${n}}$ when expanded.`,type:"number",ans:(a+b)**n,ansTex:`${(a+b)**n}`,hint:"Plug in $x = 1$.",sol:[`$(${a} ${sg(b)})^{${n}} = ${(a+b)**n}$.`]}}
 ]},
 {id:"sums",title:"Sum Formulas & Induction",idea:"$\\sum k = \\dfrac{n(n + 1)}{2}$, $\\sum k^2 = \\dfrac{n(n + 1)(2n + 1)}{6}$, $\\sum k^3 = \\left(\\dfrac{n(n + 1)}{2}\\right)^2$. Formulas like these are proved by <b>mathematical induction</b>.",
  lesson:{steps:[["1 + 2 + \\cdots + 10","$n = 10$."],["\\dfrac{10\\cdot 11}{2}","Gauss's formula."],["55","Done."]],warn:"Induction: prove the first case, then show “true for $k$” forces “true for $k + 1$”."},
  gen:[
  ()=>{const n=rnd(10,200);return{q:`Find $1 + 2 + 3 + \\cdots + ${n}$.`,type:"number",ans:n*(n+1)/2,ansTex:`${n*(n+1)/2}`,hint:"$\\dfrac{n(n + 1)}{2}$.",sol:[`$\\dfrac{${n}\\cdot${n+1}}{2} = ${n*(n+1)/2}$.`]}},
  ()=>{const n=rnd(5,30),v=n*(n+1)*(2*n+1)/6;return{q:`Evaluate $\\displaystyle\\sum_{k=1}^{${n}} k^2$.`,type:"number",ans:v,ansTex:`${v}`,hint:"$\\dfrac{n(n + 1)(2n + 1)}{6}$.",sol:[`$\\dfrac{${n}\\cdot${n+1}\\cdot${2*n+1}}{6} = ${v}$.`]}},
  ()=>{const m=rnd(5,40),n=m+rnd(10,80),v=(n*(n+1)-(m-1)*m)/2;return{q:`Evaluate $\\displaystyle\\sum_{k=${m}}^{${n}} k$.`,type:"number",ans:v,ansTex:`${v}`,hint:`Sum to $${n}$, minus the sum to $${m-1}$. (Or: number of terms × average.)`,sol:[`$${n*(n+1)/2} - ${(m-1)*m/2} = ${v}$.`]}},
  ()=>{const n=rnd(5,20),c=nz(-6,6),d=rnd(-5,5),v=n*(n+1)*(2*n+1)/6+c*n*(n+1)/2+d*n;return{q:`Evaluate $\\displaystyle\\sum_{k=1}^{${n}} (k^2 ${cterm(c,"k")} ${d?sg(d):""})$.`,type:"number",ans:v,ansTex:`${v}`,hint:"Split into $\\sum k^2 + c\\sum k + \\sum d$.",sol:[`$${n*(n+1)*(2*n+1)/6} ${sg(c*n*(n+1)/2)} ${sg(d*n)} = ${v}$.`]}},
  ()=>{if(Math.random()<.5){const n=rnd(5,25),v=(n*(n+1)/2)**2;return{q:`Evaluate $1^3 + 2^3 + \\cdots + ${n}^3$.`,type:"number",ans:v,ansTex:`${v}`,hint:"$\\sum k^3 = \\left(\\dfrac{n(n + 1)}{2}\\right)^2$.",sol:[`$${n*(n+1)/2}^2 = ${v}$.`]}}const n=rnd(10,120),T=n*(n+1)/2;return{q:`$1 + 2 + 3 + \\cdots + n = ${T}$. Find $n$.`,type:"number",ans:n,ansTex:`${n}`,hint:`Solve $\\dfrac{n(n + 1)}{2} = ${T}$: $n(n + 1) = ${2*T}$.`,sol:[`$n(n + 1) = ${2*T} = ${n}\\cdot${n+1}$, so $n = ${n}$.`]}}
 ]}
]},

  ()=>{const a=nz(-5,5);return Math.random()<.5?{q:`Find $\\displaystyle\\lim_{x\\to ${a}} \\dfrac{x^3 ${a<0?"+":"-"} ${Math.abs(a**3)}}{x ${sg(-a)}}$.`,type:"number",ans:3*a*a,ansTex:`${3*a*a}`,hint:"Difference of cubes: $x^3 - a^3 = (x - a)(x^2 + ax + a^2)$.",sol:[`$x^2 + ${a}x + ${a*a} \\to ${3*a*a}$.`]}:{q:`Find $\\displaystyle\\lim_{x\\to ${a}} \\dfrac{\\frac1x - \\frac{1}{${a}}}{x ${sg(-a)}}$.`,type:"number",ans:-1/(a*a),ansTex:frac(-1,a*a),hint:"Combine the top into one fraction: $\\dfrac{a - x}{ax}$.",sol:[`$\\dfrac{${a} - x}{${a}x(x ${sg(-a)})} = -\\dfrac{1}{${a}x} \\to ${frac(-1,a*a)}$.`]}}
 ]},
 {id:"liminf",title:"Continuity, One-Sided Limits & Limits at Infinity",idea:"As $x \\to \\infty$, a rational function goes to the ratio of leading coefficients (same degree) or $0$ (bottom degree bigger). $f$ is <b>continuous</b> at $c$ when $\\displaystyle\\lim_{x\\to c} f(x) = f(c)$.",
  lesson:{steps:[["\\displaystyle\\lim_{x\\to\\infty}\\dfrac{3x^2 + 1}{2x^2 - x}","Same degree."],["\\dfrac{3}{2}","Ratio of leading coefficients."],["y = \\tfrac32","This is the horizontal asymptote."]],warn:"A piecewise function is continuous at the break only if both pieces give the same value there."},
  gen:[

  ()=>{const m=rnd(1,3),n=m+rnd(0,1),a=nz(-7,7),d=nz(-5,5);const top=[a],bot=[d];for(let i=0;i<m;i++)top.push(rnd(-5,5));for(let i=0;i<n;i++)bot.push(rnd(-5,5));const v=m===n?a/d:0;return{q:`Find $\\displaystyle\\lim_{x\\to -\\infty} \\dfrac{${ptex(top)}}{${ptex(bot)}}$.`,type:"number",ans:v,ansTex:m===n?frac(a,d):"0",hint:"Compare the degrees of top and bottom.",sol:[m===n?`Same degree: $${frac(a,d)}$.`:"The bottom has the larger degree: the limit is $0$."]}},

  ()=>{if(Math.random()<.5){const c=nz(-4,4),p=rnd(-6,6),m=nz(-4,4),q=rnd(-6,6),left=Math.random()<.5;const v=left?c*c+p:m*c+q;return{q:`$f(x) = \\begin{cases} x^2 ${p?sg(p):""}, & x < ${c} \\\\ ${lin(m,q)}, & x \\ge ${c} \\end{cases}$. Find $\\displaystyle\\lim_{x\\to ${c}^{${left?"-":"+"}}} f(x)$.`,type:"number",ans:v,ansTex:`${v}`,hint:`Use only the piece for $x ${left?"<":">"} ${c}$.`,sol:[`$${v}$.`]}}const a=nz(-5,5),left=Math.random()<.5;return{q:`Find $\\displaystyle\\lim_{x\\to ${a}^{${left?"-":"+"}}} \\dfrac{|x ${sg(-a)}|}{x ${sg(-a)}}$.`,type:"number",ans:left?-1:1,ansTex:left?"-1":"1",hint:`For $x ${left?"<":">"} ${a}$, the top equals ${left?"$-(x - a)$":"$x - a$"}.`,sol:[`$${left?-1:1}$.`]}},
  ()=>{const b=nz(-9,9),dd=rnd(-9,9);if(dd!==b&&Math.random()<.5){return{q:`Find $\\displaystyle\\lim_{x\\to\\infty}\\left(\\sqrt{${ptex([1,b,0])}} - \\sqrt{${ptex([1,dd,0])}}\\right)$.`,type:"number",ans:(b-dd)/2,ansTex:frac(b-dd,2),hint:"Multiply by the conjugate over itself; then divide top and bottom by $x$.",sol:[`$\\dfrac{${b-dd}x}{\\sqrt{x^2 + \\cdots} + \\sqrt{x^2 + \\cdots}} \\to ${frac(b-dd,2)}$.`]}}return{q:`Find $\\displaystyle\\lim_{x\\to\\infty}\\left(\\sqrt{${ptex([1,b,0])}} - x\\right)$.`,type:"number",ans:b/2,ansTex:frac(b,2),hint:"Multiply by $\\dfrac{\\sqrt{x^2 + bx} + x}{\\sqrt{x^2 + bx} + x}$.",sol:[`$\\dfrac{${b}x}{\\sqrt{x^2 ${cterm(b,"x")}} + x} \\to ${frac(b,2)}$.`]}}
 ]},
 {id:"deriv",title:"Rates of Change & the Derivative",idea:"Average rate of change $\\dfrac{f(b) - f(a)}{b - a}$ is a secant slope. The derivative $f'(x) = \\displaystyle\\lim_{h\\to 0}\\dfrac{f(x + h) - f(x)}{h}$ is the slope of the tangent line.",

const CONST=new Set(["pi","e","E","PI","Infinity"]);
function pre(s){ return String(s).replace(/°|\^\\circ|deg\b/g,"").replace(/θ/g,"theta").replace(/\barc(sin|cos|tan)\b/g,"a$1").replace(/(?<![a-z])(sin|cos|tan)\^\s*\(?-1\)?/g,"a$1")
  .replace(/(?<![a-z])log\s*\(([^(),]*)\)/g,"log10($1)").replace(/(?<![a-z])ln\s*\(/g,"log(").replace(/(?<![a-z])ln\s*(\d+(?:\.\d+)?|[a-z])\b/g,"log($1)")
  .replace(/(?<![a-z])(sin|cos|tan|sec|csc|cot)\s*\^\s*(\d+)\s*\(([^()]*)\)/g,"($1($3))^$2").replace(/(?<![a-z])(sin|cos|tan|sec|csc|cot)\s*\^\s*(\d+)\s*(\d*(?:x|theta))\b/g,"($1($3))^$2")
  .replace(/(?<![a-z])(sin|cos|tan|sec|csc|cot)\s*(\d*(?:x|theta))\b/g,"$1($2)").replace(/(?<![a-z_][a-z_0-9]*)(\d+(?:\.\d+)?|\))\s*(?=(?!(?:or|and)\b)(?!e[-+]?\d)[a-z(√])/gi,"$1*"); }
function clean(s){ return pre(s).replace(/\|([^|]+)\|/g,"abs($1)").replace(/(^|[^a-z])([a-z])\s*\(/gi,"$1$2*(").replace(/[−–]/g,"-").replace(/×|·/g,"*").replace(/÷/g,"/").replace(/π/g,"pi").replace(/≤|=</g,"<=").replace(/≥|=>/g,">=").replace(/√\s*(\d+(?:\.\d+)?|\([^)]*\)|[a-z])/g,"sqrt($1)").trim(); }

$("pAns").addEventListener("input",()=>{ const v=$("pAns").value.trim(),pv=$("pPrev"); if(!v||!window.katex){ pv.textContent=""; return; }
  try{ let tex; const c=clean(v);
    if(/<|>/.test(c)) tex=c.replace(/<=/g,"\\le ").replace(/>=/g,"\\ge ").replace(/\bor\b/gi,"\\text{ or }").replace(/\band\b/gi,"\\text{ and }");
    else tex=c.split("=").map(x=>math.parse(x).toTex({parenthesis:"auto",implicit:"hide"})).join(" = ");
    pv.innerHTML='<span class="pl">You wrote</span><span class="pm"></span>'; katex.render(tex,pv.querySelector(".pm"),{throwOnError:false}); }catch(e){ pv.textContent=""; } });

/* ---- placement ---- */
$("placeBtn").onclick=()=>{
  const PL=[0,1,2,0,1].map((ti,k)=>[CH.topics[ti%CH.topics.length],k+1]); let i=0,res=[],pr;
  const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<div class="card"><div class="phead"><h2>Where should I start?</h2><button class="btn ghost sm" id="qx">Close</button></div><div class="qprog" id="qp"></div><div class="problem" id="qq"></div><div class="row" id="qr"><input id="qa" type="text" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><button class="btn" id="qc">Check</button><button class="btn ghost" id="qs">I don't know</button></div><div class="howto" id="qh"></div><div id="qf"></div></div>`;
  document.body.appendChild(m); const q=id=>m.querySelector("#"+id);
  const prog=()=>{ q("qp").innerHTML=PL.map((_,k)=>`<i class="${k<res.length?(res[k]?"ok":"no"):k===i?"now":""}"></i>`).join(""); };
  const ask=()=>{ const [t,lv]=PL[i]; pr=t.gen[lv-1](); q("qq").innerHTML=`<span class="label">Question ${i+1} of 5 · Level ${lv}</span><div>${pr.q}</div>`; render(q("qq")); q("qa").value=""; q("qh").textContent=HOW[pr.type]; q("qf").innerHTML=""; prog(); q("qa").focus(); };
  const end=()=>{ const lvl=res.indexOf(false)===-1?5:res.indexOf(false)+1; st.rec=lvl; st.lvl=lvl; save(); recText(); topics(); prog();
    q("qq").innerHTML=`<span class="label">Result</span><div>Start at <b style="color:${LEVELS[lvl-1].c}">Level ${lvl} · ${LEVELS[lvl-1].name}</b>.</div><div style="font-size:15px;color:var(--muted)">${lvl===5?"You answered every question correctly — go for Competition!":lvl===1?"Foundation builds the base everything else needs. Move up whenever you get 3 in a row.":"You got the first "+(lvl-1)+" level"+(lvl===2?"":"s")+" right. Level "+lvl+" is the right challenge for you."}</div>`;
    q("qr").hidden=true; q("qh").textContent=""; q("qf").innerHTML=""; const b=document.createElement("button"); b.className="btn teal"; b.textContent="See the topics"; b.onclick=()=>m.remove(); q("qf").appendChild(b); };
  const answer=r=>{ res.push(r); if(!r){ end(); return; } i++; i>=PL.length?end():ask(); };
  q("qc").onclick=()=>{ const v=q("qa").value.trim(); if(!v) return; const r=check(pr,v); if(r===null){ q("qf").innerHTML=`<div class="fb hint">I couldn't read that. ${HOW[pr.type]}</div>`; return; } answer(r); };
  q("qa").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); q("qc").click(); } });
  q("qs").onclick=()=>answer(false); q("qx").onclick=()=>m.remove(); m.addEventListener("click",e=>{ if(e.target===m) m.remove(); });
  ask(); };

/* ---- learn ---- */
let LI=0, shown=1, TP=null, tDone=false, tTries=0;
function road(){ const r=$("road"); r.innerHTML=""; CH.topics.forEach((t,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="stop"+(st.learned[t.id]?" done":"")+(i===LI?" on":""); b.innerHTML=`<i>${st.learned[t.id]?"✓":i+1}</i>${t.title}`; b.onclick=()=>openLesson(i); r.appendChild(b); }); }
function openLesson(i,scroll){ LI=i; shown=1; tDone=false; tTries=0; TP=null; road(); drawLesson(); if(scroll) $("lesson").scrollIntoView({behavior:"smooth",block:"start"}); }
function drawLesson(){
  const t=CH.topics[LI], l=t.lesson, box=$("lesson");
  box.innerHTML=`<span class="label">Lesson ${LI+1} of ${CH.topics.length}</span><h2>${t.title}</h2><div class="big">${t.idea}</div>${l.fig||""}<span class="label">Simplest example — one step at a time</span><ol class="steps">${l.steps.slice(0,shown).map(s=>`<li><div><div class="m">$${s[0]}$</div><div class="w">${s[1]}</div></div></li>`).join("")}</ol>`;
  if(shown<l.steps.length){ const b=document.createElement("button"); b.className="btn"; b.style.alignSelf="flex-start"; b.textContent="Next step →"; b.onclick=()=>{ shown++; drawLesson(); }; box.appendChild(b);
    const s=document.createElement("button"); s.className="btn ghost sm"; s.style.alignSelf="flex-start"; s.textContent="Show all steps"; s.onclick=()=>{ shown=l.steps.length; drawLesson(); }; box.appendChild(s); }
  else {
    box.insertAdjacentHTML("beforeend",`<div class="warn"><b>Watch out: </b>${l.warn}</div>`);
    if(!TP) TP=t.gen[0]();
    const w=document.createElement("div"); w.className="turn";
    w.innerHTML=`<span class="label" style="color:var(--gold)">Your turn</span><div class="q">${TP.q}</div><div class="row"><input type="text" id="tAns" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><button class="btn" id="tChk">Check</button><button class="btn ghost" id="tHint">Hint</button></div><div class="howto">${HOW[TP.type]}</div><div id="tFb"></div>`;
    box.appendChild(w);
    const nav=document.createElement("div"); nav.className="lnav"; const left=document.createElement("div"); left.className="row";
    if(LI>0){ const pv=document.createElement("button"); pv.className="btn ghost sm"; pv.textContent="← Previous lesson"; pv.onclick=()=>openLesson(LI-1,true); left.appendChild(pv); }
    const right=document.createElement("div"); right.className="row"; right.id="tNext"; nav.append(left,right); box.appendChild(nav);
    const fbx=(k,tag,h)=>{ $("tFb").innerHTML=`<div class="fb ${k}"><span class="tag">${tag}</span>${h}</div>`; render($("tFb")); };
    const win=()=>{ tDone=true; st.learned[t.id]=true; save(); road(); $("tAns").disabled=true; $("tChk").disabled=true; $("tHint").disabled=true; showNext(); };
    const go=()=>{ if(tDone) return; const v=$("tAns").value.trim(); if(!v) return; const r=check(TP,v);
      if(r===null){ fbx("hint","Try again","I couldn't read that. "+HOW[TP.type]); return; }
      if(r){ fbx("good","Correct — you've got it!",`$${TP.ansTex}$`); win(); return; }
      tTries++; if(tTries<2) fbx("bad","Not yet",TP.hint+" Try again."); else { fbx("hint","Answer",`$${TP.ansTex}$. Try another one to make sure.`); const a=document.createElement("button"); a.className="btn ghost sm"; a.textContent="Try another"; a.onclick=()=>{ TP=t.gen[0](); tTries=0; drawLesson(); }; $("tFb").appendChild(a); } };
    $("tChk").onclick=go; $("tAns").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } }); $("tHint").onclick=()=>fbx("hint","Hint",TP.hint);
    if(st.learned[t.id]) showNext();
  }
  render(box);
}
function showNext(){ const r=$("tNext"); if(!r) return; r.innerHTML=""; const t=CH.topics[LI];
  const pr=document.createElement("button"); pr.className="btn ghost sm"; pr.textContent="Practice this topic"; pr.onclick=()=>{ setTab("practice"); startPractice(t,st.level[t.id]||st.rec||1); }; r.appendChild(pr);
  const n=document.createElement("button"); n.className="btn teal sm";
  if(LI<CH.topics.length-1){ n.textContent="Next lesson →"; n.onclick=()=>openLesson(LI+1,true); } else { n.textContent="Start practicing →"; n.onclick=()=>{ setTab("practice"); window.scrollTo({top:0,behavior:"smooth"}); }; }
  r.appendChild(n); }
function setTab(t){ $("learnView").hidden=t!=="learn"; $("practiceView").hidden=t!=="practice"; $("tabLearn").classList.toggle("on",t==="learn"); $("tabPractice").classList.toggle("on",t==="practice"); try{ history.replaceState(null,"","#"+CH.id+"-"+t); }catch(e){} }
function openChapter(id,tab){
  useChapter(id); $("chTitle").textContent="Chapter "+ALLCH.find(c=>c[2]===CH.id)[0]+": "+CH.title; $("practice").hidden=true;
  chapters(); recText(); topics(); const first=CH.topics.findIndex(t=>!st.learned[t.id]); openLesson(first<0?0:first);
  setTab(tab||(first<0?"practice":"learn")); }
document.addEventListener("click",e=>{ const d=e.target.closest(".mc > div"); if(!d) return; const card=d.closest(".practice, .turn, .modal .card"); const inp=card&&card.querySelector("input[type=text]"); if(inp&&!inp.disabled){ inp.value=d.querySelector("b").textContent.trim()[0]; inp.focus(); d.parentElement.querySelectorAll("div").forEach(x=>x.classList.toggle("sel",x===d)); } });
$("tabLearn").onclick=()=>setTab("learn"); $("tabPractice").onclick=()=>setTab("practice");
window.addEventListener("load",()=>{ legend(); const m=/^#(ch\d+)(?:-(learn|practice))?$/.exec(location.hash); openChapter(m?m[1]:ST.cur,m?m[2]:null); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
